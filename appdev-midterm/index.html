<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AppDev midterm reviewer: Ionic + Angular (NgModule)</title>
<style>
:root{
  --bg:#0b0e14; --panel:#11151c; --panel2:#161b22; --line:#232a36;
  --fg:#d7dae0; --dim:#8b93a1; --accent:#4c8dff; --ok:#3fb950;
  --bad:#f85149; --warn:#d29922; --code:#0d1117;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--fg); font:15px/1.55 -apple-system,BlinkMacSystemFont,
  "Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
header{
  position:sticky; top:0; z-index:20; background:var(--panel);
  border-bottom:1px solid var(--line); padding:10px 16px;
  display:flex; flex-wrap:wrap; gap:12px; align-items:center;
}
h1{font-size:15px; margin:0; font-weight:650; letter-spacing:.2px}
h1 small{color:var(--dim); font-weight:400; margin-left:8px}
nav.modes{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap}
nav.modes button{
  background:var(--panel2); color:var(--fg); border:1px solid var(--line);
  border-radius:7px; padding:6px 12px; cursor:pointer; font:inherit; font-size:13.5px;
}
nav.modes button.on{background:var(--accent); color:#12141a; border-color:var(--accent); font-weight:600}
#prog{color:var(--dim); font-size:12.5px}
.wrap{display:flex; min-height:calc(100vh - 53px); align-items:flex-start}
aside{
  width:290px; flex:0 0 290px; border-right:1px solid var(--line);
  padding:12px; position:sticky; top:53px; max-height:calc(100vh - 53px); overflow:auto;
}
main{flex:1; min-width:0; padding:18px 22px 60px}
.side-h{font-size:11.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin:14px 0 6px}
.side-h:first-child{margin-top:0}
.tree button{
  display:block; width:100%; text-align:left; background:none; border:0; color:var(--fg);
  font:inherit; font-size:13.5px; padding:4px 8px; border-radius:6px; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.tree button:hover{background:var(--panel2)}
.tree button.on{background:var(--accent); color:#12141a; font-weight:600}
.tree .dir{color:var(--dim); font-size:12.5px; padding:8px 8px 2px}
.tree .name{padding-left:14px}
section.mode{display:none}
section.mode.on{display:block}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:11px;
  padding:14px 16px; margin:0 0 16px;
}
.card > h2{margin:0 0 4px; font-size:16px}
.card > h2 .tag{
  font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:20px;
  padding:1px 8px; margin-left:8px; vertical-align:middle; font-weight:400;
}
.meta{color:var(--dim); font-size:12.5px; margin:2px 0 10px}
.goal{color:var(--fg); margin:6px 0 10px}
ul.notes{margin:8px 0 10px; padding-left:20px}
ul.notes li{margin:4px 0}
.verify{border-left:3px solid var(--ok); padding:6px 0 6px 10px; color:var(--dim); margin:10px 0; font-size:13.5px}
pre{
  background:var(--code); border:1px solid var(--line); border-radius:9px;
  padding:12px 14px; overflow:auto; margin:10px 0; font-size:13px; line-height:1.5;
}
code,pre{font-family:"Cascadia Mono","Consolas","SF Mono",Menlo,monospace}
.c-k{color:#c678dd} .c-s{color:#98c379} .c-c{color:#5c6370; font-style:italic}
.c-n{color:#d19a66} .c-t{color:#e06c75} .c-v{color:#e5c07b} .c-d{color:#61afef}
textarea{
  width:100%; min-height:150px; background:var(--code); color:var(--fg);
  border:1px solid var(--line); border-radius:9px; padding:10px 12px;
  font-family:"Cascadia Mono","Consolas",Menlo,monospace; font-size:13px; line-height:1.5;
  resize:vertical;
}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0}
button.act{
  background:var(--panel2); color:var(--fg); border:1px solid var(--line);
  border-radius:7px; padding:6px 12px; cursor:pointer; font:inherit; font-size:13px;
}
button.act:hover{border-color:var(--accent)}
button.act.primary{background:var(--accent); color:#12141a; border-color:var(--accent); font-weight:600}
.verdict{font-size:13px; padding:2px 0}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.part{color:var(--warn)}
details{border:1px solid var(--line); border-radius:9px; margin:6px 0; background:var(--panel2)}
details > summary{cursor:pointer; padding:8px 12px; font-size:13.5px}
details[open] > summary{border-bottom:1px solid var(--line)}
details .inner{padding:4px 12px 12px}
.hidden{display:none}
input.blank{
  background:#10131a; color:var(--warn); border:1px solid var(--line); border-radius:5px;
  font-family:"Cascadia Mono","Consolas",Menlo,monospace; font-size:13px;
  padding:2px 6px; width:11ch; text-align:center;
}
input.blank.ok{border-color:var(--ok); color:var(--ok)}
input.blank.bad{border-color:var(--bad); color:var(--bad)}
ol.q{margin:0; padding-left:0; list-style:none}
li.qi{border:1px solid var(--line); border-radius:9px; padding:10px 14px; margin:0 0 10px; background:var(--panel2)}
.qi .stem{font-weight:600; margin:0 0 8px}
.qi label{display:block; padding:4px 0; cursor:pointer; font-size:14px}
.qi .why{margin-top:8px; font-size:13px; color:var(--dim); border-top:1px solid var(--line); padding-top:8px}
.pill{font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:20px; padding:1px 8px}
.pill.right{border-color:var(--ok); color:var(--ok)}
.pill.wrong{border-color:var(--bad); color:var(--bad)}
.copy{font-size:12px; color:var(--dim); float:right}
a{color:var(--accent)}
.warnbox{border-left:3px solid var(--warn); padding:8px 0 8px 12px; margin:12px 0; font-size:13.5px}
input.ans{
  background:#10131a; color:var(--warn); border:1px solid var(--line); border-radius:5px;
  font-family:"Cascadia Mono","Consolas",Menlo,monospace; font-size:13px;
  padding:3px 8px; width:30ch;
}
input.ans.ok{border-color:var(--ok); color:var(--ok)}
input.ans.bad{border-color:var(--bad); color:var(--bad)}
ol.idq{margin:0; padding-left:0; list-style:none}
li.idq{border-bottom:1px solid var(--line); padding:9px 0}
li.idq:last-child{border-bottom:0}
li.idq .num{color:var(--dim); font-size:12.5px; margin-right:6px}
li.idq .stem{margin:0 0 7px}
li.idq .cand{color:var(--dim); font-size:13px; margin-top:2px}
code.term{color:var(--warn); background:none}
u.uw{text-decoration-color:var(--warn); text-underline-offset:3px; font-weight:600}
.mtf{margin:0 0 10px}
.pill.sp{border-color:var(--warn); color:var(--warn)}
/* small-print drill: Part I filtered to the buried, easily-forgotten items */
ol.idq.smallonly li.idq:not(.sp){display:none}
.partbar{position:sticky; top:53px; z-index:10; background:var(--panel); border:1px solid var(--line);
  border-radius:9px; padding:8px 10px; margin:0 0 14px; display:flex; gap:6px; flex-wrap:wrap}
/* review mode: the lesson written material */
#m-review .revbar{position:sticky; top:53px; z-index:10; background:var(--panel); border:1px solid var(--line);
  border-radius:9px; padding:8px 10px; margin:0 0 14px; display:flex; gap:6px; flex-wrap:wrap}
#m-review .revbar .act.done{border-color:var(--ok); color:var(--ok)}
#m-review h3{margin:16px 0 6px; font-size:14.5px}
#m-review h2 .tag{float:none}
#m-review table{border-collapse:collapse; width:100%; margin:6px 0 10px; font-size:13px}
#m-review th, #m-review td{border:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top}
#m-review th{color:var(--dim); font-weight:600; background:none}
#m-review details{margin:8px 0 2px; border-top:1px solid var(--line); padding-top:6px}
#m-review summary{cursor:pointer; color:var(--dim); font-size:12.5px}
#m-review pre.revcode{margin:6px 0 10px; padding:9px 11px; overflow:auto; font-size:12.5px;
  background:var(--panel); border:1px solid var(--line); border-radius:8px}
#m-review pre.revdeck{margin:4px 0 8px; padding:8px 10px; overflow:auto; font-size:12px;
  color:var(--dim); background:none; border-left:2px solid var(--line); border-radius:0}
#m-review .deckblk b{font-size:12.5px}
#m-review .act.done{border-color:var(--ok); color:var(--ok)}
@media (max-width:820px){
  .wrap{display:block}
  aside{width:auto; flex:none; position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line)}
}

/* ---------------------------------------------------------------- shell */
.topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px;
  padding:9px 16px; background:#0a0d13; border-bottom:1px solid var(--line); flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:9px; font-weight:700; letter-spacing:.2px}
.brand .logo{width:30px; height:30px; border-radius:9px; display:grid; place-items:center;
  background:linear-gradient(160deg,#4c8dff,#2f6fe0); color:#fff; font-size:15px}
.badge{font-size:12px; color:var(--fg); border:1px solid var(--line); background:var(--panel2);
  border-radius:8px; padding:3px 9px}
.badge.mid{color:var(--dim)}
.search{flex:1; min-width:200px; max-width:520px; display:flex; align-items:center; gap:8px;
  background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:6px 10px}
.search input{flex:1; background:none; border:0; color:var(--fg); font:inherit; font-size:13.5px; outline:none}
.search kbd{font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:5px; padding:1px 5px; text-transform:uppercase}
nav.modes{display:flex; gap:3px; margin-left:auto; flex-wrap:wrap; align-items:center}
nav.modes button{background:none; color:var(--fg); border:1px solid transparent; border-radius:8px;
  padding:6px 11px; cursor:pointer; font:inherit; font-size:13.5px; display:flex; gap:6px; align-items:center}
nav.modes button:hover{background:var(--panel2)}
nav.modes button.on{background:var(--accent); color:#0b0e14; font-weight:600}
nav.modes button .c{font-size:11px; color:var(--dim)}
nav.modes button.on .c{color:#0b0e14}
#prog{font-size:12px; color:var(--dim)}
.wrap{display:flex; align-items:flex-start; min-height:calc(100vh - 56px)}
#side{width:296px; flex:0 0 296px; border-right:1px solid var(--line); padding:12px 10px;
  position:sticky; top:56px; max-height:calc(100vh - 56px); overflow:auto}
main{flex:1; min-width:0; padding:22px 26px 70px}
aside.rail{width:280px; flex:0 0 280px; padding:22px 16px; position:sticky; top:56px;
  max-height:calc(100vh - 56px); overflow:auto}
.grp{margin:0 0 12px}
.grp-h{font-size:11px; text-transform:uppercase; letter-spacing:.9px; color:var(--dim);
  margin:12px 6px 6px; display:flex; justify-content:space-between; gap:8px}
.grp-h .c{color:#5f6b7d}
.side-search{margin:4px 4px 10px}
.side-search input{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:9px;
  color:var(--fg); font:inherit; font-size:13px; padding:7px 10px}
button.ni{display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none;
  border:0; color:var(--fg); font:inherit; font-size:13.5px; padding:7px 8px; border-radius:8px; cursor:pointer}
button.ni:hover{background:var(--panel2)}
button.ni.on{background:#152441; color:#cfe1ff}
button.ni .n{width:22px; height:22px; flex:0 0 22px; border-radius:7px; background:var(--panel2);
  border:1px solid var(--line); display:grid; place-items:center; font-size:11.5px; color:var(--dim)}
button.ni.on .n{background:var(--accent); color:#0b0e14; border-color:var(--accent)}
button.ni .c{margin-left:auto; font-size:11.5px; color:var(--dim)}
.callout{margin:14px 6px 6px; padding:11px 12px; border-radius:10px; background:#101d33;
  border:1px solid #1e3a63; font-size:12.5px; color:#cfe1ff}
.callout b{color:#fff; display:block; margin-bottom:3px}
.callout code{color:#9ecbff}
/* ------------------------------------------------- main: document header */
.kicker{color:var(--accent); font-size:11.5px; letter-spacing:1.1px; text-transform:uppercase; font-weight:700}
h1.doc-title{font-size:27px; margin:6px 0; letter-spacing:-.2px}
p.doc-sub{color:var(--dim); margin:0 0 18px; max-width:74ch; font-size:14px}
/* ----------------------------------- code reference: explorer, pane, rail */
.refgrid{display:grid; grid-template-columns:252px minmax(0,1fr); gap:16px; align-items:start}
.explorer{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px}
.exp-h{display:flex; justify-content:space-between; font-size:11px; letter-spacing:.9px;
  color:var(--dim); text-transform:uppercase; margin:2px 4px 8px}
.exp-search input{width:100%; background:var(--code); border:1px solid var(--line); border-radius:8px;
  color:var(--fg); font:inherit; font-size:13px; padding:6px 9px; margin-bottom:8px}
.tree{max-height:62vh; overflow:auto}
.tree .dir{display:flex; gap:6px; align-items:center; color:var(--fg); font-size:13px;
  padding:5px 6px; font-weight:600}
.tree .dir .chev{color:var(--dim); font-size:10px}
.tree button.fi{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none;
  border:0; color:var(--fg); font:inherit; font-size:13px; padding:5px 8px; border-radius:7px; cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tree button.fi:hover{background:var(--panel2)}
.tree button.fi.on{background:var(--accent); color:#0b0e14; font-weight:600}
.tree button.fi .ico{width:14px; height:14px; flex:0 0 14px; border-radius:4px;
  background:rgba(31,111,235,.2); border:1px solid #2b6cb0}
.codepane{min-width:0}
.chiprow{display:flex; align-items:center; gap:10px; margin:0 0 10px}
.chip{font-size:10.5px; letter-spacing:.8px; text-transform:uppercase; color:#9ecbff;
  border:1px solid #1e3a63; background:#101d33; border-radius:6px; padding:2px 7px}
.chip.sm{text-transform:none; letter-spacing:0; color:var(--dim); border-color:var(--line);
  background:var(--panel2)}
.fpath{font-size:15px}
.lcnt{margin-left:auto; color:var(--dim); font-size:12.5px}
.curator{background:#1c1a12; border:1px solid #3d3520; border-radius:11px; padding:11px 13px; margin:0 0 12px}
.cur-h{color:var(--warn); font-size:11.5px; letter-spacing:.8px; text-transform:uppercase; margin-bottom:6px}
.curator ul{margin:0; padding-left:18px}
.curator li{margin:4px 0; font-size:13.5px}
.codeview{border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--code)}
.cv-head{display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--panel);
  border-bottom:1px solid var(--line); font-size:12.5px}
.cv-head .ico{width:14px; height:14px; flex:0 0 14px; border-radius:4px;
  background:rgba(31,111,235,.2); border:1px solid #2b6cb0}
.cv-head .cp{margin-left:auto}
.cv-body{overflow:auto; max-height:64vh; padding:10px 0}
.cl{display:flex; gap:12px; padding:0 12px; white-space:normal; font-size:12.5px; line-height:1.55}
.cl .ln{flex:0 0 34px; text-align:right; color:#4b5563; user-select:none}
.cl .lc{font-family:"Cascadia Mono","Consolas",Menlo,monospace; white-space:pre-wrap; word-break:break-word; min-width:0}
.rail-h{font-size:11px; letter-spacing:.9px; text-transform:uppercase; color:var(--dim); margin:0 0 8px}
.rail-list{font-size:13px; color:var(--dim); margin:0 0 14px}
.rail-list b{display:block; color:var(--fg); font-size:13.5px; margin-bottom:3px}
.tipbox{background:#1c1a12; border:1px solid #3d3520; border-radius:11px; padding:11px 12px; margin:0 0 14px}
.tipbox .t{color:var(--warn); font-size:11.5px; letter-spacing:.8px; text-transform:uppercase; margin-bottom:6px}
.tipbox p{margin:0; font-size:13px}
.ver{font-size:12px; color:var(--dim); line-height:1.7}
@media (max-width:1100px){ aside.rail{display:none} .refgrid{grid-template-columns:220px minmax(0,1fr)} }
@media (max-width:820px){
  .wrap{display:block}
  #side{width:auto; flex:none; position:static; max-height:none; border-right:0;
    border-bottom:1px solid var(--line)}
  .refgrid{grid-template-columns:1fr}
  .search{display:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">&#9679;</span> Ionic DOCS</div>
  <span class="badge">Angular (NgModule)</span>
  <span class="badge mid">Midterm</span>
  <div class="search">
    <span>&#9906;</span>
    <input id="gsearch" placeholder="Search project files, steps, lessons..." />
    <kbd>Ctrl K</kbd>
  </div>
  <nav class="modes">
    <button data-mode="review">Guide</button>
    <button data-mode="drill">Drill</button>
    <button data-mode="written">Written Exam <span class="c">163</span></button>
    <button data-mode="blanks">Blanks</button>
    <button data-mode="ref" class="on">Code <span class="c">55</span></button>
    <button data-mode="notes">Notes</button>
  </nav>
  <span id="prog"></span>
</header>
<div class="wrap">
  <aside id="side"></aside>
  <main>
    <section class="mode on" id="m-drill"></section>
    <section class="mode" id="m-review"></section>
    <section class="mode" id="m-written"></section>
    <section class="mode" id="m-blanks"></section>
    <section class="mode" id="m-ref"></section>
    <section class="mode" id="m-notes"></section>
  </main>
  <aside class="rail" id="rail"></aside>

": 21, "src/app/tabs/tabs.page.html": 24, "src/app/tabs/tabs.page.scss": 4, "src/app/tabs/tabs.page.ts": 12}, "tips": ["Every sub-route needs RouterModule.forChild, never forRoot, which appears exactly once, in the root routing module.", "Always declare standalone: false on Angular 19 and later components inside an NgModule, or the build fails with a declaration error.", "IonicModule comes from @ionic/angular/lazy in Ionic 9. The root entry point is the standalone API and fails the build with NG8001 on every ion-* element.", "A generated page is five behaviour-carrying files. The sixth, the .page.spec.ts, is a test stub and is not part of the build.", "navigateRoot sets the transition direction only. { replaceUrl: true } is what drops the history entry, which is what stops Back re-entering the page just left.", "A list that must reload on every return uses ionViewWillEnter, not ngOnInit, which runs once."], "steps": [{"id": 1, "title": "Project scaffold and app shell", "goal": "A blank Ionic Angular project that boots to an empty router outlet.", "files": ["src/main.ts", "src/app/app.module.ts", "src/app/app.component.ts", "src/app/app.component.html", "src/app/app-routing.module.ts", "src/global.scss", "src/theme/variables.scss", "src/app/app.component.scss"], "notes": ["`main.ts` bootstraps `AppModule` with `platformBrowserDynamic()`. No `standalone` bootstrap here.", "`app.module.ts` declares `AppComponent` only, and its imports list carries `IonicModule.forRoot()` plus `AppRoutingModule`. Both Ionic names come from `@ionic/angular/lazy`: in Ionic 9 the root `@ionic/angular` entry point is the standalone API.", "The `RouteReuseStrategy` provider that maps to `IonicRouteStrategy` is what makes Ionic navigation state survive; without it pages lose their Ionic transition behaviour.", "`app.component.html` is exactly `<ion-app><ion-router-outlet><\/ion-router-outlet><\/ion-app>`. Ionic replaces `router-outlet` with its own outlet so pages get stack behaviour.", "Angular 19 and later default to standalone. Because every page here is declared in an NgModule, each `@Component` must state `standalone: false` or the build fails with a declaration error.", "In Ionic 9 the root `@ionic/angular` entry point holds the standalone components and `provideIonicAngular()`; the class based `IonicModule` lives in `@ionic/angular/lazy`. Importing `IonicModule` from the root entry point fails the build with `NG8001` on every `ion-*` element. `IonicModule` is deprecated in favour of `provideIonicAngular()`, which also works in NgModule applications."], "verify": "`ionic serve` opens a blank shell with no console errors about missing modules.", "source": "L01 slide 14 (project structure), L02 slides 3 and 5"}, {"id": 2, "title": "Data shapes", "goal": "Interfaces that describe the movie, menu item and account records.", "files": ["src/app/models/movie.ts", "src/app/models/menu-item.ts", "src/app/models/account.ts"], "notes": ["These are `interface`, not `class`. An interface exists only at compile time and disappears from the shipped JavaScript.", "A model becomes a `class` only when records need behaviour (methods). Here the records are plain data, so interfaces are the correct choice, which is exactly the distinction L05 slide 9 draws.", "`stock: number` on `MenuItem` is what the Menu tab reports as in-stock counts."], "verify": "No runtime effect. The compiler now rejects `movie.titel`.", "source": "L05 slides 3 to 10"}, {"id": 3, "title": "Services", "goal": "One service per feature, each injectable at root, holding the data the pages read.", "files": ["src/app/services/auth.service.ts", "src/app/services/movie.service.ts", "src/app/services/menu.service.ts", "src/app/services/account.service.ts"], "notes": ["The decorator is `@Injectable({ providedIn: 'root' })` from `@angular/core`. There is no `Service` decorator in Angular; a file that imports `Service` and writes `@Service()` will not compile. This is the single most common copy-paste failure.", "`providedIn: 'root'` registers the service with the root injector, so it is a singleton and never needs an entry in any `@NgModule` providers array.", "The alternative form is `@Injectable()` plus the service added to a module's `providers: []`. Know both, prefer root for this activity.", "No `constructor` work beyond storing injected dependencies. L04 slide 6: the constructor creates the object, it does not start the page.", "`getMovieById` returns `Movie | undefined` because `Array.find` can miss. The detail page must tolerate `undefined`."], "verify": "Nothing visible yet. A typo in `providedIn` produces a NullInjectorError at the first page load.", "source": "L04 slides 2 to 6, L05 slides 7 and 16"}, {"id": 4, "title": "Login page", "goal": "A form that checks one hardcoded credential pair and routes into the tabs shell.", "files": ["src/app/login/login.page.ts", "src/app/login/login.page.html", "src/app/login/login-routing.module.ts", "src/app/login/login.module.ts", "src/app/login/login.page.scss"], "notes": ["The page's own routing module declares `{ path: '', component: LoginPage }` and exports `RouterModule`. Note `forChild`, never `forRoot`, outside the app routing module.", "`login.module.ts` imports `CommonModule`, `FormsModule`, `IonicModule` and the page routing module, then declares the page. `FormsModule` is what enables `[(ngModel)]`. `IonicModule` is imported from `@ionic/angular/lazy`, not from the root entry point.", "`[(ngModel)]` is the two-way banana-in-a-box binding. Without `FormsModule` in the module imports the template throws `Can't bind to 'ngModel'`.", "Redirect with code, not with markup: `this.router.navigate(['/tabs/movies'])`. The destination depends on a function result, which is exactly when L02 slide 9 says to use TypeScript navigation.", "The constructor only wires `AuthService` and `Router`. Validation lives in a method, and nothing page-related runs before the user taps."], "verify": "Submitting `admin` / `1234` changes the URL to `/tabs/movies`; anything else prints the error line.", "source": "L02 slide 9, L04 slides 6 to 8, L06 slide 13"}, {"id": 5, "title": "Tabs shell", "goal": "The tab bar and the four child routes it switches between.", "files": ["src/app/tabs/tabs.page.ts", "src/app/tabs/tabs.page.html", "src/app/tabs/tabs-routing.module.ts", "src/app/tabs/tabs.module.ts", "src/app/tabs/tabs.page.scss"], "notes": ["`children:` inside the tabs route is the whole mechanism. Each entry pairs a path with a lazy `loadChildren` that resolves to a page module, not a page class.", "`loadChildren: () => import('../movies/movies.module').then(m => m.MoviesPageModule)` is the NgModule form. The standalone form shown in the deck is `loadComponent: () => import('./movies/movies.page').then(m => m.MoviesPage)`, and it will not match this project.", "Each `ion-tab-button` needs `tab=\"...\"` and `href=\"/tabs/...\"`. The `tab` attribute is what Ionic uses to match the button to the active child route.", "The final child `{ path: '', redirectTo: '/tabs/movies', pathMatch: 'full' }` is what makes bare `/tabs` land on the first tab. Keep `pathMatch: 'full'` or an empty path swallows every URL.", "Tab pages keep their own history stack. L02 slide 13: with tabs, browser back is not always app back."], "verify": "Navigating to `/tabs` shows four tab buttons and lands on Movies.", "source": "L02 slides 13 to 14"}, {"id": 6, "title": "Movies catalogue", "goal": "A list of movies where each row opens a nested detail route.", "files": ["src/app/movies/movies.page.ts", "src/app/movies/movies.page.html", "src/app/movies/movies-routing.module.ts", "src/app/movies/movies.module.ts", "src/app/movies/movies.page.scss"], "notes": ["`movies-routing.module.ts` holds two entries: `{ path: '', component: MoviesPage }` for the list and `{ path: ':id', loadChildren: ... }` for the detail module. This is what produces the URL shape `/tabs/movies/01` rather than pushing a new top-level page.", "Because the parent route in `tabs-routing.module.ts` names only `movies`, the `:id` segment lives here. The movies feature therefore owns its own detail segment, which is why the routes stay readable.", "The tap handler navigates with `this.router.navigate(['/tabs/movies', id])`. The array form is the correct way to pass a route parameter; a single concatenated string is the common mistake.", "`ngOnInit` assigns `this.movies = this.movieService.getMovies()`. The constructor stays a wiring line. L04 slide 7 is exactly this split.", "`*ngFor` needs the element to be inside a declared component of this module, and `CommonModule` in the module imports is what supplies it."], "verify": "`/tabs/movies` lists three titles. Tapping the first changes the URL to `/tabs/movies/1`.", "source": "L02 slides 10 and 14, L04 slides 6 to 8, L05 slide 13"}, {"id": 7, "title": "Movie detail sub-page", "goal": "`/tabs/movies/01` renders one movie and offers an Ionic back button.", "files": ["src/app/movie-detail/movie-detail.page.ts", "src/app/movie-detail/movie-detail.page.html", "src/app/movie-detail/movie-detail-routing.module.ts", "src/app/movie-detail/movie-detail.module.ts", "src/app/movie-detail/movie-detail.page.scss"], "notes": ["This module's own route is `{ path: '', component: MovieDetailPage }`, not `:id`. The parent already consumed `/movies/:id`, so nothing is left for this module to match. Copying the reference repo here (which puts `:id` in the child module because its parent path is just `movie-detail`) produces a dead route.", "Read the parameter in `ngOnInit`, never in the constructor: `Number(this.route.snapshot.paramMap.get('id'))`. Route parameters always arrive as strings, so `Number(...)` or `+` is required before comparing with `movie.id`.", "`paramMap` includes parameters inherited from ancestor routes, which is why `'id'` is visible here even though the path segment belongs to the parent route.", "`movie?: Movie` plus `*ngIf=\"movie\"` on the content block guards the template against an id that matches nothing. Without it, `{{ movie.title }}` throws on an empty record.", "`<ion-back-button defaultHref=\"/tabs/movies\"><\/ion-back-button>` gives the Ionic back behaviour. `defaultHref` is the fallback when there is no previous page in the stack, which is exactly the case when the URL is opened directly."], "verify": "Opening `/tabs/movies/1` directly still renders the movie and the back button returns to the list.", "source": "L02 slides 10 to 12, L03 slides 6 and 9"}, {"id": 8, "title": "Menu catalogue", "goal": "The second genre tab: a food menu that reports how many are in stock.", "files": ["src/app/menu/menu.page.ts", "src/app/menu/menu.page.html", "src/app/menu/menu-routing.module.ts", "src/app/menu/menu.module.ts", "src/app/menu/menu.page.scss"], "notes": ["Identical structure to the movies feature, with `menu` and `menu/:id` in place of `movies` and `movies/:id`. The repetition is the point: once the pattern is understood, the second catalogue is mechanical.", "`stockLabel(item)` is a component method called from the template. Methods in templates run on every change-detection pass, so keep them cheap and side-effect free.", "`{{ item.stock > 0 ? item.stock + ' in stock' : 'Out of stock' }}` would also work inline, but the method version keeps the template readable, which is the L07 slide 20 preference."], "verify": "`/tabs/menu` lists the food records and shows `7 in stock` and `Out of stock` on the right rows.", "source": "L02 slide 14, L05 slide 13, L07 slide 20"}, {"id": 9, "title": "Menu detail sub-page", "goal": "`/tabs/menu/01` renders one menu item with its stock.", "files": ["src/app/menu-detail/menu-detail.page.ts", "src/app/menu-detail/menu-detail.page.html", "src/app/menu-detail/menu-detail-routing.module.ts", "src/app/menu-detail/menu-detail.module.ts", "src/app/menu-detail/menu-detail.page.scss"], "notes": ["Same four files, same `{ path: '' }` route, same `ngOnInit` parameter read. The only difference is `MenuService` and `defaultHref=\"/tabs/menu\"`.", "`[color]=\"item.stock > 0 ? 'success' : 'danger'\"` uses a property binding to pick an Ionic theme colour from data. This is the L07 slide 10 pattern: the template asks for a colour name, the theme supplies the value."], "verify": "`/tabs/menu/3` shows stock 0 in danger red.", "source": "L07 slides 8 to 10"}, {"id": 10, "title": "Defunct search tab", "goal": "A search bar that renders and binds but filters nothing.", "files": ["src/app/search/search.page.ts", "src/app/search/search.page.html", "src/app/search/search-routing.module.ts", "src/app/search/search.module.ts", "src/app/search/search.page.scss"], "notes": ["`<ion-searchbar [(ngModel)]=\"searchTerm\" (ionInput)=\"onSearch()\"><\/ion-searchbar>`. The bar binds, so the control is real, but `onSearch()` is empty by design.", "Do not add filtering. The requirement is a non-functional control on its own tab, and adding logic would change the deliverable.", "`ion-searchbar` is not covered by any deck, so this page is written from the component reference rather than from a lesson. Note that gap explicitly if asked where a given line came from."], "verify": "Typing in the bar echoes nothing and the list never appears.", "source": "no lesson source (see CLASS_NOTES.md gaps)"}, {"id": 11, "title": "Account page and exit", "goal": "The account record plus an exit button that returns to login.", "files": ["src/app/account/account.page.ts", "src/app/account/account.page.html", "src/app/account/account-routing.module.ts", "src/app/account/account.module.ts", "src/app/account/account.page.scss"], "notes": ["`exit()` does two things in order: `this.auth.logout()` clears the session, then `this.navCtrl.navigateRoot('/login', { replaceUrl: true })` returns to the login page.", "Two options matter here. `navigateRoot` sets the transition to a root move instead of a forward push, and `replaceUrl` replaces the history entry being left, so Back cannot return to the tabs once the session is cleared. `navigateRoot` on its own only sets the direction and then navigates.", "`NavController` comes from `@ionic/angular` and is injected in the constructor like any other dependency. This is the L02 slide 9 second option, and it is the right tool when the destination is a stack reset."], "verify": "Exit returns to the login page, and the browser Back button does not re-open the tabs.", "source": "L02 slides 9 and 12, L04 slide 6"}], "blanks": [{"id": "B1", "lesson": "L02 slide 5", "title": "Root routing module", "file": "src/app/app-routing.module.ts", "code": "const routes: Routes = [\n  { path: '', [[1]]: 'login', pathMatch: 'full' },\n  { path: 'login', [[2]]: () => import('./login/login.module').then(m => m.LoginPageModule) },\n  { path: 'tabs',  loadChildren: () => import('./tabs/tabs.module').then(m => m.[[3]]) },\n];\n\n@NgModule({\n  imports: [RouterModule.[[4]](routes, { preloadingStrategy: PreloadAllModules })],\n  exports: [RouterModule],\n})\nexport class AppRoutingModule {}", "answers": ["redirectTo", "loadChildren", "TabsPageModule", "forRoot"], "hints": ["takes a path string", "NgModule form, resolves a module", "the exported class name", "root or child"], "why": "`forRoot` is used exactly once, in the application routing module. `loadChildren` is the NgModule form; the deck's `loadComponent` belongs to the standalone API."}, {"id": "B2", "lesson": "L02 slide 14", "title": "Tab children", "file": "src/app/tabs/tabs-routing.module.ts", "code": "const routes: Routes = [\n  {\n    path: '',\n    component: TabsPage,\n    [[1]]: [\n      { path: 'movies', loadChildren: () => import('../movies/movies.module').then(m => m.[[2]]) },\n      { path: '', [[3]]: '/tabs/movies', pathMatch: 'full' },\n    ],\n  },\n];\n\n@NgModule({\n  imports: [RouterModule.[[4]](routes)],\n  exports: [RouterModule],\n})\nexport class TabsPageRoutingModule {}", "answers": ["children", "MoviesPageModule", "redirectTo", "forChild"], "hints": ["the nesting key", "module, not page", "same key as the root redirect", "never forRoot here"], "why": "Child routes are what make each tab part of the tabs layout. The trailing empty path with `pathMatch: 'full'` is what lands `/tabs` on the first tab."}, {"id": "B3", "lesson": "L02 slides 10 and 14", "title": "Nested detail route", "file": "src/app/movies/movies-routing.module.ts", "code": "const routes: Routes = [\n  { path: '', component: [[1]] },\n  {\n    path: '[[2]]',\n    loadChildren: () => import('../movie-detail/movie-detail.module').then(m => m.MovieDetailPageModule),\n  },\n];", "answers": ["MoviesPage", ":id"], "hints": ["the list page class", "route parameter syntax"], "why": "Declaring `:id` here is what produces `/tabs/movies/01` as a child URL of the movies tab rather than a newly pushed top-level page."}, {"id": "B4", "lesson": "L02 slide 10", "title": "Reading the route parameter", "file": "src/app/movie-detail/movie-detail.page.ts", "code": "export class MovieDetailPage implements [[1]] {\n  movie?: Movie;\n\n  constructor(private [[2]]: ActivatedRoute, private movieService: MovieService) {}\n\n  ngOnInit(): void {\n    const id = [[3]](this.route.[[4]].paramMap.get('id'));\n    this.movie = this.movieService.getMovieById(id);\n  }\n}", "answers": ["OnInit", "route", "Number", "snapshot"], "hints": ["the Angular lifecycle interface", "injected dependency name", "route params are strings", "one-shot read, no subscription"], "why": "Parameters are read in `ngOnInit`, never the constructor, and they always arrive as strings. `snapshot` is the one-shot read; a subscription is only needed when the same page is reused with a different id."}, {"id": "B5", "lesson": "L04 slide 6", "title": "Service registration", "file": "src/app/services/movie.service.ts", "code": "import { [[1]] } from '@angular/core';\nimport { Movie } from '../models/movie';\n\n@[[1]]({ [[2]]: 'root' })\nexport class MovieService { }", "answers": ["Injectable", "providedIn"], "hints": ["the only service decorator Angular has", "root injector key"], "why": "There is no `Service` decorator. The reference activity imports `Service` and writes `@Service()`, which does not compile; `@Injectable({ providedIn: 'root' })` is the correct registration and needs no providers array."}, {"id": "B6", "lesson": "L04 slides 6 to 7", "title": "Constructor versus ngOnInit", "file": "src/app/movies/movies.page.ts", "code": "export class MoviesPage implements OnInit {\n  movies: Movie[] = [];\n\n  // wiring only\n  constructor(private movieService: MovieService, private router: [[1]]) {}\n\n  // first place allowed to touch page data\n  [[2]](): void {\n    this.movies = this.movieService.getMovies();\n  }\n\n  openMovie(id: number): void {\n    this.router.[[3]](['/tabs/movies', id]);\n  }\n}", "answers": ["Router", "ngOnInit", "navigate"], "hints": ["from @angular/router", "the Angular init hook", "method for code-driven navigation"], "why": "The constructor creates the object; `ngOnInit` starts the page. The array form of `navigate` is what passes `:id` correctly."}, {"id": "B7", "lesson": "L02 slide 14", "title": "Tab bar markup", "file": "src/app/tabs/tabs.page.html", "code": "<ion-tabs>\n  <ion-tab-bar slot=\"[[1]]\">\n    <ion-tab-button tab=\"movies\" href=\"/tabs/movies\">\n      <ion-icon name=\"film-outline\"><\/ion-icon>\n      <ion-label>Movies<\/ion-label>\n    <\/ion-tab-button>\n  <\/ion-tab-bar>\n<\/ion-tabs>", "answers": ["bottom"], "hints": ["where a phone tab bar sits"], "why": "The `tab` attribute pairs the button with the child route; `href` is the URL it opens."}, {"id": "B8", "lesson": "L02 slide 12", "title": "Ionic back button", "file": "src/app/movie-detail/movie-detail.page.html", "code": "<ion-header>\n  <ion-toolbar>\n    <ion-buttons slot=\"start\">\n      <ion-back-button [[1]]=\"/tabs/movies\"><\/ion-back-button>\n    <\/ion-buttons>\n    <ion-title>{{ movie?.title }}<\/ion-title>\n  <\/ion-toolbar>\n<\/ion-header>", "answers": ["defaultHref"], "hints": ["the fallback when the stack is empty"], "why": "`defaultHref` is what the button uses when there is no previous page, which is exactly the case when the URL is opened directly."}, {"id": "B9", "lesson": "L02 slide 9", "title": "Exit to login", "file": "src/app/account/account.page.ts", "code": "exit(): void {\n  this.auth.[[1]]();\n  this.[[2]].navigateRoot('/login', { replaceUrl: true });\n}", "answers": ["logout", "navCtrl"], "hints": ["the auth method that clears the session", "the injected Ionic controller"], "why": "`navigateRoot` sets the transition direction and `replaceUrl` replaces the entry being left. With plain `navigate`, and also with `navigateRoot` and no options, Back would still return to the account page after the session was already cleared."}, {"id": "B10", "lesson": "L05 slide 5", "title": "Declaring a data shape", "file": "src/app/models/menu-item.ts", "code": "export [[1]] MenuItem {\n  id: number;\n  name: string;\n  category: string;\n  price: number;\n  [[2]]: number;\n  imageUrl: string;\n  description: string;\n}", "answers": ["interface", "stock"], "hints": ["compile-time only", "the field the Menu tab reports"], "why": "An interface describes the shape. It becomes a class only when the records need behaviour."}, {"id": "B11", "lesson": "L03 slide 6", "title": "Page module wiring", "file": "src/app/login/login.module.ts", "code": "@NgModule({\n  imports: [\n    CommonModule,\n    [[1]],\n    IonicModule,\n    LoginPageRoutingModule\n  ],\n  declarations: [LoginPage]\n})\nexport class LoginPageModule {}", "answers": ["FormsModule"], "hints": ["what supplies ngModel"], "why": "`[(ngModel)]` fails with `Can't bind to 'ngModel'` unless `FormsModule` is in the declaring module's imports."}, {"id": "B12", "lesson": "L03 slide 6", "title": "Ionic root configuration", "file": "src/app/app.module.ts", "code": "@NgModule({\n  declarations: [AppComponent],\n  imports: [BrowserModule, [[1]].forRoot(), AppRoutingModule],\n  providers: [{ provide: RouteReuseStrategy, useClass: [[2]] }],\n  bootstrap: [AppComponent],\n})\nexport class AppModule {}", "answers": ["IonicModule", "IonicRouteStrategy"], "hints": ["the Ionic NgModule", "the Ionic reuse strategy"], "why": "`IonicModule.forRoot()` appears once. The `RouteReuseStrategy` provider is what gives Ionic pages their caching and transition behaviour. Both names are imported from `@ionic/angular/lazy`."}, {"id": "B13", "lesson": "L07 slide 9", "title": "Theme variable", "file": "src/theme/variables.scss", "code": ":root {\n  [[1]]: #0f4c81;\n  --ion-color-primary-rgb: 15, 76, 129;\n  --ion-color-primary-contrast: #ffffff;\n}", "answers": ["--ion-color-primary"], "hints": ["the custom property Ionic reads for the primary colour"], "why": "Renaming the brand means editing the variable once. The rgb and contrast companions must be updated with it or components render mismatched shades."}, {"id": "B14", "lesson": "L02 slide 5", "title": "Empty path redirect", "file": "src/app/app-routing.module.ts", "code": "{ path: '', redirectTo: 'login', [[1]]: 'full' }", "answers": ["pathMatch"], "hints": ["the key that stops an empty path matching every URL"], "why": "Without `pathMatch: 'full'`, an empty path matches everything and the app can never leave the redirect."}], "shorts": [{"lesson": "L02", "q": "State the five-file set for a lazily loaded NgModule page and what each file contributes.", "answer": "`x.page.ts` (the component class), `x.page.html` (the template), `x.page.scss` (the page's own styles, wired through `styleUrls`), `x-routing.module.ts` (a `Routes` array with `{ path: '', component: XPage }` exported through `RouterModule.forChild`), and `x.module.ts` (an `@NgModule` that imports CommonModule, FormsModule, IonicModule from `@ionic/angular/lazy` and the routing module, then declares the page). Without the routing module and the module there is nothing for `loadChildren` to resolve."}, {"lesson": "L02", "q": "Explain the difference between `Router.navigate` and `NavController.navigateRoot` and when each is correct.", "answer": "`Router.navigate` performs an ordinary navigation: it pushes a new entry, so the previous page stays behind it and Back returns there. `NavController.navigateRoot` sets the transition to a root move and then navigates, which is the right choice after logout or any app reset; pass `{ replaceUrl: true }` to also drop the entry being left, because `navigateRoot` by itself does not replace it."}, {"lesson": "L03", "q": "A list page must reload its data every time the user returns to it. Which hook, and why not the obvious alternative?", "answer": "`ionViewWillEnter`. Ionic caches routed pages in the DOM, so `ngOnInit` runs only on the first entry and the list would stay stale on later visits. `ionViewWillEnter` fires on every entry, before the page becomes visible."}, {"lesson": "L04", "q": "Give the two ways to register a service with the injector and state which one this project uses.", "answer": "Either `@Injectable({ providedIn: 'root' })`, which registers a root singleton with no providers entry, or a bare `@Injectable()` with the service listed in a module's `providers: []`. This project uses `providedIn: 'root'` for every service."}, {"lesson": "L05", "q": "When is an interface insufficient and a model class required?", "answer": "When records need behaviour, for example a computed field or a method such as `isInStock()`. An interface carries no implementation, so behaviour has to live in a class or in the consuming service."}, {"lesson": "L06", "q": "Write the shape of an async page method that must always restore UI state, and state where each block belongs.", "answer": "Declare the method `async`, set the loading flag before awaiting, `try` the await, handle failure in `catch` and set an error message, and restore the loading flag in `finally` so the loader is dismissed on both paths."}, {"lesson": "L07", "q": "Why is editing `--ion-color-primary` better than adding `.my-button { background: #0f4c81 }` to a page stylesheet?", "answer": "The variable re-themes every component that requests `color=\"primary\"`, including shades, tints, contrast text and the rgb companion values, from one place. A page-level override reaches one component, breaks when the brand changes, and fights the component's own shadow-DOM styling."}], "global": ["Every `@Component` and `@NgModule` declaration needs `standalone: false` on Angular 19 and later, because standalone is the default.", "Page file set is five files: `x.page.ts`, `x.page.html`, `x.page.scss`, `x-routing.module.ts`, `x.module.ts`. A page without its routing module cannot be lazily loaded.", "`forRoot` once in `app-routing.module.ts`. `forChild` in every other routing module.", "`loadChildren` takes a module; `loadComponent` takes a class. This project is NgModule based, so it is `loadChildren` throughout.", "Asset URLs are root relative: `assets/movie-posters/iron-man.jpg`, never `../../assets/...`.", "`constructor` wires dependencies. `ngOnInit` is the first place page data may be touched. The decks and the class agree on this one.", "A generated page arrives as six files: the class, the template, the page's own stylesheet, a `.page.spec.ts` stub, the routing module and the module. This project ships the five that carry behaviour and leaves the spec stub out. The module and the routing module are generator output and are never hand edited: the only part of a route a student writes is the entry inside the `routes` array.", "In Ionic 9 the root `@ionic/angular` entry point is the standalone API and holds `provideIonicAngular()`; the class based `IonicModule` lives in `@ionic/angular/lazy`. Importing `IonicModule` from the root entry point fails the build with `NG8001` on every `ion-*` element, and `IonicModule` is deprecated in favour of `provideIonicAngular()`, which also works in NgModule applications."], "intro": ["This reviewer is built backwards from one artefact: rebuild this application from a blank Ionic project, by memory. The Drill mode walks the build in the order the code has to exist, because a page cannot be routed to before its module exists.", "Everything here is NgModule form. The eight lesson decks teach the standalone API (`app.routes.ts`, `loadComponent`, functional guards), and Angular and Ionic documentation follows the standalone API too, so the decks cannot be quoted as written. Where a deck listing disagrees with the class convention, the item says so explicitly.", "The application: a login page, then a tabs shell with four tabs. Two of those tabs are catalogues of a different genre (movies, and a food menu that reports stock), each of which opens a nested detail route so the URL reads `tabs/movies/01`. One tab is a deliberately non-functional search page. The account tab carries an exit button back to login.", "Exam shape: the midterm is written as well as coded. The previous written quiz in this course was identification only, with no multiple choice, and it drew a large share of its items from the smallest text on the L01 and L01.2 overview slides: a date, an era name, a count, a tool name, exactly the details that sit at the back of your mind and fail to arrive under pressure. Those items are marked 'small print' in Part I and can be drilled on their own with one button. They are covered rather than argued with, because they are the professor's actual source."], "gaps": ["No deck teaches the NgModule route forms. `loadChildren`, `RouterModule.forRoot` versus `forChild`, and a page's own `x-routing.module.ts` appear in no source and exist only in this reviewer and in the reference activity.", "`ion-searchbar` is not mentioned in any deck. The search page is assembled from the component reference, not from a lesson.", "No deck covers an exit or application-close action, and no deck shows a login page or an authentication flow.", "`L01.2` (environment setup) is 29 screenshots and zero code, so it can only be tested on the Node LTS requirement and the CLI steps.", "No guard is used in this project. `L02` slide 15 defines a functional guard in the standalone style; the NgModule guard class form is not shown, so the reviewer does not test it."], "ident": [{"lesson": "L01", "q": "The native runtime and plugin layer in the Ionic-Angular stack that bridges a web app to iOS and Android device features.", "key": "Capacitor", "alts": ["capacitor", "capacitor native runtime"]}, {"lesson": "L01", "q": "The hybrid app wrapper that, between 2009 and 2012, popularised HTML, CSS and JavaScript inside a native container.", "key": "PhoneGap", "alts": ["phonegap", "cordova", "phonegap/cordova", "phonegap or cordova", "apache cordova"]}, {"lesson": "L01", "q": "The Ionic CLI subcommand that scaffolds a new project from a name, a template such as tabs, and a type.", "key": "ionic start", "alts": ["ionic start", "start", "ionic start myapp tabs --type=angular", "ionic start myapp tabs"]}, {"lesson": "L01", "q": "The Ionic CLI command that runs the app in a browser with live reload.", "key": "ionic serve", "alts": ["ionic serve", "serve", "ionic serve --lab"]}, {"lesson": "L01", "q": "The Ionic CLI command that compiles the production web assets.", "key": "ionic build", "alts": ["ionic build", "build"]}, {"lesson": "L01", "q": "The Ionic CLI command that copies the web build into the native platform project and applies plugin changes.", "key": "ionic cap sync", "alts": ["ionic cap sync", "cap sync", "ionic capacitor sync", "ionic capacitorsync"]}, {"lesson": "L01", "q": "The year the smartphone era began and touchscreen phones made apps a daily computing interface.", "key": "2007", "alts": ["2007", "2007 smartphone era", "the smartphone era"]}, {"lesson": "L01", "q": "The year Apple's App Store launched with 500 apps and the Android Market was announced.", "key": "2008", "alts": ["2008", "2008 app stores", "the app store year"]}, {"lesson": "L01", "q": "The 2015+ phase in which offline-ready web apps and one-codebase cross-platform he tool required to build and sign iOS apps, available only on macOS.", "key": "Xcode", "alts": ["xcode", "apple xcode"]}, {"lesson": "L01.2", "q": "The four verification commands given before creating the first Ionic app.", "key": "node -v, npm -v, ionic -v, git --version", "alts": ["node -v, npm -v, ionic -v, git --version", "node -v npm -v ionic -v git --version", "node -v and npm -v and ionic -v and git --version"]}, {"lesson": "L01.2", "q": "The practice recommended before attempting any native build.", "key": "test in the browser first", "alts": ["test in the browser first", "browser testing first", "start with browser testing", "test in browser"]}, {"lesson": "L01.2", "q": "The Node.js release line that must be installed for the Ionic CLI.", "key": "LTS", "alts": ["lts", "long term support", "long-term support", "lts version"]}, {"lesson": "L01.2", "q": "The text editor recommended for Ionic development in this course.", "key": "Visual Studio Code", "alts": ["visual studio code", "vs code", "vscode", "vs code / visual studio code"]}, {"lesson": "L01.2", "q": "The environment variable that points Android Studio at the location of the Android SDK.", "key": "ANDROID_SDK_ROOT", "alts": ["android_sdk_root", "android sdk root", "androidsdkroot"]}, {"lesson": "L01.2", "q": "The emulated Android device created inside Android Studio so the app can be run without a physical phone.", "key": "Android Virtual Device", "alts": ["android virtual device", "avd", "android virtual device (avd)"]}, {"lesson": "L02", "q": "The Ionic component that replaces plain `router-outlet` so routed pages receive mobile transitions and a navigation stack.", "key": "ion-router-outlet", "alts": ["ion-router-outlet", "ion router outlet", "<ion-router-outlet>", "router outlet", "ion-router-outlet component"]}, {"lesson": "L02", "q": "The word for a rule that maps a URL path to a component or a lazily loaded page.", "key": "route", "alts": ["route", "a route", "routing rule"]}, {"lesson": "L02", "q": "The URL segment after the domain, such as `home` or `products/:id`.", "key": "path", "alts": ["path", "url path", "route path"]}, {"lesson": "L02", "q": "The placeholder in a template where the matched page is displayed.", "key": "outlet", "alts": ["outlet", "router outlet", "router-outlet", "ion-router-outlet"]}, {"lesson": "L02", "q": "The HTML attribute used for tap or click navigation from a template.", "key": "routerLink", "alts": ["routerlink", "routerlink=", "[routerlink]", "router link"]}, {"lesson": "L02", "q": "The TypeScript function called on the router to navigate from code.", "key": "Router.navigate()", "alts": ["router.navigate", "router.navigate()", "navigate", "this.router.navigate", "navigate()"]}, {"lesson": "L02", "q": "The mobile-style history of pages that Ionic keeps so back behaviour works.", "key": "stack", "alts": ["stack", "navigation stack", "page stack"]}, {"lesson": "L02", "q": "The route option that makes an empty path match only the exactly empty URL, rather than every URL.", "key": "pathMatch: 'full'", "alts": ["pathmatch: 'full'", "pathmatch: full", "pathmatch", "pathmatch:'full'", "full"]}, {"lesson": "L02", "q": "The wildcard path used as the last route to catch an unknown URL and redirect it somewhere safe.", "key": "**", "alts": ["**", "wildcard", "'**'", "double asterisk", "path: '**'"]}, {"lesson": "L02", "q": "The kind of parameter that modifies how a list is shown, appears after a question mark, and is best for optional filters.", "key": "query parameter", "alts": ["query parameter", "query param", "queryparams", "query params", "query"]}, {"lesson": "L02", "q": "The `routerDirection` value that resets the navigation stack rather than moving forward or back.", "key": "root", "alts": ["root", "routerdirection=root", "\"root\""]}, {"lesson": "L02", "q": "The Ionic component that provides navigation-history back behaviour, together with the attribute that supplies a fallback destination when the history is empty.", "key"  "alts": ["ionviewdidenter", "ionviewdidenter()", "ion view did enter"]}, {"lesson": "L03", "q": "The Ionic hook that runs when a page is about to leave, and is the correct place to pause timers, stop the camera, or unsubscribe.", "key": "ionViewWillLeave", "alts": ["ionviewwillleave", "ionviewwillleave()", "ion view will leave"]}, {"lesson": "L03", "q": "The Ionic hook that runs after the page has finished leaving the screen.", "key": "ionViewDidLeave", "alts": ["ionviewditleave", "ionviewditleave()", "ion view did leave"]}, {"lesson": "L03", "q": "The Angular hook that performs final teardown, and which Ionic calls only when the page is actually removed rather than hidden.", "key": "ngOnDestroy", "alts": ["ngondestroy", "ngondestroy()", "ng on destroy", "ondestroy"]}, {"lesson": "L03", "q": "The behaviour that explains why `ngOnDestroy` does not run every time you navigate away, and why page state and scroll position survive a return.", "key": "page caching", "alts": ["page caching", "caching", "dom caching", "ionic keeps pages in the dom", "pages are cached", "cache"]}, {"lesson": "L03", "q": "The restriction that decides which components receive the Ionic navigation hooks.", "key": "routed page components only", "alts": ["routed page components only", "routed page components", "only routed pages", "page components only", "routed pages"]}, {"lesson": "L03", "q": "The four hooks, in order, that a routed page passes through on its first entry.", "key": "constructor, ngOnInit, ionViewWillEnter, ionViewDidEnter", "alts": ["constructor, ngoninit, ionviewwillenter, ionviewdidenter", "constructor ngoninit ionviewwillenter ionviewdidenter", "constructor, ngOnInit, ionViewWillEnter, ionViewDidEnter()"]}, {"lesson": "L04", "q": "The Angular mechanism by which a service is handed to the component or page that needs it, rather than the page constructing it.", "key": "dependency injection", "alts": ["dependency injection", "di", "dependencies injected"]}, {"lesson": "L04", "q": "The service registration form that means Angular creates one shared app-wide instance with no `providers` array entry.", "key": "providedIn: 'root'", "alts": ["providedin: 'root'", "providedin root", "providedin", "providedin:'root'", "@injectable({ providedin: 'root' })"]}, {"lesson": "L04", "q": "The correct contents of a component constructor, in three words or fewer.", "key": "dependency injection", "alts": ["dependency injection", "store dependencies", "inject dependencies", "wiring dependencies", "creating the object", "dependencies"]}, {"lesson": "L04", "q": "The correct contents of `ngOnInit` in a page.", "key": "load initial page data", "alts": ["load initial page data", "loading the page data", "load page data", "initial data load", "call service methods", "starting the page", "load initial data", "prepare component state"]}, {"lesson": "L04", "q": "The correct home for API calls, storage logic, business rules and reusable app logic.", "key": "a service method", "alts": ["a service method", "service method", "the service", "service", "services"]}, {"lesson": "L04", "q": "The three things a constructor must never do, named in the deck's own words.", "key": "calling APIs, showing alerts, navigating", "alts": ["calling apis, showing alerts, navigating", "call apis show alerts navigate", "no apis alerts or navigation", "apis alerts navigation"]}, {"lesson": "L04", "q": "The explicit call made from `AppComponent` when service startup work must happen at app launch instead of hiding in the service constructor.", "key": "service.initSession()", "alts": ["service.initsession()", "initsession", "initsession()", "service.initsession", "init session"]}, {"lesson": "L04", "q": "The first thing to check in the browser when a service throws a NullInjectorError at page load.", "key": "whether it is registered", "alts": ["whether it is registered", "registration", "providedin or providers", "is it in providers", "check providers or providedin", "whether the service is listed in providers or providedin"]}, {"lesson": "L05", "q": "The TypeScript construct that states what properties an object should have, carries no runtime code, and exists only to check code before it runs.", "key": "interface", "alts": ["interface", "an interface", "typescript interface"]}, {"lesson": "L05", "q": "The construct that acts as a blueprint able to create objects with `new`, may include a constructor and methods, and exists at runtime.", "key": "model class", "alts": ["model class", "class", "a model class", "model"]}, {"lesson": "L05", "q": "The syntax that marks a property as possibly missing, for example `imageUrl?: string`.", "key": "the question mark", "alts": ["the question mark", "question mark", "?", "? optional marker", "optional marker", "imageurl?"]}, {"lesson": "L05", "q": "The keyword used to create an object from a model class.", "key": "new", "alts": ["new", "the new keyword", "new()"]}, {"lesson": "L05", "q": "The TypeScript feature suited to union values and shortcuts rather than to describing an object shape, as in `type UserRole = 'admin' | 'student'`.", "key": "type alias", "alts": ["type alias", "type", "type alias / union type", "union type"]}, {"lesson": "L05", "q": "What must be done to plain objects returned by an API before their model methods can be called.", "key": "map them into model instances", "alts": ["map them into model instances", "map them", "convert them with new", "map into new model instances", "instantiate them", "map them using new model()"]}, {"lesson": "L05", "q": "The folder where interfaces and model classes belong in this project layout.", "key": "src/app/models", "alts": ["src/app/models", "models/", "models", "app/models", "src/app/models/"]}, {"lesson": "L06", "q": "The object representing a future result, whose two settled outcomes are fulfilled and rejected.", "key": "Promise", "alts": ["promise", "a promise", "promises"]}, {"lesson": "L06", "q": "The keyword that pauses the execution of the enclosing function until the promise settles, without freezing the app.", "key": "await", "alts": ["await", "the await keyword"]}, {"lesson": "L06", "q": "The function modifier required before `await` may be used inside it.", "key": "async", "alts": ["async", "the async keyword", "async function"]}, {"lesson": "L06", "q": "The block that runs whether the awaited task succeeded or failed, and is where the loading indicator is dismissed.", "key": "finally", "alts": ["finally", "finally {}", "the finally block"]}, {"lesson": "L06", "q": "The Angular template pipe that subscribes to an Observable, updates the view, and unsubscribes automatically when the component is destroyed.", "key": "async pipe", "alts": ["async pipe", "async", "| async", "the async pipe"]}, {"lesson": "L06", "q": "The naming convention applied to Observable variables such as `products$`.", "key": "the dollar suffix", "alts": ["the dollar suffix", "dollar suffix", "$", "$ suffix", "dollar sign"]}, {"lesson": "L06", "q": "The method used to start several independent async tasks at the same time and wait for all of them.", "key": "Promise.all", "alts": ["promise.all", "promise all", "promise.all()", "all"]}, {"lesson": "L07", "q": "The stylesheet holding the global theme values, including the `--ion-color-*` custom properties.", "key": "src/theme/variables.scss", "alts": ["src/theme/variables.scss", "variables.scss", "variables", "theme/variables.scss"]}, {"lesson": "L07", "q": "The stylesheet holding global helpers and the Ionic base stylesheet imports.", "key": "src/global.scss", "alts": ["src/global.scss", "global.scss", "global"]}, {"lesson": "L07", "q": "The CSS custom property Ionic reads to style every component that asks for the primary colour.", "key": "--ion-color-primary", "alts": ["--ion-color-primary", "ion-color-primary", "--ion-color-primary:", "ioncolorprimary"]}, {"lesson": "L07", "q": "The encapsulation that explains why an ordinary CSS descendant selector cannot reach the inner label of an Ionic component.", "key": "Shadow DOM", "alts": ["shadow dom", "shadowdom", "shadow dom encapsulation"]}, {"lesson": "L07", "q": "The selector used to style an element that a component deliberately exposes, such as `ion-item::part(native)`.", "key": "::part()", "alts": ["::part()", "::part", "part", "css shadow part", "shadow part"]}, {"lesson": "L07", "q": "The Ionic component that shows a brief, auto-dismissing message at the edge of the screen.", "key": "ion-toast", "alts": ["ion-toast", "ion toast", "toast", "toastcontroller", "<ion-toast>"]}], "mc": [{"lesson": "L01", "q": "In an NgModule Ionic project, which file is the single place that calls `RouterModule.forRoot`?", "options": ["app-routing.module.ts", "app.module.ts", "tabs-routing.module.ts", "main.ts"], "correct": 0, "why": "One `forRoot` per application, in the application routing module. Every other routing module uses `forChild`. `app.module.ts` imports `AppRoutingModule` but does not build routes."}, {"lesson": "L01", "q": "What does `RouteReuseStrategy` mapped to `IonicRouteStrategy` change?", "options": ["It makes lazy modules preload", "It lets Ionic keep pages in the DOM and animate transitions instead of destroying them", "It enables route parameters", "It registers the Ionic components"], "correct": 1, "why": "Ionic keeps routed pages alive and caches them. That caching is also why `ngOnDestroy` does not run on every navigation away, which is the point of L03 slide 7."}, {"lesson": "L01.2", "q": "Which Node.js release line should be installed for the Ionic CLI?", "options": ["the current release", "the LTS release", "any version above 12", "the version bundled with Android Studio"], "correct": 1, "why": "L01.2 slide 2 states the LTS version explicitly. This lesson is screenshot only, so it carries almost no other examinable content."}, {"lesson": "L02", "q": "Which route entry produces the URL `/tabs/movies/01` as a child of the movies tab?", "options": ["{ path: 'movies/01', component: MovieDetailPage } in app-routing.module.ts", "{ path: ':id', loadChildren: ... } inside movies-routing.module.ts, with the movies tab mounted at 'movies'", "{ path: 'movie-detail/:id', loadChildren: ... } in app-routing.module.ts", "{ path: 'movies', component: MovieDetailPage } in tabs-routing.module.ts"], "correct": 1, "why": "The detail segment must hang off the movies feature so the URL nests under the tab. Putting it in `app-routing.module.ts` produces a sibling URL such as `/movie-detail/1`, which is what the reference activity does."}, {"lesson": "L02", "q": "The deck writes `loadComponent: () => import('./home/home.page').then(m => m.HomePage)`. What is the NgModule equivalent?", "options": ["children: () => import('./home/home.page').then(m => m.HomePage)", "component: () => import('./home/home.page').then(m => m.HomePage)", "loadChildren: () => import('./home/home.module').then(m => m.HomePageModule)", "providers: () => import('./home/home.module').then(m => m.HomePageModule)"], "correct": 2, "why": "`loadComponent` resolves a class and is standalone-API only. `loadChildren` resolves a module, so the target is `HomePageModule`, not `HomePage`."}, {"lesson": "L02", "q": "Why must the empty-path child route keep `pathMatch: 'full'`?", "options": ["Otherwise the parameter will not be read", "Otherwise the redirect matches every URL and navigation never completes", "Otherwise lazy loading is disabled", "It is optional and only a style choice"], "correct": 1, "why": "An empty path with default prefix matching matches every URL, so the app is trapped in the redirect."}, {"lesson": "L02", "q": "Which statement about route parameters is correct?", "options": ["They arrive as numbers when the path segment is numeric", "They arrive as strings and must be converted before numeric comparison", "They are only readable inside a service", "They are read in the constructor"], "correct": 1, "why": "URL segments are text. `paramMap.get('id')` returns `string | null`, so `Number(...)` or `+` is required before comparing with `movie.id`. The read belongs in `ngOnInit`."}, {"lesson": "L02", "q": "`this.router.navigate(['/products', 42])` versus `this.router.navigate(['/products/42'])`. Which is correct for a route declared `path: 'products/:id'`?", "options": ["Both work identically", "Only the array form with the id as a separate element", "Only the single concatenated string", "Neither; `NavController` is required"], "correct": 1, "why": "The array form is how Angular maps values onto path segments. `Router.navigate` also accepts a string, but only for a literal path with no parameter substitution."}, {"lesson": "L02", "q": "With tabs, why is browser Back not equivalent to app Back?", "options": ["Tabs disable the browser history entirely", "Each tab keeps its own history stack, so the previously seen screen is not always the previous browser entry", "Ionic removes the back button", "Because tabs use `href` instead of `routerLink`"], "correct": 1, "why": "L02 slide 13. Each tab maintains an independent stack; `ion-back-button` follows Ionic navigation history rather than the browser's."}, {"lesson": "L03", "q": "Correct first-visit order for a routed Ionic page?", "options": ["ngOnInit, constructor, ionViewWillEnter, ionViewDidEnter", "constructor, ngOnInit, ionViewWillEnter, ionViewDidEnter", "ionViewWillEnter, constructor, ngOnInit, ionViewDidEnter", "constructor, ionViewWillEnter, ngOnInit, ionViewDidEnter"], "correct": 1, "why": "L03 slide 6. The class is constructed, Angular initialises it once, then Ionic's navigation hooks fire."}, {"lesson": "L03", "q": "A page must refresh its list every time the user returns to the tab. Where does that call go?", "options": ["constructor", "ngOnInit", "ionViewWillEnter", "ngOnDestroy"], "correct": 2, "why": "`ngOnInit` runs once for the life of the cached page. `ionViewWillEnter` runs on every entry, which is the correct hook for refresh-on-return (L03 slide 10)."}, {"lesson": "L03", "q": "Why can `ngOnDestroy` fail to run when leaving a page?", "options": ["Because Ionic keeps the page cached in the DOM and only removes it when popped from history", "Because `ngOnDestroy` requires a subscription", "Because `ngOnDestroy` is not an Angular hook", "Because tabs disable Angular hooks"], "correct": 0, "why": "L03 slide 7. Cleanup that must happen when a page stops being visible belongs in `ionViewWillLeave`; `ngOnDestroy` is for final teardown."}, {"lesson": "L04", "q": "Which of these belongs in a component constructor?", "options": ["Calling the service to load the page data", "Storing injected dependencies", "Starting a timer that the page will clear", "Reading a route parameter"], "correct": 1, "why": "L04 slide 6: the constructor creates the object. Page data, timers and parameter reads belong after initialisation."}, {"lesson": "L04", "q": "What is wrong with `import { Service } from '@angular/core'; @Service()`?", "options": ["Nothing, it is the standard form", "`Service` is not exported by `@angular/core`; the decorator is `@Injectable()`", "It requires `providedIn: 'root'` to compile", "It only works for standalone components"], "correct": 1, "why": "Angular has no `Service` decorator. The reference activity in this workspace makes exactly this mistake, so it is worth recognising on sight."}, {"lesson": "L04", "q": "What does `providedIn: 'root'` give you?", "options": ["A new instance of the service in every component", "A single application-wide instance registered with the root injector, with no providers array entry", "Lazy loading of the service", "A service that cannot be injected into pages"], "correct": 1, "why": "It is the tree-shakable singleton form. The alternative is a bare `@Injectable()` plus an entry in some module's `providers: []`."}, {"lesson": "L05", "q": "When should a model be a `class` rather than an `interface`?", "options": ["When it has more than five fields", "When the record needs behaviour such as a method", "When it comes from an API", "Never, interfaces are always preferred"], "correct": 1, "why": "An interface is a compile-time data shape. A class is needed once records carry logic, which is the L05 slide 9 distinction."}, {"lesson": "L05", "q": "`getMovieById` is typed `Movie | undefined`. What must the template do?", "options": ["Nothing, Angular handles it", "Guard the record, for example `*ngIf=\"movie\"`, and use optional chaining such as `movie?.title`", "Wrap the call in try/catch", "Declare `movie` as `any`"], "correct": 1, "why": "An id with no match leaves the field undefined. Without a guard, `{{ movie.title }}` throws during change detection."}, {"lesson": "L06", "q": "Which construct guarantees that loading state is cleared whether the async task succeeds or fails?", "options": ["try / catch", "try / finally", "then / catch", "async alone"], "correct": 1, "why": "`finally` is the block that always runs. L06 slide 7 makes the point that Ionic UI elements (loaders, refreshers, buttons) must be restored even on error, so `finally` is the correct home for that cleanup."}, {"lesson": "L06", "q": "`observable$ | async` in a template, compared with a manual `subscribe()`, is preferred because it", "options": ["converts the Observable into a Promise", "subscribes, updates the view and unsubscribes automatically when the component is destroyed", "runs before `ngOnInit`", "caches the response on disk"], "correct": 1, "why": "L06 slide 8. The pipe handles the subscription lifetime, which removes the leak that a forgotten `unsubscribe()` causes."}, {"lesson": "L06", "q": "The `$` suffix on `products$` signals", "options": ["a destroyed stream", "an Observable, by convention", "a Promise", "a private field"], "correct": 1, "why": "It is a naming convention only, with no effect on behaviour. It is worth following because it makes the async pipe usage obvious at the call site."}, {"lesson": "L07", "q": "Where should global brand colours be changed?", "options": ["In every page's `.scss`", "In `src/theme/variables.scss` as `--ion-color-*` custom properties", "In `global.scss` with plain CSS selectors", "In `angular.json`"], "correct": 1, "why": "L07 slides 7 and 9. One variable edit re-themes every component that uses `color=\"primary\"`, instead of styling each component separately."}, {"lesson": "L07", "q": "Why does `<ion-button color=\"primary\">` pick up your brand blue without any component CSS?", "options": ["Ionic hardcodes blue for primary", "The template asks for a colour name and Ionic resolves it through the `--ion-color-primary` custom properties", "Because the button inherits the page background", "Because `color` is a CSS class"], "correct": 1, "why": "L07 slide 10: the template names the colour, the theme supplies the value."}, {"lesson": "L07", "q": "You need to style the inner label of an `ion-item`. What is the correct approach?", "options": ["A normal descendant selector", "A `::part()` selector or an Ionic-provided custom property, because the component's shadow DOM blocks ordinary selectors", "`!important` on the page stylesheet", "Editing the Ionic source files"], "correct": 1, "why": "L07 slides 13 to 14. Shadow DOM isolates component internals, so only exported parts and custom properties reach inside."}, {"lesson": "L02", "q": "Which declaration makes `/tabs` itself open the Movies tab?", "options": ["{ path: '', redirectTo: '/tabs/movies', pathMatch: 'full' } as the last child of the tabs route", "{ path: 'movies', redirectTo: '/tabs/movies' } in app-routing.module.ts", "{ path: '', component: MoviesPage } as a child of the tabs route", "Adding `default=\"movies\"` to the ion-tabs element"], "correct": 0, "why": "An empty-path child with `pathMatch: 'full'` catches the bare `/tabs` URL. A component in that slot would render on top of the tab bar."}, {"lesson": "L02", "q": "A catalogue must own its detail route so the URL nests. Which pair is correct?", "options": ["tabs: `movies` loadChildren MoviesPageModule, and movies: `:id` loadChildren MovieDetailPageModule", "tabs: `movies/:id` loadChildren MovieDetailPageModule, and movies: `:id` as well", "app-routing: `movies/:id` loadChildren MovieDetailPageModule", "tabs: `movies` loadChildren MovieDetailPageModule, and movies: `''` loadChildren MoviesPageModule"], "correct": 0, "why": "The tab mounts the catalogue by name, and the catalogue declares its own `:id` child. Declaring `:id` twice makes the second route unreachable."}, {"lesson": "L04", "q": "Where does the logout call belong in a page that must clear the session?", "options": ["In the constructor, so the session clears as the page object is built", "In a method called from the template, before navigating away", "In ngOnInit, because that is the initialisation hook", "In ngOnDestroy, because the page is being left"], "correct": 1, "why": "The constructor only wires dependencies and must stay free of side effects, and `ngOnDestroy` cannot be relied on because Ionic caches pages. The action belongs in a method invoked by the user's tap, immediately before the navigation call."}, {"lesson": "L05", "q": "`getItemById` returns `MenuItem | undefined` and the template has no guard. What is the observable result?", "options": ["The page renders an empty record", "The template throws while reading a property of undefined during change detection", "The router falls back to the catalogue", "TypeScript refuses to compile the template"], "correct": 1, "why": "An unmatched id leaves the field undefined. `{{ item.name }}` then reads a property of undefined at render time, which is a runtime error, not a compile error."}, {"lesson": "L06", "q": "A pull-to-refresh handler must hide the refresher on success and on failure. Which shape does that?", "options": ["await the work, then call event.target.complete() after the await", "try { await work } catch {} finally { event.target.complete() }", "wrap the work in a Promise and complete in .then()", "call complete() before awaiting the work"], "correct": 1, "why": "`finally` runs on both paths. Completing after the await alone leaves the spinner stuck when the request rejects, and completing before the await dismisses the refresher immediately."}, {"lesson": "L07", "q": "A page needs a two-column card grid on wide screens. What is the L07 approach?", "options": ["Set fixed pixel widths on each card in the page stylesheet", "Use a layout component plus a page-level media query against the page's own grid class", "Override the global variables.scss for the page only", "Use `::part()` to resize the Ionic cards"], "correct": 1, "why": "L07 slide 17 pairs Ionic layout components with a page-scoped responsive rule. Fixed widths break on phones, and theme variables carry colour rather than layout."}, {"lesson": "L03", "q": "A page starts a timer on entry and must stop it when the user leaves for another tab. Which pair is correct?", "options": ["start in ngOnInit, stop in ngOnDestroy", "start in ionViewWillEnter, stop in ionViewWillLeave", "start in the constructor, stop in ionViewDidLeave", "start in ionViewDidEnter, stop in ngOnInit"], "correct": 1, "why": "L03 slide 11. Because the page is cached rather than destroyed, `ngOnDestroy` is not called when the user leaves. The Ionic enter and leave hooks bracket the visible lifetime."}], "mtf": [{"lesson": "L02", "code": "In an NgModule project, `RouterModule.forRoot(routes)` is called exactly once, in `app-routing.module.ts`.", "key": "TRUE", "alts": ["true", "t"], "why": "One `forRoot` per application. Every other routing module uses `forChild`."}, {"lesson": "L02", "code": "Each page's own routing module calls `RouterModule.__forRoot__(routes)` and exports `RouterModule`.", "key": "forChild", "alts": ["forchild", "for child"], "why": "`forRoot` in a lazily loaded module registers the routes a second time against the root injector and breaks navigation."}, {"lesson": "L02", "code": "The NgModule lazy-loading key is `__loadComponent__`, which resolves a page module.", "key": "loadChildren", "alts": ["loadchildren", "load children"], "why": "`loadComponent` resolves a component class and belongs to the standalone API. `loadChildren` resolves a module such as `MoviesPageModule`."}, {"lesson": "L02", "code": "Route parameters arrive as `__numbers__`, so no conversion is needed before comparing them with a record id.", "key": "strings", "alts": ["string", "text"], "why": "URL segments are text. `paramMap.get('id')` returns `string | null`, so `Number(...)` or `+` is required before comparing with `movie.id`."}, {"lesson": "L03", "code": "A route parameter should be read in the component `__constructor__`, because that runs first.", "key": "ngOnInit", "alts": ["ngoninit", "ng on init"], "why": "The constructor is for dependency wiring only. Parameter reads belong in `ngOnInit`, after Angular has initialised the component."}, {"lesson": "L03", "code": "`ionViewWillEnter` fires on `__every__` entry to a page, including re-entry to a page Ionic has cached.", "key": "TRUE", "alts": ["true", "t"], "why": "That is exactly why it is the correct hook for refresh-on-return, where `ngOnInit` would leave the data stale."}, {"lesson": "L03", "code": "Ionic lifecycle hooks are called only on routed `__child__` components.", "key": "page", "alts": ["page", "pages"], "why": "`ionViewWillEnter` and its siblings run on routed page components only. Small child components inside a page never receive them."}, {"lesson": "L02", "code": "`NavController.navigateRoot` sets a root transition and then navigates, and `{ replaceUrl: true }` is what replaces the history entry so Back cannot return to the previous page.", "key": "TRUE", "alts": ["true", "t"], "why": "That is the pair the exit button uses. `navigate` alone would push the login page on top of the tabs and leave Back able to re-enter them."}, {"lesson": "L02", "code": "`NavController.__navigate__('/login', { replaceUrl: true })` is the call the exit button makes, so Back cannot re-enter the tabs."
