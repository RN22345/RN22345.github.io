, "lines": ["Typical first-time page entry sequence.", "constructor", "class created", "ngOnInit", "init once", "ionViewWillEnter", "about to show", "transition", "animation", "ionViewDidEnter", "now visible", "TRACE THE ORDER", "```typescript", "constructor() {", "  console.log('1 constructor');", "}", "ngOnInit() {", "  console.log('2 ngOnInit');", "}", "ionViewWillEnter() {", "  console.log('3 ionViewWillEnter');", "}", "ionViewDidEnter() {", "  console.log('4 ionViewDidEnter');", "}", "```", "- Run the page and open the browser console.", "- Navigate away and come back to the page.", "- Should notice ngOnInit may not repeat, but Ionic", "enter hooks repeat.", "FIRST PAGE VISIT: Angular setup happens.", "EVERY PAGE VISIT: Ionic enter hooks are", "usually the better place for refresh logic."]}, {"n": 7, "title": "WHAT HAPPENS WHEN A PAGE LEAVES?", "lines": ["Leaving the screen is not always the same as being destroyed.", "Caching", "ionViewWillLeave", "about to hide", "transition", "page changes", "ionViewDidLeave", "now hidden", "kept alive", "often cached", "ngOnDestroy", "only if removed", "IONIC ROUTER OUTLET BEHAVIOR", "- Ionic may keep the old page in the DOM but", "hidden.", "- This preserves scroll position and page", "state.", "- Pages are usually removed only when", "popped from navigation history.", "TEACHING WARNING", "- Do not expect ngOnDestroy to run every time", "you navigate away.", "- Use ionViewWillLeave for cleanup that must", "happen when the page is no longer visible.", "- Use ngOnDestroy for final cleanup before the", "component is actually destroyed."]}]}, {"title": "The decision guide, and the memory phrase", "slides": [8], "points": ["This slide is the one to memorise, because it answers the practical question directly: constructor to inject services only, `ngOnInit` for one-time setup and data that does not need refreshing, `ionViewWillEnter` to refresh on every visit, `ionViewDidEnter` for work that needs a visible page, `ionViewWillLeave` to pause or stop things, `ngOnDestroy` for final cleanup when the component is actually destroyed.", "The memory phrase compresses it correctly: constructor receives the tools, `ngOnInit` prepares once, `ionViewWillEnter` refreshes each visit, `ionViewWillLeave` pauses or cleans up when leaving."], "defs": [], "code": [], "deck": [{"n": 8, "title": "MEMORY PHRASE!", "lines": ["WHERE SHOULD I PUT MY CODE?", "A direct decision guide for beginners.", "USE THIS", "WHEN", "constructor", "Inject services only. Keep it light. Avoid API calls and", "heavy logic.", "ngOnInit", "One-time setup, initial form values, configuration,", "load data that does not need refresh.", "ionViewWillEnter", "Refresh data every time user visits the page. Good", "for list/profile updates.", "ionViewDidEnter", "Run work after the page is visible, such as focus,", "animation-sensitive tasks, or plugin UI.", "ionViewWillLeave", "Pause/stop things when the page is leaving: timers,", "camera preview, subscriptions.", "ngOnDestroy", "Final cleanup when the component is actually", "destroyed.", "MEMORY PHRASE!", "- Constructor = receive tools.", "- ngOnInit = prepare once.", "- ionViewWillEnter = refresh", "each visit.", "- ionViewWillLeave = pause or", "cleanup when leaving."]}]}, {"title": "Worked examples: load once, refresh each visit, stop on leave", "slides": [9, 10, 11], "points": ["**Example 1, load once.** A profile page injects the service in the constructor and loads the data in `ngOnInit`. Correct because profile data rarely changes during a session. The deck's stated reason it is not in the constructor: the constructor should not do heavy work, Angular inputs may not be ready there, and a simple constructor is easier to debug.", "**Example 2, refresh each visit.** An orders page loads in `ionViewWillEnter` because the user may add, edit or delete data on another page and the list must be current on return. The deck's scenario is exactly the tabs flow: orders list, add order, back to orders.", "**Example 3, stop on leave.** A scanner page starts an interval in `ionViewDidEnter` and clears it in `ionViewWillLeave`. The stated reason: a running timer wastes battery and memory, and the page can be hidden but still alive."], "defs": [], "code": [{"slide": 9, "lang": "typescript", "code": "export class ProfilePage implements\nOnInit {\n  user?: User;\n  constructor(private userService: UserService) {}\n  ngOnInit() {\n    this.loadProfileOnce();\n  }\n  async loadProfileOnce() {\n    this.user = await\nthis.userService.getProfile();\n  }\n}"}, {"slide": 10, "lang": "typescript", "code": "export class OrdersPage {\n  orders: Order[] = [];\n  constructor(private orderService: OrderService) {}\n  ionViewWillEnter() {\n    this.refreshOrders();\n  }\n  async refreshOrders() {\n    this.orders = await\nthis.orderService.getOrders();\n  }\n}"}, {"slide": 11, "lang": "typescript", "code": "export class ScannerPage {\n  private timerId?: number;\n  ionViewDidEnter() {\n    this.timerId = window.setInterval(() => {\n      console.log('Scanning...');\n    }, 1000);\n  }\n  ionViewWillLeave() {\n    if (this.timerId) {\n      clearInterval(this.timerId);\n    }\n  }\n}"}], "deck": [{"n": 9, "title": "EXAMPLE 1: LOAD USER PROFILE ONCE", "lines": ["Use ngOnInit when data does not need to refresh on every visit.", "profile.page.ts", "```typescript", "export class ProfilePage implements", "OnInit {", "  user?: User;", "  constructor(private userService: UserService) {}", "  ngOnInit() {", "    this.loadProfileOnce();", "  }", "  async loadProfileOnce() {", "    this.user = await", "this.userService.getProfile();", "  }", "}", "```", "WHAT IS HAPPENING?", "- The service is injected in the constructor.", "- ngOnInit calls the loading function one time.", "- Good for profile data that rarely changes during", "the session.", "WHY NOT CONSTRUCTOR?", "- Constructor should not do heavy work.", "- Angular inputs may not be ready inside", "constructor.", "- Keeping constructor simple makes debugging", "easier."]}, {"n": 10, "title": "EXAMPLE 2: REFRESH LIST EVERY TIME PAGE OPENS", "lines": ["Use ionViewWillEnter when the screen must show fresh data.", "orders.page.ts", "```typescript", "export class OrdersPage {", "  orders: Order[] = [];", "  constructor(private orderService: OrderService) {}", "  ionViewWillEnter() {", "    this.refreshOrders();", "  }", "  async refreshOrders() {", "    this.orders = await", "this.orderService.getOrders();", "  }", "}", "```", "WHEN THIS IS BETTER THAN NGONINIT", "- The user may add, edit, or delete data on", "another page.", "- When they come back, this page should", "show updated records.", "- ionViewWillEnter runs on each page visit, not", "only first creation.", "MINI SCENARIO", "Orders list → Add Order page → Back to Orders", "list. The list should refresh automatically."]}, {"n": 11, "title": "EXAMPLE 3: STOP A TIMER WHEN LEAVING", "lines": ["Use ionViewWillLeave for cleanup needed as soon as the page hides.", "scanner.page.ts", "```typescript", "export class ScannerPage {", "  private timerId?: number;", "  ionViewDidEnter() {", "    this.timerId = window.setInterval(() => {", "      console.log('Scanning...');", "    }, 1000);", "  }", "  ionViewWillLeave() {", "    if (this.timerId) {", "      clearInterval(this.timerId);", "    }", "  }", "}", "```", "WHY THIS MATTERS", "- If the timer keeps running, the app wastes", "battery and memory.", "- The page may be hidden but still alive in Ionic.", "- ionViewWillLeave stops activity before the user", "leaves the screen.", "ALSO APPLIES TO", "- Camera preview or barcode scanner.", "- GPS/location watch.", "- Live subscriptions or polling functions."]}]}, {"title": "Common mistakes and debugging", "slides": [12, 13], "points": ["Six mistakes with their fixes: everything in `ngOnInit` (data does not refresh on a cached page, move it to `ionViewWillEnter`), heavy work in the constructor (inject only, then set up in a hook), waiting for `ngOnDestroy` (Ionic may hide without destroying, so pause in `ionViewWillLeave`), touching the DOM or a plugin too early (use `ionViewDidEnter` or `ngAfterViewInit`), no logging (stop guessing the order), and the wrong component (Ionic hooks only run on routed page components, so child components must use Angular hooks).", "The debug checklist is a five-step procedure: open the console, navigate A to B and back to A, observe which hooks repeat, set breakpoints inside the hooks, and use the Network tab to confirm when requests really fire.", "The deck supplies a reusable timestamped logger, which is the fastest way to settle an argument about ordering."], "defs": [], "code": [{"slide": 13, "lang": "typescript", "code": "private log(hook: string) {\n  console.log( '[' + new Date().toLocaleTimeString() + '] ' + hook );\n}\nngOnInit() { this.log('ngOnInit'); }\nionViewWillEnter() { this.log('ionViewWillEnter'); }\nionViewDidEnter() { this.log('ionViewDidEnter'); }\nionViewWillLeave() { this.log('ionViewWillLeave'); }\nionViewDidLeave() { this.log('ionViewDidLeave'); }\nngOnDestroy() { this.log('ngOnDestroy'); }"}], "deck": [{"n": 12, "title": "COMMON LIFECYCLE MISTAKES", "lines": ["These are the errors students usually make in Ionic Angular apps.", "Mistake 1: Everything in ngOnInit", "Problem: data may not refresh when", "returning to a cached page.", "Fix: use ionViewWillEnter for data that", "must refresh every visit.", "Mistake 2: Heavy work in constructor", "Problem: constructor should stay", "simple and predictable.", "Fix: inject services in constructor, then", "run setup in ngOnInit or Ionic hooks.", "Mistake 3: Waiting for ngOnDestroy", "Problem: Ionic may hide the page", "without destroying it.", "Fix: pause timers/subscriptions in", "ionViewWillLeave.", "Mistake 4: DOM/plugin too early", "Problem: view may not be ready or", "transition may still be running.", "Fix: use ionViewDidEnter or", "ngAfterViewInit depending on the task.", "Mistake 5: No logging", "Problem: students guess the order", "instead of observing it.", "Fix: add console logs to every hook", "while learning.", "Mistake 6: Wrong component", "Problem: Ionic hooks only run on", "routed page components.", "Fix: use Angular hooks for child/shared", "components."]}, {"n": 13, "title": "DEBUG CHECKLIST", "lines": ["DEBUGGING LIFECYCLE FUNCTIONS", "Use logs and breakpoints to see the actual order.", "Reusable lifecycle logger", "```typescript", "private log(hook: string) {", "  console.log( '[' + new Date().toLocaleTimeString() + '] ' + hook );", "}", "ngOnInit() { this.log('ngOnInit'); }", "ionViewWillEnter() { this.log('ionViewWillEnter'); }", "ionViewDidEnter() { this.log('ionViewDidEnter'); }", "ionViewWillLeave() { this.log('ionViewWillLeave'); }", "ionViewDidLeave() { this.log('ionViewDidLeave'); }", "ngOnDestroy() { this.log('ngOnDestroy'); }", "```", "DEBUG CHECKLIST", "- Open Chrome DevTools or", "browser console.", "- Navigate page A → page B →", "back to page A.", "- Check which hooks repeat and", "which do not.", "- Use breakpoints inside each", "hook for step-by-step tracing.", "- Use the Network tab to confirm", "when API requests really", "happen."]}]}, {"title": "Quick formula and summary", "slides": [14], "points": ["The four-line formula is the examinable compression of the whole lesson: need a service, use the constructor; need one-time setup, use `ngOnInit`; need fresh data every visit, use `ionViewWillEnter`; need to stop something when leaving, use `ionViewWillLeave`.", "The summary restates the frame: lifecycle hooks are automatic functions triggered by Angular or Ionic, Angular's manage creation and destruction, Ionic's manage entering and leaving, and because pages can be hidden but alive, refresh and cleanup logic must be placed deliberately."], "defs": [], "code": [], "deck": [{"n": 14, "title": "QUICK FORMULA", "lines": ["REMEMBER THESE FOUR IDEAS", "SUMMARY", "- Lifecycle hooks are automatic functions", "triggered by Angular or Ionic.", "- Angular hooks manage component creation,", "checking, rendering, and destruction.", "- Ionic hooks manage page entering and leaving", "during navigation.", "- Ionic pages can be hidden but still alive, so", "cleanup and refresh logic must be placed", "carefully.", "QUICK FORMULA", "- Need a service? constructor.", "- Need one-time setup?", "ngOnInit.", "- Need fresh data every visit?", "ionViewWillEnter.", "- Need to pause/stop when", "leaving? ionViewWillLeave."]}]}], "traps": ["Do not put data loading in the constructor. The deck states it as a rule, the drill enforces it, and it is the most likely true-or-false trap in this lesson.", "Do not expect `ngOnDestroy` when navigating away with tabs. The page is hidden, not destroyed.", "Ionic hooks do not run on child components. If a small component inside a page needs to react, it must use Angular hooks.", "The deck's code is already class-based, so it ports to NgModule form almost unchanged. The one addition in this project is `standalone: false` on the component decorator, required on Angular 19 and later because these pages are declared in modules."], "exam": "Identification: the five Angular hooks, the four Ionic hooks, page caching. Short answer and true-or-false: when to load once versus refresh every visit, and why `ngOnDestroy` is the wrong place for leave-time cleanup. Code: writing a page class that loads in the right hook."}, {"id": "L04", "title": "Services, and constructor versus ngOnInit", "slides": 15, "purpose": "Where code belongs. It defines what a service is, how dependency injection hands it to a page, and then draws the line that most beginners cross: the constructor creates the object, `ngOnInit` starts the page, and reusable logic belongs in the service. The examinable core is that three-way split.", "ngmodule": "One addition only. `providedIn: 'root'` works identically in both APIs, so no translation is needed for a service. If the alternative registration form is used instead, the entry goes in the declaring module's `providers: []` array, which is NgModule-specific.", "topics": [{"title": "What a service is, and the duplication it removes", "slides": [1, 2, 3, 4], "points": ["A service is a TypeScript class used to share logic. Angular injects it into the components and pages that need it, rather than each page building its own copy.", "The deck draws the before-and-after plainly. Before services, each page repeats the same API call, storage access and business rules. With services, one reusable class holds the logic and every page uses it.", "The stated result is the examinable benefit: cleaner code, easier testing, easier maintenance. Three pages at once is the deck's illustration.", "The three-column picture that runs through the lesson separates concerns: a component displays, a service holds shared logic, and the data or API is what the service talks to."], "defs": [["Service", "A TypeScript class used to share logic across components and pages.", "One reusable class instead of copies per page."]], "code": [], "deck": [{"n": 1, "title": "IONIC SERVICES", "lines": ["COMPONENT", "SERVICE", "DATA/API"]}, {"n": 2, "title": "WHAT IS A SERVICE?", "lines": ["A service is a TypeScript class used to share", "logic or data.", "It is commonly marked with @Injectable().", "Angular injects it into components/pages that", "need it.", "Ionic apps use services for API calls, storage,", "authentication, and shared state.", "WHAT IS A SERVICE?"]}, {"n": 3, "title": "WHAT IS A SERVICE?", "lines": ["```typescript", "import { Injectable } from '@angular/core';", "@Injectable({ providedIn: 'root' })", "export class TodoService {", "  getTodos() {", "    return ['Study Ionic', 'Build app'];", "  }", "}", "```", "providedIn: root", "means Angular", "creates one shared app-", "wide instance.", "WHAT IS A SERVICE?"]}, {"n": 4, "title": "WHY USE SERVICES? – AVOID DUPLICATE LOGIC", "lines": ["Before Services", "Each page repeats the same API,", "storage, or login code.", "With Services", "One reusable class stores the logic;", "pages just call methods.", "Result", "Cleaner, easier to test, easier to", "update, easier to debug.", "HomePage", "ProfilePage", "SettingsPage", "DataService", "RULE: If many pages need the same logic, make it a service.", "SettingsPage", "HomePage", "ProfilePage", "DataService", "API / Storage", "SettingsPage"]}]}, {"title": "Dependency injection and instance sharing", "slides": [6], "points": ["Angular gives the service to the component through dependency injection. The page declares what it needs in the constructor and never constructs the service itself with `new`.", "`providedIn: 'root'` tells Angular to create one shared application-wide instance, with no entry needed in any module's `providers` array. That is why a service registered this way can hold shared state across pages.", "The alternative form is a bare `@Injectable()` plus an entry in a module's `providers: []` array, which scopes the instance to that module. Both are valid; the class convention here uses the root form."], "defs": [["Dependency injection", "Angular gives the service to the component rather than the component creating it.", "Ask for it in the constructor; Angular supplies it."], ["providedIn: 'root'", "Angular creates one shared application-wide instance.", "One instance for the whole app, available everywhere."]], "code": [], "deck": [{"n": 6, "title": "USE CONSTRUCTOR FOR", "lines": ["DEPENDENCY INJECTION", "```typescript", "export class HomePage {", "  constructor(private todoService: TodoService) {}", "  ngOnInit() {", "    this.todos = this.todoService.getTodos();", "  }", "}", "```", "Angular gives the service to the component through the", "constructor.", "The constructor should not perform heavy work.", "Avoid calling APIs, showing alerts, or navigating", "from the constructor.", "Keep constructors boring; assign dependencies only.", "Good constructor = easy to test and less surprising.", "CORRECT PURPOSE"]}]}, {"title": "The three homes for code: service, constructor, ngOnInit", "slides": [8, 9, 10], "points": ["This decision guide is the most examinable table in the lesson. Three destinations, three different justifications.", "**Constructor**: dependency injection, very light default values, no visible side effects. It is about creating the object.", "**ngOnInit**: load initial page data, call service methods, prepare component state. It is about starting the page. The deck frames the question it answers as 'what should this page do when it starts?'", "**A service method**: API calls, storage logic, business rules, shared state changes, reusable logic. It is about reusable application logic.", "The wrong pattern is stated explicitly: avoid calling APIs, showing alerts, or navigating from the constructor. None of those belong to object creation, and all of them are hard to test and hard to debug there.", "The deck also notes that for refresh-on-return behaviour in Ionic, `ngOnInit` is not enough and `ionViewWillEnter` is required, which is the L03 lesson restated."], "defs": [["Constructor", "Dependency injection. Very light default values. No visible side effects. Creating object.", "Receive your tools."], ["ngOnInit", "Load initial page data. Call service methods. Prepare component state. Starting page.", "Prepare the page once."], ["Service method", "API calls. Storage logic. Business rules. Shared state changes. Reusable logic.", "Anything more than one page might need."]], "code": [{"slide": 5, "lang": "typescript", "code": "Service\nconstructor()\n ngOnInit()"}, {"slide": 7, "lang": "typescript", "code": "export class ProductsPage implements OnInit {\n  products: Product[] = [];\n  constructor(private productService: ProductService) {}\n  ngOnInit() {\n    this.loadProducts();\n  }\n  loadProducts() {\n    this.products = this.productService.getProducts();\n  }\n}"}], "deck": [{"n": 8, "title": "IMPORTANT!", "lines": ["```typescript", "// Not recommended: expecting this to run in a service", "@Injectable({ providedIn: 'root' })", "export class AuthService implements OnInit {", "     ngOnInit() {", " // Angular will NOT call this for a normal service", "     }", "}", "// Better: create a method and call it from a page/app", "@Injectable({ providedIn: 'root’ })", "export class AuthService {", "  initSession() {", "    // check token, load user, etc.", "  }", "}", "```", "CORRECT PATTERN", "Service initialization should be explicit: call", "service.initSession() from AppComponent, a", "page, or a route guard.", "Use explicit service methods like getData(),", "saveData(), initSession(), or loadSettings().", "WRONG PATTERN", "Services do not use ngOnInit()."]}, {"n": 9, "title": "EXAMPLE 1: TODO SERVICE", "lines": ["SIMPLE SHARED DATA", "```typescript", "// todo.service.ts", "@Injectable({ providedIn: 'root' })", "export class TodoService {", "  private todos = ['Read', 'Code', 'Submit'];", "  getTodos() {", "    return this.todos;", "  }", "  addTodo(text: string) {", "    this.todos.push(text);", "  }", "}", "```", "```typescript", "// home.page.ts", "export class HomePage implements", "OnInit {", "  todos: string[] = [];", "  constructor(private todoService: TodoService) {}", "  ngOnInit() {", "    this.todos = this.todoService.getTodos();", "  }", "}", "```", "EXPLANATION: the service owns the list; the page asks for the list when the page initializes."]}, {"n": 10, "title": "EXAMPLE 2: SETTINGS SERVICE", "lines": ["```typescript", "// settings.service.ts", "@Injectable({ providedIn: 'root' })", "export class SettingsService {", "  constructor(private storage: Storage) {}", "  async getTheme() {", "    return await this.storage.get('theme');", "  }", "  async setTheme(theme: string) {", "    await this.storage.set('theme', theme);", "  }", "}", "```", "```typescript", "// settings.page.ts", "export class SettingsPage implements OnInit {", "  theme = 'light';", "  constructor(private settings: SettingsService) {}", "  async ngOnInit() {", "     this.theme = await", "this.settings.getTheme() ?? 'light';", "  }", "}", "```", "STORAGE-STYLE LOGIC", "EXAMPLE 2: SETTINGS SERVICE", "Constructor injects Storage. ngOnInit asks the service for the saved value."]}]}, {"title": "Explicit service initialisation", "slides": [11], "points": ["Startup work should be explicit rather than hidden in a service constructor. The deck's pattern is a named method such as `service.initSession()` called from `AppComponent`.", "The companion anti-pattern is a service that quietly does work when it is first injected, so nothing in the code says when it happened. The deck calls for explicit methods such as `getData()`, `initSession()` and `addNote()`.", "This is a design point that is easy to write and easy to lose marks on if the exam asks where service startup belongs."], "defs": [], "code": [{"slide": 11, "lang": "typescript", "code": "// product.service.ts\n@Injectable({ providedIn: 'root' })\nexport class ProductService {\n  constructor(private http: HttpClient) {}\n  getProducts() {\n     return this.http.get<Product[]>('/api/products');\n  }\n}"}, {"slide": 11, "lang": "typescript", "code": "// products.page.ts\nexport class ProductsPage implements OnInit {\n  products: Product[] = [];\n  constructor(private productService: ProductService) {}\n  ngOnInit() {\n    this.productService.getProducts()\n      .subscribe(data => this.products = data);\n  }\n}"}], "deck": [{"n": 11, "title": "EXAMPLE 3: API DATA SERVICE", "lines": ["```typescript", "// product.service.ts", "@Injectable({ providedIn: 'root' })", "export class ProductService {", "  constructor(private http: HttpClient) {}", "  getProducts() {", "     return this.http.get<Product[]>('/api/products');", "  }", "}", "```", "```typescript", "// products.page.ts", "export class ProductsPage implements OnInit {", "  products: Product[] = [];", "  constructor(private productService: ProductService) {}", "  ngOnInit() {", "    this.productService.getProducts()", "      .subscribe(data => this.products = data);", "  }", "}", "```", "HTTP REQUEST PATTERN", "EXAMPLE 3: API DATA SERVICE", "Do not start the HTTP call in the service constructor. Let the page call a service method when needed."]}]}, {"title": "The three worked service examples", "slides": [12, 13, 14], "points": ["**Example 1, simple shared data.** A plain array held in the service and read by pages. No network, no storage. This is the shape the canonical project uses for its catalogues.", "**Example 2, storage-style settings.** The service reads and writes persisted values, so the pages never touch storage directly.", "**Example 3, API data service.** The service performs the HTTP request and returns typed data; the page subscribes and assigns. This is the L05 interface-with-a-service pattern."], "defs": [], "code": [{"slide": 14, "lang": "typescript", "code": "// Debug with console logs\nconstructor() {\n  console.log('constructor runs');\n}\nngOnInit() {\n  console.log('ngOnInit runs');\n}"}], "deck": [{"n": 12, "title": "Is this creating the object, starting the page, or", "lines": ["DECISION GUIDE", "Put in constructor", "Dependency injection", "Very light default values", "No visible side effects", "Creating object", "Put in ngOnInit", "Load initial page data", "Call service methods", "Prepare component state", "Starting page", "Put in service method", "API calls", "Storage logic", "Business rules", "Shared state changes", "Reusable logic", "Is this creating the object, starting the page, or", "reusable app logic?"]}, {"n": 13, "title": "COMMON MISTAKES AND FIXES", "lines": ["DEBUGGING MINDSET", "MISTAKE 1", "Putting API calls in the constructor.", "FIX: call service method in ngOnInit.", "MISTAKE 2", "Expecting service ngOnInit to run.", "FIX: create init() and call it manually.", "MISTAKE 3", "Copying logic into many pages.", "FIX: move shared logic into a service."]}, {"n": 14, "title": "COMMON MISTAKES AND FIXES", "lines": ["DEBUGGING MINDSET", "```typescript", "// Debug with console logs", "constructor() {", "  console.log('constructor runs');", "}", "ngOnInit() {", "  console.log('ngOnInit runs');", "}", "```", "Add logs to see what runs first.", "Check whether the class is a component or service.", "Check if the service is listed in providers or", "providedIn.", "Check browser console and Network tab for API", "errors."]}]}, {"title": "Debugging and the three mistakes", "slides": [15], "points": ["Two checks solve most service failures: confirm the service is registered, either through `providedIn: 'root'` or through an entry in the module's `providers` array; and read the browser console and the Network tab for the actual error.", "The three mistakes follow the same theme: logic in the wrong home. Code that belongs in the service is copied into pages until the pages disagree with each other; data loading sits in the constructor; and startup work hides inside the service.", "The mini-activity questions are worth answering out loud because they are the exam questions in disguise: where should the service be injected (the constructor), where should the first list be loaded (`ngOnInit`), should a service have `ngOnInit` (no, services have no lifecycle hooks; expose an explicit method instead), and what happens if one method is copied into multiple pages (the copies drift and the pages stop agreeing)."], "defs": [], "code": [], "deck": [{"n": 15, "title": "MINI ACTIVITY", "lines": ["```", "Task: Build a simple Notes feature", "1. Create NotesService", "2. Add getNotes() and addNote(text)", "3. Inject NotesService in NotesPage", "constructor", "4. In ngOnInit, load notes from service", "5. Add a button that calls addNote", "```", "APPLY THE CONCEPT", "MINI ACTIVITY", "Where should NotesService be injected?", "Where should the first note list be loaded?", "Should NotesService have ngOnInit?", "What happens if addNote is copied into multiple pages?"]}]}], "traps": ["A service has no lifecycle hooks. `ngOnInit` on a service does nothing. If startup work is needed, expose a named method and call it explicitly.", "The constructor is for dependency injection. API calls, alerts and navigation in the constructor are the lesson's named wrong pattern.", "`@Injectable({ providedIn: 'root' })` needs no `providers` entry. A bare `@Injectable()` does.", "There is no `@Service` decorator in Angular. The reference activity in this workspace uses one in two files and will not compile."], "exam": "High value for both formats. Identification: service, dependency injection, `providedIn: 'root'`. Short answer and true-or-false: what belongs in the constructor versus `ngOnInit` versus a service method, and why. Code: writing a service with `providedIn: 'root'` and a page that injects it and loads in `ngOnInit`."}, {"id": "L05", "title": "Models and interfaces", "slides": 17, "purpose": "How to describe the shape of application data so the compiler can catch mistakes before they reach the template. It contrasts the interface (a compile-time contract, no runtime code) with the model class (a blueprint that creates objects and carries behaviour), and gives a simple rule for choosing.", "ngmodule": "No translation needed. Interfaces and model classes are plain TypeScript and behave identically in both APIs. Nothing about them touches the module system.", "topics": [{"title": "Why structured data matters", "slides": [1, 2, 3], "points": ["Without structure, data can be missing, wrong property names are hard to catch, the code becomes guesswork, and templates break silently.", "With an interface or model, the expected fields are clear, TypeScript warns early, autocomplete becomes useful, and both service and component code get cleaner.", "The stated results are fewer bugs, cleaner API response handling, and reusable data definitions. The one-line frame to remember: interfaces describe data, model classes can create and control data."], "defs": [], "code": [], "deck": [{"n": 1, "title": "IONIC MODELS & INTERFACE", "lines": ["TODAY’S FOCUS", "Interface = data shape", "Model = behavior + data", "Use them in pages, services, and", "templates", "IONIC MODELS & INTERFACE"]}, {"n": 2, "title": "WHY DO WE NEED MODELS AND INTERFACES?", "lines": ["They keep app data predictable, readable, and easier to debug.", "Without structure", "- Data can be missing", "- Wrong property names are", "hard to catch", "- Code becomes guesswork", "- Templates may break", "silently", "With interface/model", "- Expected fields are clear", "- TypeScript warns early", "- Autocomplete becomes", "useful", "- Service + component code", "becomes cleaner", "Result", "- Less bugs", "- Cleaner API", "response handling", "- Reusable app data", "definitions"]}, {"n": 3, "title": "Typescript Interfaces", "lines": ["describe data.", "Model classes can create", "and control data."]}]}, {"title": "The three basic terms", "slides": [4], "points": ["An **object** is a group of related values: one student, one product, one task.", "An **interface** is a TypeScript contract. It says what properties an object should have and it has no runtime code. It disappears when the application runs.", "A **model class** is a blueprint that can create objects. It can include a constructor and methods, and it exists at runtime."], "defs": [["Object", "A group of related values. Example: one student, one product, one task.", "One record."], ["Interface", "A TypeScript contract. Says what properties an object should have. No runtime code.", "A description the compiler checks; gone at runtime."], ["Model Class", "A blueprint that can create objects. Can include constructor and methods. Exists at runtime.", "A description that can also make records and do things."]], "code": [{"slide": 4, "lang": "typescript", "code": "Object example\nconst student = {\n  id: 1,\n  name: 'Ana',\n  yearLevel: 2\n};"}, {"slide": 4, "lang": "typescript", "code": "Interface example\ninterface Student {\n  id: number;\n  name: string;\n}"}, {"slide": 4, "lang": "typescript", "code": "Model example\nclass StudentModel {\n  constructor(public name: string) {}\n}"}], "deck": [{"n": 4, "title": "Basic Terms", "lines": ["Simple meaning before coding.", "Object", "A group of related values", "Example: one student, one product,", "one task", "Interface", "A TypeScript contract", "Says what properties an object", "should have", "No runtime code", "Model Class", "A blueprint that can create objects", "Can include constructor and methods", "Exists at runtime", "```typescript", "Object example", "const student = {", "  id: 1,", "  name: 'Ana',", "  yearLevel: 2", "};", "```", "```typescript", "Interface example", "interface Student {", "  id: number;", "  name: string;", "}", "```", "```typescript", "Model example", "class StudentModel {", "  constructor(public name: string) {}", "}", "```"]}]}, {"title": "Interfaces: the data shape", "slides": [5, 6], "points": ["An interface lists fields and their types. `id`, `name`, `price` and `isAvailable` must exist; `imageUrl?: string` may be missing. The question mark is the optional marker.", "Interfaces are compile-time only. They help TypeScript check the code before it runs, and contribute nothing to the shipped JavaScript.", "The three-step usage pattern is worth memorising because it is the code exercise in this lesson: create the interface file, use it to type the array in the page class, then bind that array in the template with `*ngFor` and `{{ }}`.", "The stated protection is precise: it prevents mistyping `student.fullname` for `student.fullName`, and it prevents putting text into a field declared as a number."], "defs": [], "code": [{"slide": 5, "lang": "typescript", "code": "export interface Product {\n  id: number;\n  name: string;\n  price: number;\n  imageUrl?: string; // optional\n  isAvailable: boolean;\n}"}, {"slide": 6, "lang": "typescript", "code": "// student.interface.ts\nexport interface Student {\n  id: number;\n  fullName: string;\n  course: string;\n  yearLevel: number;\n  isEnrolled: boolean;\n}"}, {"slide": 6, "lang": "typescript", "code": "// students.page.ts\nimport { Student } from '../models/student.interface';\nstudents: Student[] = [\n  { id: 1, fullName: 'Mark Santos', course: 'BSIT', yearLevel: 3,\nisEnrolled: true },\n  { id: 2, fullName: 'Ana Cruz', course: 'BSCS', yearLevel: 2,\nisEnrolled: false }\n];"}, {"slide": 6, "lang": "html", "code": "<ion-list>\n  <ion-item *ngFor=\"let student of students\">\n    <ion-label>\n      <h2>{{ student.fullName }}<\/h2>\n      <p>{{ student.course }} - Year {{ student.yearLevel }}<\/p>\n    <\/ion-label>\n  <\/ion-item>\n<\/ion-list>"}], "deck": [{"n": 5, "title": "Interface: The Data Shape", "lines": ["Use an interface when you only need to describe fields and their types.", "src/app/models/product.interface.ts", "```typescript", "export interface Product {", "  id: number;", "  name: string;", "  price: number;", "  imageUrl?: string; // optional", "  isAvailable: boolean;", "}", "```", "REQUIRED FIELDS", "id, name, price, isAvailable must exist.", "OPTIONAL FIELD", "imageUrl? means the property may be missing.", "COMPILE-TIME ONLY", "Interfaces help TypeScript check your code before running."]}, {"n": 6, "title": "Example 1: Student Interface", "lines": ["A clean way to type data used by an Ionic page.", "Step 1: Create interface", "```typescript", "// student.interface.ts", "export interface Student {", "  id: number;", "  fullName: string;", "  course: string;", "  yearLevel: number;", "  isEnrolled: boolean;", "}", "```", "Step 2: Use it in component", "```typescript", "// students.page.ts", "import { Student } from '../models/student.interface';", "students: Student[] = [", "  { id: 1, fullName: 'Mark Santos', course: 'BSIT', yearLevel: 3,", "isEnrolled: true },", "  { id: 2, fullName: 'Ana Cruz', course: 'BSCS', yearLevel: 2,", "isEnrolled: false }", "];", "```", "Step 3: Display in Ionic template", "```html", "<ion-list>", "  <ion-item *ngFor=\"let student of students\">", "    <ion-label>", "      <h2>{{ student.fullName }}<\/h2>", "      <p>{{ student.course }} - Year {{ student.yearLevel }}<\/p>", "    <\/ion-label>", "  <\/ion-item>", "<\/ion-list>", "```", "What this prevents", "Mistyping student.fullname instead of student.fullName", "Putting text into yearLevel when number is expected"]}]}, {"title": "Model classes: data plus behaviour", "slides": [7, 8], "points": ["A model class is for when the object itself should know how to do something. The deck's rule: use a class when the object needs logic, default values, or helper methods.", "Three features carry the lesson: the constructor creates the object and initialises values; a default value such as `isDone: boolean = false` applies when no value is given; and methods such as `toggleDone()` and `getStatusText()` add behaviour.", "Objects are created with `new`, and the page calls the methods. The template can call a method directly, as in `{{ task.getStatusText() }}`."], "defs": [], "code": [{"slide": 7, "lang": "typescript", "code": "export class TodoModel {\n  constructor( public id: number, public title: string, public isDone: boolean = false ) {}\n  toggleDone(): void {\n    this.isDone = !this.isDone;\n  }\n  getStatusText(): string {\n    return this.isDone ? 'Done' : 'Pending';\n  }\n}"}, {"slide": 8, "lang": "typescript", "code": "// tasks.page.ts\nimport { TodoModel } from '../models/todo.model';\ntasks: TodoModel[] = [\n  new TodoModel(1, 'Read lesson notes'),\n  new TodoModel(2, 'Submit activity', true)\n];\nmarkTask(task: TodoModel) {\n  task.toggleDone();\n}"}, {"slide": 8, "lang": "html", "code": "<ion-list>\n  <ion-item *ngFor=\"let task of tasks\">\n    <ion-label>\n      <h2>{{ task.title }}<\/h2>\n      <p>{{ task.getStatusText() }}<\/p>\n    <\/ion-label>\n    <ion-button (click)=\"markTask(task)\">Toggle<\/ion-button>\n  <\/ion-item>\n<\/ion-list>"}], "deck": [{"n": 7, "title": "Model Class: Data + Behavior", "lines": ["Use a class when the object needs logic, default values, or helper methods.", "todo.model.ts", "```typescript", "export class TodoModel {", "  constructor( public id: number, public title: string, public isDone: boolean = false ) {}", "  toggleDone(): void {", "    this.isDone = !this.isDone;", "  }", "  getStatusText(): string {", "    return this.isDone ? 'Done' : 'Pending';", "  }", "}", "```", "Constructor", "Creates the object and initializes values.", "Default value", "isDone starts as false if no value is given.", "Methods", "toggleDone() and getStatusText() add behavior."]}, {"n": 8, "title": "Example 2: Using a Model in an Ionic Page", "lines": ["Create objects from the model class and call methods from the page.", "Component code", "```typescript", "// tasks.page.ts", "import { TodoModel } from '../models/todo.model';", "tasks: TodoModel[] = [", "  new TodoModel(1, 'Read lesson notes'),", "  new TodoModel(2, 'Submit activity', true)", "];", "markTask(task: TodoModel) {", "  task.toggleDone();", "}", "```", "Ionic template", "```html", "<ion-list>", "  <ion-item *ngFor=\"let task of tasks\">", "    <ion-label>", "      <h2>{{ task.title }}<\/h2>", "      <p>{{ task.getStatusText() }}<\/p>", "    <\/ion-label>", "    <ion-button (click)=\"markTask(task)\">Toggle<\/ion-button>", "  <\/ion-item>", "<\/ion-list>", "```", "Lesson point", "Use a model class when the object itself should know how to do something."]}]}, {"title": "Interface versus model class", "slides": [9], "points": ["Three differences decide it. Does it create an object: the interface cannot, the model class does, with `new`. Does it have methods: no, yes. Does it produce runtime code: no, yes.", "Best for an interface: an API response shape, simple application data, forms and lists. Best for a model class: default values, helper methods, data with behaviour.", "The deck's simple rule is the examinable compression: an API response takes an interface first; an object with logic takes a model class."], "defs": [], "code": [], "deck": [{"n": 9, "title": "Interface vs Model Class", "lines": ["Choose based on what your data needs to do.", "Creates object?", "Interface: No", "Model Class: Yes, using new", "Has methods?", "Interface: No", "Model Class: Yes", "Runtime code?", "Interface: No", "Model Class: Yes", "Best for interface", "API response shape", "Simple app data", "Forms and lists", "Best for model class", "Default values", "Helper methods", "Data with behavior", "Simple rule", "API response → interface first. Object with logic → model class."]}]}, {"title": "Where these files live", "slides": [10], "points": ["`src/app/models/` holds interfaces and model classes, named for what they describe such as `student.interface.ts` or `todo.model.ts`.", "`src/app/services/` fetches, saves, updates or transforms data. `src/app/pages/` uses the data and shows it through Ionic UI. `src/app/shared/components/` holds reusable pieces.", "The naming convention carries the intent: `.interface.ts` versus `.model.ts` tells the reader which of the two constructs is inside before the file is opened."], "defs": [], "code": [{"slide": 10, "lang": "text", "code": "src/app/\n├── models/\n│   ├── student.interface.ts\n│   ├── product.interface.ts\n│   └── todo.model.ts\n├── services/\n│   └── product.service.ts\n├── pages/\n│   ├── products/\n│   └── students/\n└── shared/\n    └── components/"}], "deck": [{"n": 10, "title": "Recommended Folder Structure", "lines": ["Keep model and interface files easy to find.", "Project structure", "```", "src/app/", "├── models/", "│   ├── student.interface.ts", "│   ├── product.interface.ts", "│   └── todo.model.ts", "├── services/", "│   └── product.service.ts", "├── pages/", "│   ├── products/", "│   └── students/", "└── shared/", "    └── components/", "```", "models/", "Interfaces and classes that describe app data.", "services/", "Fetch, save, update, or transform data.", "pages/", "Use the data and show it through Ionic UI."]}]}, {"title": "Interfaces with forms and with services", "slides": [11, 12, 13], "points": ["A form object typed by an interface is not random: the expected input fields are documented, and TypeScript catches wrong field names. The deck's register form is the pattern, bound with `[(ngModel)]`.", "The three-part flow through a service is the shape the canonical project uses: the interface defines the shape, the service requests or returns a typed list, and the page receives `Type[]` and displays it safely.", "Typed data in the template buys three things the deck names: autocomplete on the property name, fewer template mistakes, and shared understanding between people reading the code."], "defs": [], "code": [{"slide": 11, "lang": "typescript", "code": "export interface RegisterForm {\n  name: string;\n  email: string;\n  password: string;\n}"}, {"slide": 11, "lang": "typescript", "code": "form: RegisterForm = {\n  name: '',\n  email: '',\n  password: ''\n};\nsubmitForm() {\n  console.log(this.form.email);\n}"}, {"slide": 11, "lang": "html", "code": "<ion-input label=\"Email\" [(ngModel)]=\"form.email\">\n<\/ion-input>\n<ion-button (click)=\"submitForm()\">\n  Register\n<\/ion-button>"}, {"slide": 12, "lang": "typescript", "code": "// product.interface.ts\nexport interface Product {\n  id: number;\n  name: string;\n  price: number;\n}"}, {"slide": 12, "lang": "typescript", "code": "// product.service.ts\ngetProducts(): Observable<Product[]> {\n  return this.http.get<Product[]>( 'https://api.example.com/products' );\n}"}, {"slide": 12, "lang": "typescript", "code": "// products.page.ts\nproducts: Product[] = [];\nngOnInit() {\n  this.productService.getProducts()\n    .subscribe(data => {\n      this.products = data;\n    });\n}"}, {"slide": 13, "lang": "html", "code": "<ion-content>\n  <ion-card *ngFor=\"let product of products\">\n    <ion-card-header>\n      <ion-card-title>{{ product.name }}<\/ion- card-title>\n    <\/ion-card-header>\n    <ion-card-content>\n      Price: ₱{{ product.price }}\n    <\/ion-card-content>\n  <\/ion-card>\n<\/ion-content>"}], "deck": [{"n": 11, "title": "Using Interfaces with Ionic Forms", "lines": ["Types make form submit data easier to understand.", "register-form.interface.ts", "```typescript", "export interface RegisterForm {", "  name: string;", "  email: string;", "  password: string;", "}", "```", "register.page.ts", "```typescript", "form: RegisterForm = {", "  name: '',", "  email: '',", "  password: ''", "};", "submitForm() {", "  console.log(this.form.email);", "}", "```", "register.page.html", "```html", "<ion-input label=\"Email\" [(ngModel)]=\"form.email\">", "<\/ion-input>", "<ion-button (click)=\"submitForm()\">", "  Register", "<\/ion-button>", "```", "Why useful?", "The form object is not random.", "The expected input fields are", "documented.", "TypeScript helps catch wrong", "fields."]}, {"n": 12, "title": "Example 3: Interface with an Ionic Service", "lines": ["Services often return typed data from APIs.", "Data type", "```typescript", "// product.interface.ts", "export interface Product {", "  id: number;", "  name: string;", "  price: number;", "}", "```", "Service", "```typescript", "// product.service.ts", "getProducts(): Observable<Product[]> {", "  return this.http.get<Product[]>( 'https://api.example.com/products' );", "}", "```", "Page", "```typescript", "// products.page.ts", "products: Product[] = [];", "ngOnInit() {", "  this.productService.getProducts()", "    .subscribe(data => {", "      this.products = data;", "    });", "}", "```", "Flow", "Interface defines the product shape → service requests typed product list → page receives Product[] and displays it safely."]}, {"n": 13, "title": "Displaying Typed Data in Ionic UI", "lines": ["The page template becomes easier to read.", "products.page.html", "```html", "<ion-content>", "  <ion-card *ngFor=\"let product of products\">", "    <ion-card-header>", "      <ion-card-title>{{ product.name }}<\/ion- card-title>", "    <\/ion-card-header>", "    <ion-card-content>", "      Price: ₱{{ product.price }}", "    <\/ion-card-content>", "  <\/ion-card>", "<\/ion-content>", "```", "Autocomplete", "Typing product. helps the editor suggest id, name, and price.", "Fewer template mistakes", "product.price is safer than guessing property names.", "Better teamwork", "Everyone knows what a Product contains."]}]}, {"title": "Interface versus type alias, and the common mistakes", "slides": [14, 15, 16], "points": ["Both describe data. Use an interface for common object shapes such as Student, Product or User. Use a type alias for union values, shortcuts, or advanced combinations, as in `type UserRole = 'admin' | 'student' | 'guest'`.", "Three mistakes with their fixes: typing everything as `any` (TypeScript cannot help, so use `Product[]`, `Student[]` and similar), wrong property names (`product.title` instead of `product.name`, so match the interface fields), and expecting an API response to arrive as a class instance.", "That third mistake is the subtle one: API data does not automatically become a class instance. If methods are needed on records that came from an API, they must be mapped explicitly with `new Model(...)`, which the deck demonstrates with `items.map(item => new ProductModel(...))`."], "defs": [], "code": [{"slide": 14, "lang": "typescript", "code": "interface User {\n  id: number;\n  name: string;\n}"}, {"slide": 14, "lang": "text", "code": "type UserRole = 'admin' | 'student' | 'guest';\ntype User = {\n  id: number;\n  name: string;\n  role: UserRole;\n};"}, {"slide": 16, "lang": "typescript", "code": "export class ProductModel {\n  constructor( public id: number, public name: string, public price: number ) {}\n  getFormattedPrice(): string {\n    return '₱' + this.price.toFixed(2);\n  }\n}"}, {"slide": 16, "lang": "typescript", "code": "getProducts(): Observable<ProductModel[]> {\n  return this.http.get<any[]>(url).pipe( map(items => items.map(item => new ProductModel( item.id, item.name, item.price ) )) );\n}"}], "deck": [{"n": 14, "title": "Interface vs Type Alias", "lines": ["Both can describe data, but interfaces are usually simple for app models.", "Interface", "```typescript", "interface User {", "  id: number;", "  name: string;", "}", "```", "Type alias", "```", "type UserRole = 'admin' | 'student' | 'guest';", "type User = {", "  id: number;", "  name: string;", "  role: UserRole;", "};", "```", "Use interface for", "Common object shapes like Student, Product, User.", "Use type for", "Union values, shortcuts, or advanced type", "combinations."]}, {"n": 15, "title": "Common Beginner Mistakes", "lines": ["These usually cause confusing Ionic page errors.", "Mistake 1", "Using any everywhere", "Problem: TypeScript cannot help you", "Fix: use Product[], Student[], etc.", "Mistake 2", "Wrong property name", "product.title vs product.name", "Fix: match interface fields", "Mistake 3", "Class expected but plain object returned by", "API", "API data does not automatically become a", "class instance", "Fix: map it using new Model(...) if needed"]}, {"n": 16, "title": "When API Data Needs Model Methods", "lines": ["Convert plain API objects into model instances.", "product.model.ts", "```typescript", "export class ProductModel {", "  constructor( public id: number, public name: string, public price: number ) {}", "  getFormattedPrice(): string {", "    return '₱' + this.price.toFixed(2);", "  }", "}", "```", "product.service.ts", "```typescript", "getProducts(): Observable<ProductModel[]> {", "  return this.http.get<any[]>(url).pipe( map(items => items.map(item => new ProductModel( item.id, item.name, item.price ) )) );", "}", "```"]}]}], "traps": ["An interface carries no runtime code, so it cannot hold a method implementation. If behaviour is needed, it must be a class or a method in the consuming service.", "The optional marker is a single question mark on the property, not on the type.", "Records that arrive from an API are plain objects. They do not gain model methods unless each one is mapped with `new Model(...)`.", "Use the interface or class that already exists rather than declaring a second shape for the same record; duplicated shapes drift apart and the compiler stops being useful."], "exam": "Identification: interface, model class, the optional marker, the folder convention, the type alias. Short answer and true-or-false: interface versus model class and when to use each; whether an interface exists at runtime. Code: writing an interface, typing an array with it, and writing a model class with a method."}, {"id": "L06", "title": "Asynchronous functions", "slides": 23, "purpose": "The largest deck, and the one that explains why an app feels broken when it is only slow. It covers synchronous versus asynchronous execution, Promises, `async` and `await`, error handling with try/catch/finally, the async pipe, choosing between a Promise and an Observable, and the Ionic feedback pattern that keeps the user informed.", "ngmodule": "No translation needed. Async behaviour, Promises, Observables and the async pipe are identical in both APIs.", "topics": [{"title": "Why mobile apps are asynchronous at all", "slides": [3, 4, 5], "points": ["Mobile apps usually wait for something external: an API or server response, login or token validation, a local storage read or write, a camera, GPS, Bluetooth or filesystem operation, or a navigation and page refresh.", "The stated goal is that the app feels smooth because long tasks run asynchronously and the user receives clear feedback.", "Synchronous code runs line by line and the next line waits for the previous one to finish. It is simple but can block the app, and it suits only quick calculations.", "Asynchronous code starts a task that finishes later while the app keeps responding. It is what server and device operations require, and it always needs success and error handling.", "Without async handling, the deck's warning is blunt: the app may appear stuck."], "defs": [["Synchronous", "Runs line by line. Next line waits until previous line ends. Simple but can block the app.", "One thing at a time, in order."], ["Asynchronous", "Starts a task that finishes later. App can continue responding. Needs success and error handling.", "Start it, keep the app alive, handle the answer later."]], "code": [], "deck": [{"n": 3, "title": "Why async matters in Ionic apps", "lines": ["MOBILE CONTEXT", "Mobile apps usually wait for something", "external:", "API / server response", "Login or token validation", "Local storage read/write", "Camera, GPS, Bluetooth, files", "Navigation and page refresh", "Ionic UI", "async task", "result / error", "Without async handling: the app may appear stuck,", "duplicate requests, or hide errors from the user."]}, {"n": 4, "title": "Synchronous vs asynchronous", "lines": ["FOUNDATION", "Synchronous", "Asynchronous", "Runs line by line", "Next line waits until previous line ends", "Simple but can block the app", "Good for quick calculations", "Starts a task that finishes later", "App can continue responding", "Used for server/device operations", "Needs success and error handling", "Rule of thumb: if the task depends on the internet, device hardware, storage, or time delay, treat it as asynchronous."]}, {"n": 5, "title": "Promise: a future result", "lines": ["PROMISES", "A Promise represents an operation that is not finished yet.", "Pending", "waiting...", "Settled", "Fulfilled", "success value", "Rejected", "error reason", "```typescript", "const result = await", "task();", "// success: result has", "data", "// error: catch block", "runs", "```"]}]}, {"title": "Promises and the three states", "slides": [6], "points": ["A Promise is a future result with three states: pending, settled, then either fulfilled with a success value or rejected with an error reason.", "The practical consequence is that every Promise has two exits, and both must be handled. Code that handles only the fulfilled path leaves the UI in an inconsistent state when the request fails."], "defs": [["Promise", "Pending, then settled: fulfilled with a success value, or rejected with an error reason.", "A placeholder for a result that has not arrived yet."]], "code": [{"slide": 6, "lang": "typescript", "code": "async loadProfile() {\n  const profile = await\nthis.userService.getProfile();\n  this.profile = profile;\n}"}], "deck": [{"n": 6, "title": "async / await: cleaner async code", "lines": ["SYNTAX", "Use async before a function. Use await before a Promise.", "```typescript", "async loadProfile() {", "  const profile = await", "this.userService.getProfile();", "  this.profile = profile;", "}", "```", "await pauses only this function,", "not the whole app.", "The app can still respond to taps,", "animations, and UI updates.", "Common beginner mistake: forgetting await and using data before it arrives."]}]}, {"title": "async, await, and the effect on the rest of the app", "slides": [7], "points": ["`async` marks a function that is allowed to use `await`. `await` pauses only that function until the Promise settles.", "The app itself keeps responding: taps still register while the function is waiting. That distinction is the point of the lesson and a likely true-or-false item.", "An `async` function always returns a Promise, even if the body appears to return a plain value."], "defs": [["async", "Marks a function that may use await inside it.", "This function is allowed to wait."], ["await", "Pauses only this function until the Promise settles.", "Wait here, but do not freeze the app."]], "code": [{"slide": 7, "lang": "typescript", "code": "async saveData() {\n  this.isSaving = true;\n  try {\n    await this.api.save(this.form.value);\n    this.message = 'Saved successfully';\n  } catch (error) {\n    this.message = 'Saving failed';\n    console.error(error);\n  } finally {\n    this.isSaving = false;\n  }\n}"}], "deck": [{"n": 7, "title": "Always use try / catch / finally", "lines": ["ERROR HANDLING", "```typescript", "async saveData() {", "  this.isSaving = true;", "  try {", "    await this.api.save(this.form.value);", "    this.message = 'Saved successfully';", "  } catch (error) {", "    this.message = 'Saving failed';", "    console.error(error);", "  } finally {", "    this.isSaving = false;", "  }", "}", "```", "try", "Put the async task that may", "succeed or fail.", "catch", "Handle failed login, network error,", "or invalid response.", "finally", "Cleanup: hide loading, enable", "button, stop refresher.", "finally is important in Ionic because UI", "elements must be dismissed even when an", "error happens."]}]}, {"title": "Error handling: try, catch, finally", "slides": [8], "points": ["`try` holds the async task that may fail, `catch` handles the failure (a failed login, a network error), and `finally` performs cleanup such as hiding the loading indicator and re-enabling the button.", "The deck explains why `finally` matters specifically in Ionic: UI elements must be dismissed even when an error occurs, or the spinner stays on screen forever.", "This is the single most examinable mechanic in the deck. A loading flag cleared after the await instead of in `finally` is a wrong answer, and the reason is that a rejected request skips that line entirely."], "defs": [["try", "Put the async task that may fail here.", "Attempt the risky work."], ["catch", "Handle a failed login, a network error.", "Decide what the user sees when it fails."], ["finally", "Cleanup: hide loading, enable button.", "Runs on both paths, so the UI always recovers."]], "code": [{"slide": 8, "lang": "typescript", "code": "// service\ngetProducts() {\n  return this.http.get<Product[]>('/api/products');\n}\n// component\nproducts$ = this.productService.getProducts();\n// template\n<ion-item *ngFor=\"let item of products$ | async\">\n  {{ item.name }}\n<\/ion-item>"}], "deck": [{"n": 8, "title": "Observable + async pipe in Angular", "lines": ["ANGULAR", "Angular HttpClient usually returns an Observable, not a Promise.", "```typescript", "// service", "getProducts() {", "  return this.http.get<Product[]>('/api/products');", "}", "// component", "products$ = this.productService.getProducts();", "// template", "<ion-item *ngFor=\"let item of products$ | async\">", "  {{ item.name }}", "<\/ion-item>", "```", "The async pipe subscribes, updates the", "template, and unsubscribes", "automatically when the component is", "destroyed.", "This is often cleaner than manual", "subscribe() for displaying API data.", "Use $ suffix by convention for", "Observable variables: products$,", "users$, profile$."]}]}, {"title": "The async pipe and the dollar convention", "slides": [11, 12], "points": ["The async pipe subscribes to an Observable, updates the template, and unsubscribes automatically when the component is destroyed. That removes the memory leak a forgotten manual `unsubscribe()` causes.", "Observable variables take a `$` suffix by convention, as in `products$`. The suffix is a signal to the reader that the value arrives later.", "The worked example makes the ordering clear: no data is forced immediately, Angular subscribes to `products$`, the list updates when data arrives, and cleanup happens on destroy."], "defs": [], "code": [{"slide": 11, "lang": "typescript", "code": "// product.service.ts\n@Injectable({ providedIn: 'root' })\nexport class ProductService {\n  private http = inject(HttpClient);\n  getProducts() {\n    return this.http.get<Product[]>( 'https://api.example.com/products' );\n  }\n}"}, {"slide": 11, "lang": "typescript", "code": "// products.page.ts\n@Component({ ... })\nexport class ProductsPage {\n  private products = inject(ProductService);\n  products$ = this.products.getProducts();\n}"}, {"slide": 12, "lang": "html", "code": "<ion-list>\n  <ion-item *ngFor=\"let product of products$ | async\">\n    <ion-label>\n      <h2>{{ product.name }}<\/h2>\n      <p>{{ product.price | currency }}<\/p>\n    <\/ion-label>\n  <\/ion-item>\n<\/ion-list>"}], "deck": [{"n": 11, "title": "Example 1: loading a product list", "lines": ["EXAMPLE 1", "Goal: display products from an API without manually subscribing in the", "component.", "```typescript", "// product.service.ts", "@Injectable({ providedIn: 'root' })", "export class ProductService {", "  private http = inject(HttpClient);", "  getProducts() {", "    return this.http.get<Product[]>( 'https://api.example.com/products' );", "  }", "}", "```", "```typescript", "// products.page.ts", "@Component({ ... })", "export class ProductsPage {", "  private products = inject(ProductService);", "  products$ = this.products.getProducts();", "}", "```", "Notice: no data is forced immediately. products$", "represents data that will arrive later."]}, {"n": 12, "title": "Example 1: template with async pipe", "lines": ["EXAMPLE 1", "```html", "<ion-list>", "  <ion-item *ngFor=\"let product of products$ | async\">", "    <ion-label>", "      <h2>{{ product.name }}<\/h2>", "      <p>{{ product.price | currency }}<\/p>", "    <\/ion-label>", "  <\/ion-item>", "<\/ion-list>", "```", "What happens?", "Angular subscribes to products$", "When data arrives, the list updates", "When the page is destroyed,", "cleanup happens", "Less manual memory-leak risk", "Best for: displaying data that comes from HttpClient."]}]}, {"title": "Choosing between a Promise and an Observable", "slides": [13], "points": ["A Promise is one future value, used with `async` and `await`, well suited to a login result, a storage read, or a modal dismissal. It cannot easily be cancelled once started.", "An Observable can emit one or many values, is used with the async pipe or RxJS, suits `HttpClient` and streams, and can be unsubscribed or cancelled.", "The comparison is a common identification item in both directions, so it is worth being able to state from either term."], "defs": [["Promise", "One future value. Use with async / await. Good for login result, storage, modal dismiss. Cannot easily cancel after started.", "One answer, no cancelling."], ["Observable", "Can emit one or many values. Use with async pipe or RxJS. Good for HttpClient and streams. Can unsubscribe / cancel.", "A stream of answers, cancellable."]], "code": [{"slide": 13, "lang": "typescript", "code": "async login() {\n  const loading = await this.loadingCtrl.create({\n    message: 'Signing in...'\n  });\n  await loading.present();\n  try {\n    await this.auth.login(this.email, this.password);\n    await this.router.navigateByUrl('/home');\n  } catch (error) {\n    await this.showToast('Invalid login or network error');\n  } finally {\n    await loading.dismiss();\n  }\n}"}], "deck": [{"n": 13, "title": "Example 2: async login flow", "lines": ["EXAMPLE 2", "Goal: tap Login → show loading → wait for server → navigate or show error.", "```typescript", "async login() {", "  const loading = await this.loadingCtrl.create({", "    message: 'Signing in...'", "  });", "  await loading.present();", "  try {", "    await this.auth.login(this.email, this.password);", "    await this.router.navigateByUrl('/home');", "  } catch (error) {", "    await this.showToast('Invalid login or network error');", "  } finally {", "    await loading.dismiss();", "  }", "}", "```", "Why async/await fits here: the action is", "triggered by one button tap and has one", "final result.", "try/catch handles rejected login. finally", "guarantees the loading overlay closes.", "Use await on navigation when the next", "step depends on route success."]}]}, {"title": "The Ionic feedback pattern", "slides": [14, 15, 16, 17], "points": ["The five-step pattern for any button-triggered async action: tap, show loading, await the task, handle the result, dismiss or show a toast.", "The design rule behind it is the line worth quoting: Ionic users should never wonder whether the app received their tap.", "Example 2 is the login button. `async` and `await` fit because the action is triggered by one tap and produces one result; `try` and `catch` handle a rejected login; separate helper functions keep the error-message logic in one place; and `await` is used on navigation when the next page depends on the result.", "Example 3 is the refresher. The important note is that `complete()` belongs in `finally` so the spinner stops even if the API fails, because otherwise the UI gets stuck."], "defs": [], "code": [{"slide": 15, "lang": "typescript", "code": "<ion-refresher slot=\"fixed\" (ionRefresh)=\"refresh($event)\">\n  <ion-refresher-content><\/ion-refresher-content>\n<\/ion-refresher>\nasync refresh(event: RefresherCustomEvent) {\n  try {\n    await this.loadLatestNews();\n  } catch (error) {\n    await this.showToast('Refresh failed');\n  } finally {\n    event.target.complete();\n  }\n}"}, {"slide": 16, "lang": "typescript", "code": "async loadDashboard() {\n  const [profile, notifications, stats] = await Promise.all([ this.userApi.getProfile(), this.notificationApi.getUnread(), this.statsApi.getSummary() ]);\n  this.profile = profile;\n  this.notifications = notifications;\n  this.stats = stats;\n}"}], "deck": [{"n": 14, "title": "Example 2: helper toast function", "lines": ["EXAMPLE 2", "```typescript", "async showToast(message: string) {", "  const toast = await this.toastCtrl.create({", "    message,", "    duration: 2500,", "    position: 'bottom',", "    color: 'danger'", "  });", "  await toast.present();", "}", "```", "Why separate helper", "functions?", "Cleaner login() code", "Reusable for any error message", "Easy to modify in one place", "Easy to test or debug", "Small async helpers make Ionic pages easier to read."]}, {"n": 15, "title": "Example 3: pull-to-refresh", "lines": ["EXAMPLE 3", "Goal: user pulls down the list → reload data → complete the refresher.", "```typescript", "<ion-refresher slot=\"fixed\" (ionRefresh)=\"refresh($event)\">", "  <ion-refresher-content><\/ion-refresher-content>", "<\/ion-refresher>", "async refresh(event: RefresherCustomEvent) {", "  try {", "    await this.loadLatestNews();", "  } catch (error) {", "    await this.showToast('Refresh failed');", "  } finally {", "    event.target.complete();", "  }", "}", "```", "Important: complete() belongs in finally", "so the spinner stops even if the API", "fails.", "This prevents the UI from getting stuck", "in “refreshing” mode."]}, {"n": 16, "title": "When tasks can run together: Promise.all", "lines": ["PARALLEL TASKS", "If tasks are independent, run them in parallel instead of waiting one by one.", "```typescript", "async loadDashboard() {", "  const [profile, notifications, stats] = await Promise.all([ this.userApi.getProfile(), this.notificationApi.getUnread(), this.statsApi.getSummary() ]);", "  this.profile = profile;", "  this.notifications = notifications;", "  this.stats = stats;", "}", "```", "Sequential: waits for task 1, then", "2, then 3.", "Parallel: starts all tasks together,", "waits for all results.", "Use only when tasks do not", "depend on each other."]}, {"n": 17, "title": "Where should async code run?", "lines": ["LIFECYCLE", "Use ngOnInit()", "Use ionViewWillEnter()", "Initial setup for the component", "Start data load once when page is created", "Good for first API call", "Never make constructor async", "Runs before Ionic page becomes active", "Good when data must refresh every visit", "Useful after returning from another page", "Keeps page data current", "Constructor should mainly inject dependencies. Do not put heavy async work there."]}]}, {"title": "Parallel tasks", "slides": [18], "points": ["Sequential execution waits for task one, then starts task two. Parallel execution starts all of them together and waits for the group.", "`Promise.all` is the parallel tool, and it is safe only when the tasks do not depend on each other. Chaining dependent calls in parallel produces races rather than speed."], "defs": [], "code": [], "deck": [{"n": 18, "title": "Common async mistakes in Ionic", "lines": ["COMMON BUGS", "1. Forgetting await", "Code uses the Promise object, not the", "result.", "2. No catch block", "Errors appear only in console or crash the", "flow.", "3. Loading not dismissed", "UI gets stuck because cleanup was not", "placed in finally.", "4. Manual subscribe leaks", "Subscription continues after page leaves.", "5. Duplicate taps", "User taps button repeatedly and sends", "multiple requests.", "6. Async in constructor", "Constructor should not wait for remote", "data.", "Fix habit: await + try/catch/finally + visible UI feedback."]}]}, {"title": "Where async code belongs in a page", "slides": [19], "points": ["`ngOnInit` for initial setup and a data load that should happen once when the page is created. `ionViewWillEnter` when the data must refresh on every visit, including after returning from another page.", "One line is stated as an absolute and is very likely to be examined: never make the constructor async.", "The Ionic lifecycle hook runs before the page becomes active, which is what makes it the right place for a refresh that the user must see immediately."], "defs": [], "code": [{"slide": 19, "lang": "typescript", "code": "async loadData() {\n  console.log('1 start');\n  try {\n    const data = await this.api.getData();\n    console.log('2 data received', data);\n  } catch (error) {\n    console.error('3 failed', error);\n  } finally {\n    console.log('4 cleanup');\n  }\n}"}], "deck": [{"n": 19, "title": "Debugging async functions", "lines": ["DEBUGGING", "Debug async code by checking the order of events.", "```typescript", "async loadData() {", "  console.log('1 start');", "  try {", "    const data = await this.api.getData();", "    console.log('2 data received', data);", "  } catch (error) {", "    console.error('3 failed', error);", "  } finally {", "    console.log('4 cleanup');", "  }", "}", "```", "Checklist", "Open browser DevTools / console", "Inspect Network tab for API status", "Log before and after await", "Log error.message and full error", "Disable button while loading"]}]}, {"title": "The six common bugs and the debugging checklist", "slides": [20, 21], "points": ["The six bugs are a checklist in themselves: forgetting `await`, so the code works with the Promise object instead of its result; no `catch` block, so errors only appear in the console; loading never dismissed, so the UI sticks; manual `subscribe` leaks; duplicate taps sending repeated requests; and async work in the constructor.", "The debugging procedure: open the console, inspect the Network tab for the real API status, log before and after the `await`, log both `error.message` and the full error, and disable the button while loading.", "Disabling the button is not only cosmetic. It is the fix for the duplicate-tap bug."], "defs": [], "code": [{"slide": 20, "lang": "typescript", "code": "async doAction() {\n  this.isLoading = true;\n  try {\n    await this.service.performTask();\n    await this.showToast('Success');\n  } catch (error) {\n    await this.showToast('Something went wrong');\n  } finally {\n    this.isLoading = false;\n  }\n}"}], "deck": [{"n": 20, "title": "Best practices for clean async Ionic code", "lines": ["BEST PRACTICES", "Use this structure for most button-triggered actions:", "```typescript", "async doAction() {", "  this.isLoading = true;", "  try {", "    await this.service.performTask();", "    await this.showToast('Success');", "  } catch (error) {", "    await this.showToast('Something went wrong');", "  } finally {", "    this.isLoading = false;", "  }", "}", "```", "Good habits", "Keep async functions small", "Move API calls to services", "Use async pipe for template data", "Avoid duplicated requests", "Always give user feedback"]}, {"n": 21, "title": "Mini activity: async login button", "lines": ["ACTIVITY", "Task: Create a Login button that waits for a fake server response.", "```typescript", "fakeLogin(): Promise<boolean> {", "  return new Promise(resolve => {", "    setTimeout(() => resolve(true), 1500);", "  });", "}", "async login() {", "  // TODO:", "  // 1. set isLoading = true", "  // 2. await fakeLogin()", "  // 3. show success message", "  // 4. set isLoading = false in finally", "}", "```", "Expected behavior", "Button disables while waiting", "Message appears after 1.5 seconds", "No duplicate login request", "Loading state resets even with error", "This activity can be done without a", "real backend."]}]}, {"title": "Best practices, the activity, and the summary", "slides": [22, 23], "points": ["Five habits: keep async functions small, move API calls into services, use the async pipe for template data, avoid duplicated requests, and always give the user feedback.", "The activity's expected behaviour is a compact acceptance test for everything above: the button disables while waiting, a message appears after about 1.5 seconds, no duplicate login request is sent, and the loading state resets even when the request errors.", "The summary lines are the ones to be able to reproduce: `async function` allows `await`; `await` waits for a Promise result; try/catch/finally map to success, error and cleanup; a Promise is one future result; an Observable is a stream used with an async pipe; and `finally` is where loading and refreshers are stopped."], "defs": [], "code": [], "deck": [{"n": 22, "title": "Quick check", "lines": ["CHECK UNDERSTANDING", "Answer orally or in one sentence.", "1. What does await do inside an async function?", "2. Why should loading.dismiss() be placed in finally?", "3. When is async pipe better than manual subscribe()?", "4. Why should a button be disabled during a request?", "5. What is the main difference between Promise and Observable?", "Teacher tip: ask students to explain using a mobile-app scenario, not only definitions."]}, {"n": 23, "title": "Cheat sheet", "lines": ["SUMMARY", "async function → allows await", "inside", "await → wait for Promise result", "try/catch/finally → success,", "error, cleanup", "Promise → one future result", "Observable → stream / async pipe", "finally → stop loading /", "refresher", "Final rule: when users wait, show feedback; when code may fail, catch", "the error; when UI must reset, use finally."]}]}], "traps": ["`finally` is not optional decoration. Clearing a loading flag anywhere else leaves the spinner stuck after a failure.", "Never make the constructor async, and never `await` inside it.", "Forgetting `await` is silent: the code keeps running with the Promise object instead of the result, and the bug shows up later as undefined data.", "A manual `subscribe()` must be unsubscribed. The async pipe does it automatically, which is why it is preferred in templates.", "`Promise.all` is only for independent tasks."], "exam": "The heaviest lesson after routing for short answers and true-or-false. Identification: Promise states, `await`, `finally`, the async pipe, the `$` suffix, `Promise.all`. Short answer: why `finally` is required, Promise versus Observable, and where async code belongs. Code: writing an async load that sets a flag, awaits a service, catches the failure and clears the flag in `finally`."}, {"id": "L07", "title": "Styling, theming and components", "slides": 22, "purpose": "How to make the app look deliberate rather than default. It gives a four-layer styling model, the three stylesheets and what each is for, the colour-name system and the theme variables that back it, why ordinary CSS selectors cannot reach inside Ionic components, and the component families to reach for.", "ngmodule": "No translation needed for the stylesheets, with two details: `IonicModule` must be imported by each page module for the Ionic components in that page's template to work, and in Ionic 9 it is imported from `@ionic/angular/lazy`, because the root `@ionic/angular` entry point is the standalone API. The theme files are unaffected.", "topics": [{"title": "The four layers, and what each is for", "slides": [2, 3], "points": ["The layers are Ionic components, theme variables, page and component styles, and behaviour. Together they produce the styled app.", "The deck's formula is the examinable line: good UI equals the correct component, plus a consistent theme, plus small custom styles.", "Three stylesheets, three jobs: `src/theme/variables.scss` for global theme values, `src/global.scss` for global helpers, and a page's own `.scss` for page-specific style.", "The design consequence: reach for the right component first, set the theme in one place, and keep page styles small."], "defs": [["src/theme/variables.scss", "Use for global theme values.", "One central settings panel for the whole app."], ["src/global.scss", "Use for global helpers.", "Rules that apply everywhere."], ["page.component.scss", "Use for page-specific style.", "Rules for one screen only."]], "code": [], "deck": [{"n": 2, "title": "Lesson outcomes", "lines": ["By the end, students should know where to style, how to theme, and how to choose Ionic components.", "1. Style Ionic pages", "Use classes, component SCSS, global", "styles, and Ionic CSS variables without", "randomly forcing CSS.", "2. Apply a theme", "Change app colors through variables.scss", "and use Ionic color names like primary,", "secondary, success, warning, and danger.", "3. Build UI with components", "Use Ionic components such as ion-button,", "ion-card, ion-list, ion-grid, ion-chip, and", "ion-badge to create mobile-friendly", "screens.", "Outcome slide"]}, {"n": 3, "title": "The big idea: Ionic UI has layers", "lines": ["When styling an Ionic Angular app, think in layers instead of random CSS fixes.", "Layer 1: Ionic Components", "Ready-made UI blocks like ion-button, ion-card, ion-list, and ion-input.", "Layer 2: Theme Variables", "Global app colors and design tokens stored in src/theme/variables.scss.", "Layer 3: Page / Component Styles", "Local styling for a specific page or reusable component.", "Layer 4: Behavior", "Angular data binding, events, routing, services, and state updates.", "Styled App", "Good UI = correct component + consistent theme +", "small custom styles"]}]}, {"title": "Colour names and theme variables", "slides": [4, 5, 6, 7], "points": ["The template asks for a colour by name, and the theme supplies the actual value. That is why changing one variable re-themes every component that used the name.", "The eight names and their intended semantics are worth memorising: primary for main brand actions, secondary for supporting actions, tertiary for extra emphasis, success for positive status, warning for caution, danger for delete and error, medium for neutral, and light for light UI.", "`Ionic reads variables like `--ion-color-primary` to style many components`. Editing it once in `variables.scss` beats editing colour values page by page, and survives a rebrand.", "The deck's beginner rule is the practical one: use `color=\"...\"` first, and add custom CSS only when Ionic cannot do what is needed.", "Example 1 is the school example in this workspace: a toolbar and button using `color=\"primary\"`, with `--ion-color-primary` set to a single value in `variables.scss`."], "defs": [["primary", "Main brand actions.", "The main colour, used for the important actions."], ["secondary", "Supporting actions.", "The quieter companion colour."], ["tertiary", "Extra emphasis.", "A third accent for highlighting."], ["success", "Positive status.", "Good, done, available."], ["warning", "Caution.", "Careful."], ["danger", "Delete / error.", "Something went wrong, or something destructive."], ["medium", "Neutral.", "Default, unremarkable."], ["light", "Light UI.", "A pale surface colour."]], "code": [{"slide": 5, "lang": "html", "code": "<ion-header>\n  <ion-toolbar color=\"primary\">\n    <ion-title>Dashboard<\/ion-title>\n  <\/ion-toolbar>\n<\/ion-header>\n\n<ion-content class=\"ion-padding\">\n  <ion-card>\n    <ion-card-header>\n      <ion-card-title>Welcome<\/ion-card-title>\n    <\/ion-card-header>\n    <ion-card-content>\n      Build screens using Ionic components.\n    <\/ion-card-content>\n  <\/ion-card>\n<\/ion-content>"}, {"s
