, "key": "navigateRoot", "alts": ["navigateroot", "navigate root"], "why": "`navigate` pushes onto the stack and leaves the tabs behind it. `navigateRoot` sets the root transition direction, and `replaceUrl` drops the entry being left."}, {"lesson": "L04", "code": "Registering a service with `@Injectable({ providedIn: 'root' })` makes it a root singleton and needs no entry in any module's `providers` array.", "key": "TRUE", "alts": ["true", "t"], "why": "It is the tree-shakable form. The alternative is a bare `@Injectable()` plus a `providers: []` entry."}, {"lesson": "L04", "code": "The Angular decorator that marks a service is `@__Service__()` from `@angular/core`.", "key": "Injectable", "alts": ["injectable", "@injectable", "injectable()"], "why": "Angular exports no `Service` decorator. The reference activity in this workspace makes this mistake in two files and will not compile."}, {"lesson": "L04", "code": "A page should load its data in the `__constructor__`, because that is where the injected service arrives.", "key": "ngOnInit", "alts": ["ngoninit", "ng on init"], "why": "The constructor creates the object and stores dependencies. Data loading belongs in `ngOnInit`, which is L04's central distinction."}, {"lesson": "L02", "code": "If the parent route already carries `:id`, the child module's own route path must also be `__:id__`.", "key": "''", "alts": ["''", "\"\"", "empty", "empty string", "(empty)", "'' (empty)"], "why": "The parent consumed the segment, so nothing is left for the child to match. Copying the reference activity's `{ path: ':id' }` under `movies` produces a dead route."}, {"lesson": "L02", "code": "`[(ngModel)]` requires `__CommonModule__` in the declaring module's imports.", "key": "FormsModule", "alts": ["formsmodule", "forms module"], "why": "Without `FormsModule` the template throws `Can't bind to 'ngModel'`. `CommonModule` supplies the structural directives, which is a different job."}, {"lesson": "L05", "code": "When records need behaviour such as a computed field, the data shape must be an `__interface__` rather than a class.", "key": "class", "alts": ["class", "a class", "model class"], "why": "An interface is compile-time only and carries no implementation, so behaviour requires a class (or a method in the consuming service)."}, {"lesson": "L06", "code": "`finally` runs whether the awaited task resolved or rejected, which is why the loading flag is cleared there.", "key": "TRUE", "alts": ["true", "t"], "why": "Clearing the flag only on the success path leaves the spinner stuck after a failure."}, {"lesson": "L06", "code": "In an Angular template, `observable$ | async` subscribes and `__never__` unsubscribes, which is why a manual `subscribe()` is preferred.", "key": "automatically", "alts": ["automatically", "auto", "always"], "why": "The pipe handles the subscription lifetime and unsubscribes when the component is destroyed, which removes the leak a forgotten `unsubscribe()` causes."}, {"lesson": "L07", "code": "Ionic brand colours are changed centrally by editing `src/theme/__global.scss__`.", "key": "variables.scss", "alts": ["variables.scss", "variables", "theme/variables.scss", "src/theme/variables.scss"], "why": "`variables.scss` holds the `--ion-color-*` custom properties. Editing it once re-themes every component that requests a colour by name."}, {"lesson": "L02", "code": "`ion-back-button` uses `defaultHref` when there is no previous page in the stack, for example when the URL is opened directly.", "key": "TRUE", "alts": ["true", "t"], "why": "The button follows Ionic navigation history and falls back to `defaultHref` when that history is empty."}, {"lesson": "L01", "code": "Asset URLs are written relative to the component, so the correct form begins with `__../../assets/__`.", "key": "assets/", "alts": ["assets/", "assets", "assets/...", "root relative"], "why": "Ionic asset URLs are root relative. The reference activity uses `../../assets/movie-posters/iron-man.jpg`, which fails to load."}], "enum": [{"lesson": "L02", "q": "Name the four files that make up a lazily loaded NgModule page.", "count": 4, "answers": ["x.page.ts", "x.page.html", "x-routing.module.ts", "x.module.ts"], "show": "`x.page.ts`, `x.page.html`, `x-routing.module.ts`, `x.module.ts`", "why": "Without the routing module and the page module there is nothing for `loadChildren` to resolve."}, {"lesson": "L02", "q": "Name the four child route paths of the tabs route in this project.", "count": 4, "answers": ["movies", "menu", "search", "account"], "show": "`movies`, `menu`, `search`, `account`, plus the empty path that redirects to `/tabs/movies`", "why": "These are the four tabs. The empty path is a fifth entry but it is a redirect, not a tab."}, {"lesson": "L02", "q": "Name the four modules that `movies.module.ts` (or any page module) imports.", "count": 4, "answers": ["commonmodule", "formsmodule", "ionicmodule", "routing module", "forchild"], "show": "`CommonModule`, `FormsModule`, `IonicModule` (from `@ionic/angular/lazy`), and the page's own routing module", "why": "`CommonModule` supplies `*ngFor` and `*ngIf`, `FormsModule` supplies `ngModel`, `IonicModule` supplies the Ionic components, and the routing module supplies the page's `RouterModule.forChild` configuration."}, {"lesson": "L03", "q": "Name the four hooks, in order, that a routed Ionic page passes through on its first entry.", "count": 4, "answers": ["constructor", "ngoninit", "ionviewwillenter", "ionviewdidenter"], "show": "`constructor()`, `ngOnInit()`, `ionViewWillEnter()`, `ionViewDidEnter()`", "why": "L03 slide 6. The class is constructed, Angular initialises it once, then Ionic's navigation hooks fire in that order."}, {"lesson": "L03", "q": "Name three Ionic navigation hooks other than the entry pair `ionViewWillEnter` and `ionViewDidEnter`.", "count": 3, "answers": ["ionviewwillleave", "ionviewditleave", "ngondestroy"], "show": "`ionViewWillLeave()`, `ionViewDidLeave()`, and `ngOnDestroy()` for final teardown", "why": "`ngOnDestroy` is the Angular hook and runs only when Ionic actually removes the page, which is why leave-time cleanup goes in `ionViewWillLeave`."}, {"lesson": "L04", "q": "Name the two ways to register a service with an Angular injector.", "count": 2, "answers": ["providedin", "providers"], "show": "`@Injectable({ providedIn: 'root' })`, or a bare `@Injectable()` plus an entry in a module's `providers: []` array", "why": "The first is tree-shakable and preferred here; the second scopes the instance to the module or component that provides it."}, {"lesson": "L01", "q": "Name the three decorators used in this project.", "count": 3, "answers": ["@component", "@injectable", "@ngmodule"], "show": "`@Component`, `@Injectable`, `@NgModule`", "why": "`@Component` marks a page class, `@Injectable` marks a service, `@NgModule` declares a module. `@Service` is not one of them."}, {"lesson": "L02", "q": "Name the three route path segments that compose the URL `/tabs/movies/01`.", "count": 3, "answers": ["tabs", "movies", ":id"], "show": "`tabs`, `movies`, `:id`", "why": "`tabs` mounts the shell, `movies` mounts the catalogue inside it, and `:id` captures `01` for the detail page."}, {"lesson": "L07", "q": "Name the three stylesheets that make up this project's styling layer.", "count": 3, "answers": ["variables.scss", "global.scss", "page.scss"], "show": "`src/theme/variables.scss`, `src/global.scss`, and each page's own `x.page.scss`", "why": "`variables.scss` carries the theme tokens, `global.scss` pulls in the Ionic base stylesheets, and each page's stylesheet holds page-scoped rules."}, {"lesson": "L04", "q": "Name the single job a page's `constructor` has in this project.", "count": 1, "answers": ["store dependencies", "dependency injection", "store the injected dependencies", "inject the dependencies"], "show": "It stores the injected dependencies and does nothing else.", "why": "The constructor creates the object. Data loading, parameter reads, timers and navigation all belong after initialisation, in `ngOnInit` or an Ionic hook."}], "code": [{"lesson": "L02", "title": "The application routing module", "ask": "Write `app-routing.module.ts` in full: an empty-path redirect to login, the login module, the tabs module, and the `@NgModule` that wires it all with preloading.", "model": "import { NgModule } from '@angular/core';\nimport { PreloadAllModules, RouterModule, Routes } from '@angular/router';\n\nconst routes: Routes = [\n  { path: '', redirectTo: 'login', pathMatch: 'full' },\n  {\n    path: 'login',\n    loadChildren: () => import('./login/login.module').then(m => m.LoginPageModule),\n  },\n  {\n    path: 'tabs',\n    loadChildren: () => import('./tabs/tabs.module').then(m => m.TabsPageModule),\n  },\n];\n\n@NgModule({\n  imports: [RouterModule.forRoot(routes, { preloadingStrategy: PreloadAllModules })],\n  exports: [RouterModule],\n})\nexport class AppRoutingModule {}", "watch": ["`forRoot` appears here and nowhere else.", "The empty-path redirect needs `pathMatch: 'full'` or it matches every URL.", "The exports array is required, since `app.module.ts` imports this module to obtain the directive."]}, {"lesson": "L02", "title": "The tabs routing module", "ask": "Write `tabs-routing.module.ts` in full: the `TabsPage` component, the four tab children, and the empty-path redirect to `/tabs/movies`.", "model": "import { NgModule } from '@angular/core';\nimport { Routes, RouterModule } from '@angular/router';\n\nimport { TabsPage } from './tabs.page';\n\nconst routes: Routes = [\n  {\n    path: '',\n    component: TabsPage,\n    children: [\n      {\n        path: 'movies',\n        loadChildren: () => import('../movies/movies.module').then(m => m.MoviesPageModule),\n      },\n      {\n        path: 'menu',\n        loadChildren: () => import('../menu/menu.module').then(m => m.MenuPageModule),\n      },\n      {\n        path: 'search',\n        loadChildren: () => import('../search/search.module').then(m => m.SearchPageModule),\n      },\n      {\n        path: 'account',\n        loadChildren: () => import('../account/account.module').then(m => m.AccountPageModule),\n      },\n      { path: '', redirectTo: '/tabs/movies', pathMatch: 'full' },\n    ],\n  },\n];\n\n@NgModule({\n  imports: [RouterModule.forChild(routes)],\n  exports: [RouterModule],\n})\nexport class TabsPageRoutingModule {}", "watch": ["`children:` is the whole nesting mechanism.", "Child paths are relative: `movies`, not `/tabs/movies`.", "The empty child path must come last and keep `pathMatch: 'full'`."]}, {"lesson": "L02", "title": "A catalogue routing module", "ask": "Write `movies-routing.module.ts` so that the list sits at the tab root and the detail nests under it as `:id`.", "model": "import { NgModule } from '@angular/core';\nimport { Routes, RouterModule } from '@angular/router';\n\nimport { MoviesPage } from './movies.page';\n\nconst routes: Routes = [\n  { path: '', component: MoviesPage },\n  {\n    path: ':id',\n    loadChildren: () =>\n      import('../movie-detail/movie-detail.module').then(m => m.MovieDetailPageModule),\n  },\n];\n\n@NgModule({\n  imports: [RouterModule.forChild(routes)],\n  exports: [RouterModule],\n})\nexport class MoviesPageRoutingModule {}", "watch": ["This is the pair of entries that produces `/tabs/movies/01`.", "Order matters: the empty path first, then `:id`.", "The detail target is a module, not a page class."]}, {"lesson": "L02", "title": "The detail routing module, and why it is empty", "ask": "Write `movie-detail-routing.module.ts`, then state in one sentence why its path is `''` rather than `':id'`.", "model": "import { NgModule } from '@angular/core';\nimport { Routes, RouterModule } from '@angular/router';\n\nimport { MovieDetailPage } from './movie-detail.page';\n\nconst routes: Routes = [\n  { path: '', component: MovieDetailPage },\n];\n\n@NgModule({\n  imports: [RouterModule.forChild(routes)],\n  exports: [RouterModule],\n})\nexport class MovieDetailPageRoutingModule {}\n\n// Why '': the parent route in movies-routing.module.ts already consumed the\n// /movies/:id URL segment, so nothing remains for this module to match.", "watch": ["The `:id` belongs to the parent. Declaring it again here makes the route unreachable.", "This is the exact point where copying the reference activity produces a dead route."]}, {"lesson": "L04", "title": "A catalogue page class", "ask": "Write the `MoviesPage` class: two injected dependencies, an empty typed array, `ngOnInit` loading the list from the service, and a method that opens a detail route by id.", "model": "import { Component, OnInit } from '@angular/core';\nimport { Router } from '@angular/router';\nimport { Movie } from '../models/movie';\nimport { MovieService } from '../services/movie.service';\n\n@Component({\n  selector: 'app-movies',\n  templateUrl: './movies.page.html',\n  styleUrls: ['./movies.page.scss'],\n  standalone: false,\n})\nexport class MoviesPage implements OnInit {\n  movies: Movie[] = [];\n\n  constructor(private movieService: MovieService, private router: Router) {}\n\n  ngOnInit(): void {\n    this.movies = this.movieService.getMovies();\n  }\n\n  openMovie(id: number): void {\n    this.router.navigate(['/tabs/movies', id]);\n  }\n}", "watch": ["`standalone: false` is required on Angular 19 and later, since these pages are declared in modules.", "The constructor only stores dependencies.", "`navigate` takes an array so the id is substituted into `:id`. A concatenated string also works but only for literal paths."]}, {"lesson": "L03", "title": "The detail page class", "ask": "Write the `MovieDetailPage` class: read the route parameter in the correct hook, convert it, look the record up, and tolerate a miss.", "model": "import { Component, OnInit } from '@angular/core';\nimport { ActivatedRoute } from '@angular/router';\nimport { Movie } from '../models/movie';\nimport { MovieService } from '../services/movie.service';\n\n@Component({\n  selector: 'app-movie-detail',\n  templateUrl: './movie-detail.page.html',\n  styleUrls: ['./movie-detail.page.scss'],\n  standalone: false,\n})\nexport class MovieDetailPage implements OnInit {\n  movie?: Movie;\n\n  constructor(private route: ActivatedRoute, private movieService: MovieService) {}\n\n  ngOnInit(): void {\n    const id = Number(this.route.snapshot.paramMap.get('id'));\n    this.movie = this.movieService.getMovieById(id);\n  }\n}", "watch": ["The parameter is read in `ngOnInit`, not the constructor.", "`Number(...)` is required because URL segments arrive as strings.", "The optional field plus the template's `*ngIf` is what guards an unmatched id."]}, {"lesson": "L02", "title": "The detail page header", "ask": "Write the detail page's toolbar: an Ionic back button in the start slot with a fallback destination, and the movie title. Then write the content block's guard.", "model": "<ion-header [translucent]=\"true\">\n  <ion-toolbar color=\"primary\">\n    <ion-buttons slot=\"start\">\n      <ion-back-button defaultHref=\"/tabs/movies\"><\/ion-back-button>\n    <\/ion-buttons>\n    <ion-title>{{ movie?.title }}<\/ion-title>\n  <\/ion-toolbar>\n<\/ion-header>\n\n<ion-content class=\"ion-padding\" *ngIf=\"movie\">\n  <img [src]=\"movie.posterUrl\" [alt]=\"movie.title\" class=\"detail-poster\" />\n  <h1>{{ movie.title }}<\/h1>\n  <p>{{ movie.genre }}<\/p>\n  <p>{{ movie.synopsis }}<\/p>\n<\/ion-content>", "watch": ["`defaultHref` is used when the stack is empty, which is the case on a direct URL entry.", "`movie?.title` in the toolbar, because the record is not yet loaded on the first render pass.", "`*ngIf=\"movie\"` on the content, so the inner bindings never read a property of undefined."]}, {"lesson": "L04", "title": "A data service", "ask": "Write `MovieService`: registered on the root injector, an in-memory array of two records, a method returning the array, and a by-id lookup whose return type admits a miss.", "model": "import { Injectable } from '@angular/core';\nimport { Movie } from '../models/movie';\n\n@Injectable({ providedIn: 'root' })\nexport class MovieService {\n  private movies: Movie[] = [\n    {\n      id: 1,\n      title: 'Iron Man',\n      posterUrl: 'assets/movie-posters/iron-man.jpg',\n      genre: 'Action',\n      synopsis: 'A billionaire weapons engineer builds a suit of armour and becomes a hero.',\n      gallery: ['assets/movie-posters/iron-man-1.jpg'],\n    },\n    {\n      id: 2,\n      title: 'Real Steel',\n      posterUrl: 'assets/movie-posters/real-steel.jpg',\n      genre: 'Action',\n      synopsis: 'A father and his son train a scrap robot to fight in the boxing circuit.',\n      gallery: ['assets/movie-posters/real-steel-1.jpg'],\n    },\n  ];\n\n  getMovies(): Movie[] {\n    return this.movies;\n  }\n\n  getMovieById(id: number): Movie | undefined {\n    return this.movies.find((movie) => movie.id === id);\n  }\n}", "watch": ["`@Injectable`, not `@Service`, and `providedIn: 'root'` rather than a `providers` entry.", "The array is `private`, so pages must go through the methods.", "`Movie | undefined` is not optional. `find` can miss, and the type must say so or the compiler will not let the template guard it.", "Asset URLs are root relative."]}, {"lesson": "L03", "title": "A page module", "ask": "Write `login.module.ts` in full.", "model": "import { NgModule } from '@angular/core';\nimport { CommonModule } from '@angular/common';\nimport { FormsModule } from '@angular/forms';\n\nimport { IonicModule } from '@ionic/angular/lazy';\n\nimport { LoginPageRoutingModule } from './login-routing.module';\nimport { LoginPage } from './login.page';\n\n@NgModule({\n  imports: [CommonModule, FormsModule, IonicModule, LoginPageRoutingModule],\n  declarations: [LoginPage],\n})\nexport class LoginPageModule {}", "watch": ["The page is declared, never just imported.", "`FormsModule` is what makes `[(ngModel)]` legal in the template.", "`IonicModule` here, without `forRoot`, since the root call happened once in `app.module.ts`.", "The class name ends in `Module` and is what `loadChildren` resolves."]}, {"lesson": "L02", "title": "The exit method", "ask": "Write the account page's `exit()` method, including the injections it needs, and state in one sentence why it does not use plain `navigate`.", "model": "// injections\nconstructor(\n  private accountService: AccountService,\n  private auth: AuthService,\n  private navCtrl: NavController\n) {}\n\nexit(): void {\n  this.auth.logout();\n  this.navCtrl.navigateRoot('/login', { replaceUrl: true });\n}\n\n// Why navigateRoot plus replaceUrl: navigateRoot sets the transition to a root\n// move rather than a forward push, and replaceUrl replaces the entry being left,\n// so Back cannot return to the tabs once the session has been cleared.", "watch": ["The session is cleared before navigating, not after.", "`NavController` comes from `@ionic/angular/lazy` and is injected like any other dependency.", "This is the one place in the project where stack behaviour, not just destination, is the point."]}, {"lesson": "L06", "title": "An async load that always restores the UI (difficult)", "ask": "Write an async method that sets a loading flag, awaits a service call into the catalogue, files an error message on failure, and clears the flag on both paths. Then say why the flag cannot be cleared after the await alone.", "model": "isLoading = false;\nmenuItems: MenuItem[] = [];\nerrorMessage = '';\n\nconstructor(private menuService: MenuService) {}\n\nngOnInit(): void {\n  this.loadMenu();\n}\n\nasync loadMenu(): Promise<void> {\n  this.isLoading = true;\n  this.errorMessage = '';\n  try {\n    this.menuItems = await this.menuService.fetchItems();\n  } catch (error) {\n    this.errorMessage = 'Could not load the menu.';\n    console.error(error);\n  } finally {\n    this.isLoading = false;\n  }\n}\n\n// Clearing the flag after the await alone skips the failure path: a rejected\n// request jumps straight to the caller's catch, so the spinner would stay up\n// forever. finally is the only block that runs on both paths.", "watch": ["`finally` is the item being tested. Omitting it is the classic failure.", "The error message is reset before the attempt, so a previous failure does not linger after a success.", "A page that needs this on every visit calls it from `ionViewWillEnter` instead of `ngOnInit`, because Ionic caches pages."]}, {"lesson": "L07", "title": "The tab bar plus the redirect child (difficult)", "ask": "Write `tabs.page.html` with four tab buttons, and separately write the last child route of `tabs-routing.module.ts`. Then state what `pathMatch: 'full'` prevents.", "model": "<ion-tabs>\n  <ion-tab-bar slot=\"bottom\">\n    <ion-tab-button tab=\"movies\" href=\"/tabs/movies\">\n      <ion-icon name=\"film-outline\"><\/ion-icon>\n      <ion-label>Movies<\/ion-label>\n    <\/ion-tab-button>\n\n    <ion-tab-button tab=\"menu\" href=\"/tabs/menu\">\n      <ion-icon name=\"restaurant-outline\"><\/ion-icon>\n      <ion-label>Menu<\/ion-label>\n    <\/ion-tab-button>\n\n    <ion-tab-button tab=\"search\" href=\"/tabs/search\">\n      <ion-icon name=\"search-outline\"><\/ion-icon>\n      <ion-label>Search<\/ion-label>\n    <\/ion-tab-button>\n\n    <ion-tab-button tab=\"account\" href=\"/tabs/account\">\n      <ion-icon name=\"person-outline\"><\/ion-icon>\n      <ion-label>Account<\/ion-label>\n    <\/ion-tab-button>\n  <\/ion-tab-bar>\n<\/ion-tabs>\n\n<!-- last child of the tabs route -->\n{ path: '', redirectTo: '/tabs/movies', pathMatch: 'full' }\n\n// pathMatch: 'full' prevents an empty path from matching every URL. With the\n// default prefix matching, '' matches any path, so the redirect would swallow\n// every tab and navigation could never leave it.", "watch": ["Every button needs both `tab` and `href`; `tab` is how Ionic matches the button to the active child route.", "`slot=\"bottom\"` is what places the bar at the bottom of the viewport.", "The redirect child carries `pathMatch: 'full'` and is the last entry."]}], "parts": [["I", "Identification", 84, "Name the term described. This is the format the previous written quiz used, so it carries the most weight."], ["II", "Multiple choice", 30, "One answer per item. Keyed in section 7."], ["III", "Modified true or false", 20, "One word is underlined in each statement. If the statement stands as written, write TRUE. Otherwise write the word that replaces the underlined word."], ["IV", "Enumeration", 10, "List the items asked for. Order does not matter."], ["V", "Short answers", 7, "Answer in two to five sentences, in your own words."], ["VI", "Handwritten code", 12, "Write the code by hand. Model answers and watch-for notes are in section 7."]], "overview": ["L01", "L01.2"], "written_total": 163, "review": {"meta": {"title": "Applications Development: Ionic + Angular. Midterm reviewer", "subtitle": "Conventional lesson-by-lesson reviewer, NgModule form", "blurb": ["This is the readable study document for the Applications Development midterm. It is organised the way a reviewer normally is: lesson by lesson, definitions first, code underneath, traps collected at the end of each lesson. The drill and the written exam live in the companion artefacts (`AppDev_midterm_reviewer_v1.html` and `.md`); this file is the one to read when the goal is to understand a lesson rather than to reproduce a file.", "Every listing in this document is either quoted from a lesson deck or taken from the canonical project in `reviewer/midterm/app-code/`. Where a deck teaches the standalone API and the class requires NgModule, the lesson note says so and the NgModule form is given.", "Deck material is reproduced mechanically from the converted Markdown in `md/` by `build_conventional.py`, so it cannot silently drift from the source decks. The authored sections are the purpose paragraphs, the study points, the plain meanings, the traps and the exam focus. Definitions whose wording is the deck's own are marked as quoted."], "how_to_use": ["**Read section 1 first.** It records what is actually known about the exam format, which is less than you would like, and it changes how the rest should be used.", "**Then work the lessons in order.** L01 and L02 carry most of the examinable vocabulary; L03, L04 and L06 carry the behaviour questions; L05 and L07 are lighter.", "**Then use section 4 to connect the lessons to the application you must build.** The lessons teach the parts; section 4 is the assembly.", "**Use section 6 as a vocabulary drill.** It is the identification bank in full, grouped by lesson, with the small-print items flagged and repeated as a recall self-test."]}, "intel": [["What is known", ["The midterm is **written** as well as coded. The coded part is the multi-page application (login, tabs, two catalogues with nested detail routes, a defunct search page, an exit button).", "The previous written quiz in this course was **identification only**. It carried no multiple choice at all. That is the single hard datum available about the written format.", "A large share of those identification items came from the **first two decks**, and specifically from their **small print**: a date on a timeline, an era name, a count, a tool name in a screenshot caption. The material is thin and the wording is minimal. The professor lifts the smallest text on the slide into the question, so the failure mode is not comprehension but recall: the answer sits at the back of your mind and does not arrive under pressure.", "The countermeasure is a fast recall loop over exactly those items, not more reading. The companion HTML reviewer has a one-button filter for them, and section 6.9 of this document lists all of them as a cover-the-column self-test. There are 30, and they are the cheapest marks in the paper."]], ["What is not known", ["The item count, the weighting, and whether the written part has more than one section. Nothing has been published for this course.", "Whether the written part will again be identification only. If it is, everything in Part I of the companion reviewer is directly examinable and the other written formats are irrelevant.", "Whether the code half is written on paper, typed on a lab machine, or submitted as a repository. The drill trains the most demanding case (reproduce from a blank project, by memory), which covers the others."]], ["What follows from that", ["Identification is treated as the highest-priority format in this reviewer. The bank is built out to every testable term in all eight decks, and the small-print material from the first two decks is covered rather than dismissed, because it is the professor's demonstrated source.", "Small-print items are the buried one-line details the professor has a habit of lifting into questions: a date, an era name, a count, a tool name taken from a caption. They are marked `small print` in the companion reviewer and `*(small print)*` here. The content is light, and the failure is recall rather than understanding: the answer sits at the back of your mind and will not arrive under pressure. Section 6.9 turns all 30 of them into a cover-the-column self-test.", "Do not let the small print set your revision order. The code half is the part you cannot bluff, and it is the part the drill covers."]], ["Revision order that follows", ["1. Rebuild the canonical project from a blank Ionic project, by memory, until the drill reports every file (55) at 92 per cent or better.", "2. Drill the identification bank to 100 per cent, including the small-print items.", "3. Work the written Part VI code exercises by hand, in pen, with the compiler taken away.", "4. Skim Part III modified true-or-false as a rapid check on the NgModule-versus-standalone traps, which is where the marks are actually at risk."]]], "foundations": {"intro": ["All eight decks teach the **standalone** API. The class requires **NgModule**. Every difference between the two is listed below, and the rest of this document is written in NgModule form.", "The distinction is not cosmetic. Code copied from a deck will not compile as written in this class's convention, and Ionic's own documentation defaults to the standalone form."], "table": [["Concept", "Deck form (standalone)", "Required form (NgModule)"], ["Route declaration", "`app.routes.ts` exporting a `Routes` array", "`app-routing.module.ts` holding `RouterModule.forRoot(routes)` inside `@NgModule`"], ["Root registration", "`provideRouter(routes)` in `app.config.ts`", "`RouterModule.forRoot(routes)` imported once by `AppModule`"], ["Lazy loading", "`loadComponent: () => import('./x/x.page').then(m => m.XPage)`", "`loadChildren: () => import('./x/x.module').then(m => m.XPageModule)`"], ["Page packaging", "one component file per page", "`x.page.ts`, `x.page.html`, `x.page.scss`, `x-routing.module.ts` and `x.module.ts`"], ["Page routes", "listed in the one top-level array", "`RouterModule.forChild(routes)` in each page's own `x-routing.module.ts`"], ["Tab children", "`children: []` inside the top-level array", "`children: []` inside `tabs-routing.module.ts`"], ["Component declaration", "`standalone: true` (the default on Angular 19+)", "`standalone: false`, declared in a module's `declarations`"], ["Bootstrap", "`bootstrapApplication(AppComponent, appConfig)`", "`@NgModule({ bootstrap: [AppComponent] })` in `app.module.ts`"], ["Guard", "`export const authGuard: CanActivateFn = () => {...}` with `inject()`", "an `@Injectable({ providedIn: 'root' })` class implementing `CanActivate`"]], "vocab_note": ["Two vocabularies are used in the same sentence throughout the decks, and the exam is written by the people who use them. Keep them separate:", "**Angular** owns routing, components, services, dependency injection, lifecycle hooks and TypeScript. **Ionic** owns the page shell, the navigation stack, the mobile lifecycle hooks, and the UI components prefixed `ion-`."]}, "lessons": [{"id": "L01", "title": "Introduction to the Ionic framework", "slides": 16, "purpose": "Frames the whole course: where mobile app development came from, the four ways an app can be built, what Ionic-Angular is assembled from, and the toolchain that has to exist before the first project. It contains almost no code, and it is the deck the previous written quiz drew from most heavily.", "ngmodule": null, "topics": [{"title": "Why cross-platform frameworks exist, and the timeline", "slides": [6, 7, 8], "points": ["The problem was not only coding. Maintaining separate iOS and Android codebases duplicated the work, doubled the testing, and doubled the distribution effort.", "The deck dates the industry in five phases: 2007 (smartphone era, touchscreen phones made apps a daily computing interface), 2008 (app stores, the App Store launched with 500 apps and the Android Market was announced), 2009 to 2012 (hybrid apps, PhoneGap/Cordova put HTML, CSS and JS inside a native wrapper), 2015+ (PWA and cross-platform, offline-ready web apps and one-codebase frameworks matured), 2019+ (Ionic evolves, Ionic 4 moved from Angular-only to Web Components).", "The four approaches are a decision table, not a ranking. Native gives the best access to platform APIs at the cost of separate codebases. Web/PWA is easiest to distribute and has the weakest native store integration. Hybrid packages a web app in a native container so it can be deployed to app stores. Ionic-Angular is the hybrid one with Angular for structure and Capacitor as the native runtime.", "The deck's own summary of the trade-off is the examinable line: faster development and shared code **versus** careful performance, plugin and platform testing."], "defs": [["Native", "Best access to platform APIs; separate platform codebases.", "Two apps, two languages, best device access."], ["Web / PWA", "Runs in browser; easiest distribution; limited native store integration.", "One codebase, no app store, weakest device access."], ["Hybrid", "Web app inside native container; app-store deployable.", "A website wearing a native shell so stores will accept it."], ["Ionic-Angular", "Hybrid/web-native style: Angular + Ionic UI + Capacitor native runtime.", "The stack this course uses."]], "code": [], "deck": [{"n": 6, "title": "A short history of mobile app development", "lines": ["From platform-specific apps to web-native mobile applications", "2007", "SMARTPHONE", "ERA", "Touchscreen phones", "made apps a daily", "computing interface.", "2008", "APP STORES", "Apple App Store", "launched with 500", "apps; Android Market", "was announced the", "same year.", "2009–2012", "HYBRID APPS", "PhoneGap/Cordova", "popularized HTML,", "CSS, and JS inside a", "native wrapper.", "15+", "2015+", "PWA & CROSS-", "PLATFORM", "Offline-ready web apps", "and one-codebase", "mobile frameworks", "matured.", "19+", "2019+", "IONIC EVOLVES", "Ionic 4 shifted from", "Angular-only to Web", "Components and", "broader framework", "support."]}, {"n": 7, "title": "Why mobile frameworks emerged", "lines": ["The problem was not only coding — it was duplication, testing, and distribution", "Before cross-platform tooling, teams often maintained", "separate iOS and Android codebases.", "iOS", "Swift / Objective-C • Apple SDK", "Android", "Kotlin / Java • Android SDK", "Framework Goal", "Reuse one web-based codebase,", "keep mobile-style UI, and access", "native device features when needed.", "Typical trade-off: FASTER DEVELOPMENT and SHARED CODE versus careful", "performance, plugin, and platform testing."]}, {"n": 8, "title": "Mobile app development approaches", "lines": ["Choose the approach based on UX needs, team skills, cost, and platform requirements", "Native", "Best access to platform APIs;", "separate platform codebases.", "Web / PWA", "Runs in browser; easiest", "distribution; limited native", "store integration.", "Hybrid", "Web app inside native", "container; app-store", "deployable.", "Ionic-Angular", "Hybrid/web-native style:", "Angular + Ionic UI + Capacitor", "native runtime.", "Ionic-Angular is not “just a website.” It is a web app packaged with a native runtime and mobile-", "optimized UI patterns."]}]}, {"title": "What Ionic-Angular is assembled from", "slides": [9, 10], "points": ["Three parts, each with a distinct job. Ionic supplies the mobile UI. Angular supplies the application architecture. Capacitor supplies the bridge to the device.", "The runtime is a four-layer stack: your Angular app (pages, services, routes), the Ionic UI layer (mobile components and gestures), Capacitor (native runtime and plugins), and the native SDKs underneath (iOS and Android features).", "The consequence worth stating plainly: the same web project is developed in a browser and then packaged and tested as a native app. Nothing in the Angular layer changes between those two."], "defs": [["Ionic UI components", "mobile-friendly controls, navigation, gestures, and animations", "The buttons, lists and page shell that look native."], ["Angular", "component architecture, routing, dependency injection, and TypeScript tooling", "The framework that structures the app."], ["Capacitor", "native runtime and plugin layer for iOS, Android, and web deployment", "The bridge that lets web code call device features."]], "code": [], "deck": [{"n": 9, "title": "What is Ionic-Angular?", "lines": ["A practical stack for building mobile-ready apps with web skills", "Ionic-Angular combines:", "Ionic UI components: mobile-friendly", "controls, navigation, gestures, and", "animations.", "Angular: component architecture, routing,", "dependency injection, and TypeScript", "tooling.", "Capacitor: native runtime and plugin layer", "for iOS, Android, and web deployment."]}, {"n": 10, "title": "How an Ionic-Angular app runs", "lines": ["Web code is the main app; Capacitor is the bridge to native capability", "Angular App", "Pages, services,", "routes", "Ionic UI", "Mobile", "components &", "gestures", "Capacitor", "Native runtime &", "plugins", "Native SDKs", "iOS / Android", "features", "Result: one web-first project can be developed in the browser, then", "packaged and tested as native mobile apps."]}]}, {"title": "Core building blocks", "slides": [11], "points": ["Five blocks, and they map directly onto the eight lessons: components (L07), pages and routing (L02), services (L04), plugins (L01, and the device side generally), and theming (L07).", "Plugins are Capacitor APIs exposed to JavaScript. The deck names Camera, Filesystem, Geolocation and Storage. They are only reachable inside a native or Capacitor-served build, not on a plain browser preview."], "defs": [["Components", "ion-button, ion-card, ion-list, ion-tabs. Reusable UI elements that follow mobile interaction patterns.", "Prebuilt mobile UI pieces."], ["Pages and routing", "Angular Router plus Ionic navigation. Each screen is commonly represented by a page component.", "One component per screen, connected by routes."], ["Services", "TypeScript classes plus dependency injection. Business logic, API calls, storage, and reusable functions.", "Where the logic lives instead of the page."], ["Plugins", "Camera, Filesystem, Geolocation, Storage. Capacitor APIs expose device features from JavaScript.", "Device hardware reached from web code."], ["Theming", "CSS variables plus platform styling. Customize color, typography, spacing, and platform feel.", "One central place to change the look."]], "code": [], "deck": [{"n": 11, "title": "Core Building Blocks", "lines": ["The parts you will see frequently in code", "Components", "ion-button, ion-card, ion-list, ion-tabs", "Reusable UI elements that follow mobile interaction", "patterns.", "Pages & routing", "Angular Router + Ionic navigation", "Each screen is commonly represented by a page component.", "Services", "TypeScript classes + dependency", "injection", "Business logic, API calls, storage, and reusable", "functions.", "Plugins", "Camera, Filesystem, Geolocation,", "Storage", "Capacitor APIs expose device features from", "JavaScript.", "Theming", "CSS variables + platform styling", "Customize color, typography, spacing, and platform feel."]}]}, {"title": "Toolchain, CLI workflow and project structure", "slides": [12, 13, 14], "points": ["Five tools before the first project: Node.js LTS with npm (runs the tooling and installs packages), the Ionic CLI (scaffolds projects and runs commands), Git plus an editor, Android Studio with a JDK (SDK, emulator and native builds), and Xcode on macOS (required to build and sign iOS apps).", "The verification commands come before any project is created: `node -v`, `npm -v`, `ionic -v`, `git --version`.", "The install workflow is five steps: install the CLI, create the app, run it locally, add a native platform, then build and sync.", "The project layout is worth memorising because the reviewer's canonical project follows it: `src/app/` for pages, services and routes, `src/theme/` for theme variables, `src/assets/` for images and static files, plus `capacitor.config.ts`, `package.json` and the generated `android/` or `ios/` folder.", "The deck's closing habit is the one this course grades: keep business logic in services and keep pages focused on UI and user interaction."], "defs": [], "code": [{"slide": 12, "lang": "bash", "code": "node -v\nnpm -v\nionic -v\ngit --version"}, {"slide": 13, "lang": "bash", "code": "npm install -g @ionic/cli"}, {"slide": 13, "lang": "bash", "code": "ionic start myApp tabs --\n      type=angular"}, {"slide": 13, "lang": "bash", "code": "cd myApp && ionic serve"}, {"slide": 13, "lang": "bash", "code": "ionic capacitor add android"}, {"slide": 13, "lang": "bash", "code": "ionic build && ionic capacitor\n            sync"}, {"slide": 13, "lang": "bash", "code": "# Create and run an Ionic-Angular starter\nnpm install -g @ionic/cli\nionic start myApp tabs --type=angular\ncd myApp\nionic serve"}, {"slide": 13, "lang": "bash", "code": "# Prepare Android build\nionic build\nionic capacitor add android\nionic capacitor sync android\nionic capacitor open android"}, {"slide": 14, "lang": "bash", "code": "myApp/\n├─ src/app/          Angular pages, services, routes\n├─ src/theme/        Ionic theme variables\n├─ src/assets/       Images and static files\n├─ capacitor.config.ts\n├─ package.json\n└─ android/ or ios/  Native projects after adding platform"}, {"slide": 14, "lang": "bash", "code": "ionic serve"}, {"slide": 14, "lang": "bash", "code": "ionic generate page pages/login"}, {"slide": 14, "lang": "bash", "code": "ionic build"}, {"slide": 14, "lang": "bash", "code": "ionic cap sync"}, {"slide": 14, "lang": "bash", "code": "ionic cap open android"}], "deck": [{"n": 12, "title": "Development environment setup", "lines": ["Tools required before creating the first Ionic-Angular app", "Node.js LTS + npm", "Runs Angular/Ionic tooling and installs packages.", "Ionic CLI", "Scaffolds projects and runs Ionic commands.", "Git + code editor", "Version control and development workflow.", "Android Studio + JDK", "Android SDK, emulator, and native build tooling.", "Xcode on macOS", "Required for building and signing iOS apps.", "Recommended verification commands", "```bash", "node -v", "npm -v", "ionic -v", "git --version", "```", "Tip: start with browser testing before", "native builds."]}, {"n": 13, "title": "Installation workflow", "lines": ["The shortest path from zero project to running starter app", "Install CLI", "```bash", "npm install -g @ionic/cli", "```", "Create app", "```bash", "ionic start myApp tabs --", "      type=angular", "```", "Run locally", "```bash", "cd myApp && ionic serve", "```", "Add native platform", "```bash", "ionic capacitor add android", "```", "Build & sync", "```bash", "ionic build && ionic capacitor", "            sync", "```", "```bash", "# Create and run an Ionic-Angular starter", "npm install -g @ionic/cli", "ionic start myApp tabs --type=angular", "cd myApp", "ionic serve", "```", "```bash", "# Prepare Android build", "ionic build", "ionic capacitor add android", "ionic capacitor sync android", "ionic capacitor open android", "```"]}, {"n": 14, "title": "Project Structure & Useful Commands", "lines": ["Know where files live and how the CLI supports your workflow", "```bash", "myApp/", "├─ src/app/          Angular pages, services, routes", "├─ src/theme/        Ionic theme variables", "├─ src/assets/       Images and static files", "├─ capacitor.config.ts", "├─ package.json", "└─ android/ or ios/  Native projects after adding platform", "```", "```bash", "ionic serve", "```", "Run in browser with live reload", "```bash", "ionic generate page pages/login", "```", "Create a page", "```bash", "ionic build", "```", "Compile production web assets", "```bash", "ionic cap sync", "```", "Copy web build to native platform", "```bash", "ionic cap open android", "```", "Open Android Studio project", "Good habit: keep business logic in services and keep pages", "focused on UI and user interaction."]}]}, {"title": "Setup failures and the testing ladder", "slides": [15, 16], "points": ["The deck lists five failure classes with their causes: command not found (PATH, or the terminal needs reopening after an install), build fails (Node version, and only then delete `node_modules` and reinstall), Android errors (missing SDK packages, unaccepted licences, no device detected), iOS build issues (needs macOS, Xcode, a correct bundle identifier, a signing team, provisioning profiles), and a native plugin not working (install the plugin, run `ionic cap sync`, then test on real hardware when the hardware is required).", "The recommended order of testing environments, from cheapest to final, is the examinable line: browser, responsive preview, emulator, real device, signed release build."], "defs": [], "code": [], "deck": [{"n": 15, "title": "Simple Classroom Demo Flow", "lines": ["A practical activity to confirm the environment is working", "Create", "Start tabs or", "blank template", "Modify", "Add an ion-", "button and", "page text", "Run", "Test with ionic", "serve", "Build", "Run ionic", "build", "Native", "Sync and", "open Android", "Studio", "DEMO OBJECTIVE:", "Prove that the web development server works first, then", "prove that native project generation works second."]}, {"n": 16, "title": "Common Setup Issues & Best Practices", "lines": ["Most beginner problems come from mismatched tools or skipping build/sync steps", "Command not found", "Close/reopen terminal, verify PATH, reinstall Node/Ionic CLI if", "needed.", "Build fails", "Check Node version, delete node_modules only when necessary,", "then npm install.", "Android errors", "Install SDK packages, accept licenses, confirm emulator/device is", "detected.", "iOS build issues", "Use macOS + Xcode, correct bundle identifier, signing team, and", "provisioning.", "Native plugin not working", "Install plugin, run ionic cap sync, then test on real device when", "hardware is required.", "BEST PRACTICE", "browser → responsive preview → emulator → real device → signed release build."]}]}], "traps": ["This deck is almost all prose and images. It supplies vocabulary and dates, not code. Do not spend drill time here beyond the CLI commands and the project layout.", "The Ionic CLI command `ionic generate page pages/login` is the fastest way to create a page correctly. Use it rather than creating the four page files by hand under exam pressure.", "`ionic serve` gives a browser preview with live reload. Capacitor plugins generally do not work there, which is why the deck's ladder ends at a real device."], "exam": "Expect identification items here, not code items. Dates (2007, 2008, 2009 to 2012, 2015+, 2019+), the four approaches and their trade-offs, the three parts of Ionic-Angular, the five building blocks, the CLI commands, and the testing ladder. Marked as small print in the companion reviewer."}, {"id": "L01.2", "title": "Development environment setup", "slides": 29, "purpose": "A click-through of the installations: Node.js, the Ionic CLI, the editor, Android Studio and the SDK. The deck is built from 34 screenshots of installer dialogs, so it contains no code listings at all. It is examined as a sequence of tool names and one verification command list.", "ngmodule": null, "topics": [{"title": "The four mandatory installations", "slides": [], "points": ["**Node.js LTS and npm.** Install the LTS release line, not Current. LTS is what the deck calls Recommended For Most Users; Current carries the newest features and the newest breakage. npm ships with Node.", "**The Ionic CLI**: `npm install -g @ionic/cli`. Global, so the `ionic` command exists in any directory.", "**Git and a code editor.** Visual Studio Code is the editor this course uses.", "**Android Studio plus a JDK**, for the Android SDK, the emulator and native builds. On macOS only, **Xcode** is additionally required to build and sign iOS apps."], "defs": [], "code": [], "deck": []}, {"title": "Verification and environment variables", "slides": [], "points": ["Verify all four tools before creating anything: `node -v`, `npm -v`, `ionic -v`, `git --version`. If any one fails, fix it before going further; a missing CLI masquerades as a broken project.", "`ANDROID_SDK_ROOT` is the environment variable that tells Android Studio where the Android SDK actually lives.", "An **Android Virtual Device** (AVD) is the emulated phone created inside Android Studio, so the app can be run without physical hardware.", "The deck's standing advice: prove the web development server works before attempting any native build."], "defs": [], "code": [], "deck": []}], "traps": ["No code in this deck, so no code can be tested from it. Do not mine it for listings.", "The install order matters: Node before the Ionic CLI, and the SDK plus licences before any Android build.", "The Common Setup Issues list in L01 slide 16 covers most of what actually goes wrong. Read the symptom, not the fix."], "exam": "Tool names and one command list: Node.js LTS and npm, the Ionic CLI, VS Code, Android Studio with a JDK, Xcode for iOS, the four verification commands, `ANDROID_SDK_ROOT`, AVD, and the rule that browser testing precedes native builds. Marked as small print in the companion reviewer."}, {"id": "L02", "title": "Routing and navigation", "slides": 16, "purpose": "The most heavily weighted lesson, and the one the whole application depends on. It defines the routing vocabulary, then covers template navigation, code navigation, route parameters, back navigation, tab stacks and guards. It is taught entirely in the standalone API, so every listing here has to be re-expressed in NgModule form.", "ngmodule": "This is the lesson that must be translated rather than quoted. The full NgModule translation is in section 2, and the working version is in `app-code/`: one `app-routing.module.ts` with a single `forRoot`, `loadChildren` for every lazy page, and one `x-routing.module.ts` per page using `forChild`.", "topics": [{"title": "Routing is the map, navigation is the movement", "slides": [2, 3, 4], "points": ["A route can exist before anybody visits it. Navigation is what uses those routes to change the visible page. The deck separates the two deliberately, and the exam follows.", "Ionic replaces Angular's plain `<router-outlet>` with `<ion-router-outlet>`. That single substitution is what gives pages mobile transitions and the navigation stack.", "The five vocabulary items on slide 4 are the most likely identification items in the whole course: route, path, outlet, routerLink, `Router.navigate()`, stack.", "Navigation remains URL-based even though it feels native. That is why a routing mistake is usually diagnosable from the address bar alone."], "defs": [["Route", "A rule: path + component or lazy-loaded page.", "One line of the URL map."], ["Path", "The URL segment, such as home or products/:id.", "The part of the address you match on."], ["Outlet", "The placeholder where the matched page appears.", "The hole in the shell the page is dropped into."], ["routerLink", "HTML attribute used for tap/click navigation.", "Navigation declared in the template."], ["Router.navigate()", "TypeScript function for navigation from code.", "Navigation decided in a method."], ["Stack", "Mobile-style history of pages for back behavior.", "The pile of pages behind the visible one."]], "code": [], "deck": [{"n": 2, "title": "ROUTING VS. NAVIGATION", "lines": ["The map. It defines which component/", "page appears for a URL path.", "The movement. It is what happens when the", "user taps, goes back, or is redirected.", "A route can exist even before the user visits it. Navigation uses those routes to change the visible page.", "Simple Analogy: route = room address, navigation = walking to the room."]}, {"n": 3, "title": "HOW IONIC-ANGULAR DISPLAYS A PAGE", "lines": ["User URL", "/home", "Angular", "Router", "Route", "match", "ion-router-", "outlet", "Home", "Page", "shown", "Ionic uses `<ion-router-outlet>` instead of", "plain `<router-outlet>` so pages get mobile-", "style transitions and stack behavior."]}, {"n": 4, "title": "IMPORTANT VOCABULARY", "lines": ["Route", "A rule: path + component", "or lazy-loaded page.", "Path", "The URL segment, such as", "home or products/:id.", "Outlet", "The placeholder where the", "matched page appears.", "routerLink", "HTML attribute used for", "tap/click navigation.", "Router.navigate()", "TypeScript function for", "navigation from code.", "Stack", "Mobile-style history of", "pages for back behavior.", "Remember:  Ionic navigation is still URL-based. Good routes make the app easier to debug."]}]}, {"title": "The route list is the application map", "slides": [5, 6, 7], "points": ["Four properties do all the work: `path` (the URL part after the domain), `loadComponent` (loads the page only when needed), `redirectTo` (chooses the first screen), and `pathMatch: 'full'` (redirect only when the path is exactly empty).", "The deck states the consequence directly: if the route is missing, the page cannot be opened by URL. That is the first thing to check when a page will not open.", "Two special paths cover the edge cases: the empty path for a user who opened the app with no page name, and the wildcard `**` for a user who typed an unknown URL. The wildcard must be the last entry, or it swallows everything below it.", "The deck's own named common mistake is forgetting `pathMatch: 'full'`, which produces confusing redirects because an empty path then matches every URL."], "defs": [], "code": [{"slide": 5, "lang": "typescript", "code": "import { Routes } from '@angular/router';\nexport const routes: Routes = [\n  {\n    path: 'home',\n    loadComponent: () => import('./home/home.page')\n      .then(m => m.HomePage)\n  },\n  {\n    path: '',\n    redirectTo: 'home',\n    pathMatch: 'full'\n  }\n];"}, {"slide": 6, "lang": "typescript", "code": "// app.routes.ts\nexport const routes: Routes = [\n  { path: 'home', loadComponent: () => import('./home/home.page')\n      .then(m => m.HomePage) },\n  { path: 'about', loadComponent: () => import('./about/about.page')\n      .then(m => m.AboutPage) },\n  { path: '', redirectTo: 'home', pathMatch: 'full' }\n];"}, {"slide": 6, "lang": "html", "code": "<!-- home.page.html -->\n<ion-button routerLink=\"about\">\n  Open About Page\n<\/ion-button>"}, {"slide": 7, "lang": "typescript", "code": "export const routes: Routes = [\n  { path: '', redirectTo: 'home', pathMatch: 'full’\n},\n  { path: 'home', loadComponent: () => import('./home/home.page')\n      .then(m => m.HomePage) },\n  { path: 'profile', loadComponent: () => import('./profile/profile.page')\n      .then(m => m.ProfilePage) },\n  { path: '**', redirectTo: 'home' } // fallback\n];"}], "deck": [{"n": 5, "title": "BASIC ROUTE SETUP", "lines": ["APP.ROUTES.TS", "```typescript", "import { Routes } from '@angular/router';", "export const routes: Routes = [", "  {", "    path: 'home',", "    loadComponent: () => import('./home/home.page')", "      .then(m => m.HomePage)", "  },", "  {", "    path: '',", "    redirectTo: 'home',", "    pathMatch: 'full'", "  }", "];", "```", "- path is the URL part after the domain.", "- loadComponent loads the page only", "when needed.", "- redirectTo chooses the first screen.", "- pathMatch: full means only redirect", "when the path is exactly empty.", "The route list is the app map. If the route", "is missing, the page cannot be opened", "by URL."]}, {"n": 6, "title": "EXAMPLE 1: HOME →ABOUT", "lines": ["```typescript", "// app.routes.ts", "export const routes: Routes = [", "  { path: 'home', loadComponent: () => import('./home/home.page')", "      .then(m => m.HomePage) },", "  { path: 'about', loadComponent: () => import('./about/about.page')", "      .then(m => m.AboutPage) },", "  { path: '', redirectTo: 'home', pathMatch: 'full' }", "];", "```", "```html", "<!-- home.page.html -->", "<ion-button routerLink=\"about\">", "  Open About Page", "<\/ion-button>", "```", "Result: tapping the button changes the URL to /about and displays AboutPage.", "/home", "/about"]}, {"n": 7, "title": "REDIRECTS AND FALLBACK ROUTES", "lines": ["```typescript", "export const routes: Routes = [", "  { path: '', redirectTo: 'home', pathMatch: 'full’", "},", "  { path: 'home', loadComponent: () => import('./home/home.page')", "      .then(m => m.HomePage) },", "  { path: 'profile', loadComponent: () => import('./profile/profile.page')", "      .then(m => m.ProfilePage) },", "  { path: '**', redirectTo: 'home' } // fallback", "];", "```", "Empty path", "User opens the app with no page", "name. Redirect to home.", "Wildcard **", "User enters an unknown URL.", "Redirect to a safe page.", "“Common Mistake,", "forgetting pathMatch: full", "may cause confusing", "redirects.”"]}]}, {"title": "Declaring navigation in the template", "slides": [8], "points": ["`routerLink` is for navigation that is known directly in the HTML. When the destination depends on data, login status or a function result, move to TypeScript navigation.", "`routerDirection` controls the stack, not the destination: `forward` when the user is moving deeper, `back` when returning to an earlier page, and `root` when the stack must be reset.", "`routerLink` also takes an array when a value has to be substituted into the path, which is how catalogue rows link to their detail pages in the canonical project."], "defs": [], "code": [{"slide": 8, "lang": "html", "code": "<ion-button routerLink=\"/settings\" routerDirection=\"forward\">\n  Settings\n<\/ion-button>\n<ion-item routerLink=\"/products/42\" routerDirection=\"forward\">\n  <ion-label>Open Product 42<\/ion- label>\n<\/ion-item>\n<ion-button routerLink=\"/home\" routerDirection=\"root\">\n  Go Home\n<\/ion-button>"}], "deck": [{"n": 8, "title": "\\<HTML> NAVIGATION", "lines": ["```html", "<ion-button routerLink=\"/settings\" routerDirection=\"forward\">", "  Settings", "<\/ion-button>", "<ion-item routerLink=\"/products/42\" routerDirection=\"forward\">", "  <ion-label>Open Product 42<\/ion- label>", "<\/ion-item>", "<ion-button routerLink=\"/home\" routerDirection=\"root\">", "  Go Home", "<\/ion-button>", "```", "routerLink is best for simple taps", "from the template.", "forward means the user is moving", "deeper.", "back means returning to an earlier", "page.", "root resets the navigation stack.", "RULE OF THUMB", "use routerLink when navigation is", "known directly in the HTML."]}]}, {"title": "Navigating from code: Router and NavController", "slides": [9], "points": ["Two objects, two jobs. Use `Router` for general Angular navigation, route parameters and query parameters. Use `NavController` for Ionic-friendly forward, back and root stack behaviour.", "`this.router.navigate(['/products', id])` pushes onto the stack. `this.navCtrl.navigateRoot('/home')` sets a root move instead of a forward push.", "The exit button uses `navigateRoot` with `{ replaceUrl: true }`: after logout, Back must not be able to re-enter the tabs, and it is `replaceUrl` that drops the entry being left. `navigateRoot` on its own only sets the transition direction."], "defs": [], "code": [{"slide": 9, "lang": "typescript", "code": "import { Router } from '@angular/router';\nimport { NavController } from '@ionic/angular';\nconstructor( private router: Router, private navCtrl: NavController ) {}\nopenDetails(id: number) {\n  this.router.navigate(['/products', id]);\n}\ngoHome() {\n  this.navCtrl.navigateRoot('/home');\n}"}], "deck": [{"n": 9, "title": "TYPESCRIPT NAVIGATION", "lines": ["```typescript", "import { Router } from '@angular/router';", "import { NavController } from '@ionic/angular';", "constructor( private router: Router, private navCtrl: NavController ) {}", "openDetails(id: number) {", "  this.router.navigate(['/products', id]);", "}", "goHome() {", "  this.navCtrl.navigateRoot('/home');", "}", "```", "Use Router", "General Angular navigation, route", "parameters, query parameters.", "Use NavController", "Ionic-friendly forward, back, and root", "stack behavior.", "Use TypeScript navigation when the", "destination depends on data, login", "status, or a function result."]}]}, {"title": "Route parameters and query parameters", "slides": [10, 11], "points": ["A route parameter identifies one exact resource: `/products/42`. A query parameter modifies how a list is shown: `/products?category=books`. Route parameters are for required identity, query parameters for optional filters.", "Reading a route parameter is a two-step job: get the parameter map from the activated route, then read the named key. The deck's snippet uses `this.route.snapshot.paramMap.get('id')`.", "The value arrives as a **string**. `'42'` must be converted with `Number(...)` or `+` before it is compared with a numeric record id. This is the single most common silent bug in the whole project, because `===` between a string and a number is simply false.", "Query parameters are read reactively through `queryParamMap.subscribe(...)`, because a query string can change without the page being recreated.", "The deck adds a security note worth remembering: never pass secret data through the URL."], "defs": [], "code": [{"slide": 10, "lang": "html", "code": "// app.routes.ts\n{ path: 'products/:id', loadComponent:\n() => import('./product-detail/product- detail.page')\n  .then(m => m.ProductDetailPage) }\n// product-list.page.html\n<ion-item [routerLink]=\"['/products', product.id]\">\n  {{ product.name }}\n<\/ion-item>"}, {"slide": 10, "lang": "typescript", "code": "// product-detail.page.ts\nimport { ActivatedRoute } from '@angular/router';\nproductId = '';\nconstructor(private route: ActivatedRoute) {}\nngOnInit() {\n  this.productId = this.route.snapshot.paramMap.get('id') ?? '';\n}"}, {"slide": 11, "lang": "typescript", "code": "// Query param navigation\nthis.router.navigate(['/products'], {\n  queryParams: { category: 'books', sort: 'newest' }\n});\n// Reading query params\nthis.route.queryParamMap.subscribe(params => {\n  this.category = params.get('category') ?? 'all';\n});"}], "deck": [{"n": 10, "title": "Example 2: Product details with route params", "lines": ["```html", "// app.routes.ts", "{ path: 'products/:id', loadComponent:", "() => import('./product-detail/product- detail.page')", "  .then(m => m.ProductDetailPage) }", "// product-list.page.html", "<ion-item [routerLink]=\"['/products', product.id]\">", "  {{ product.name }}", "<\/ion-item>", "```", "```typescript", "// product-detail.page.ts", "import { ActivatedRoute } from '@angular/router';", "productId = '';", "constructor(private route: ActivatedRoute) {}", "ngOnInit() {", "  this.productId = this.route.snapshot.paramMap.get('id') ?? '';", "}", "```", "URL example: /products/42 → id is 42", "Use route params for required identifiers", "like id, slug, or username."]}, {"n": 11, "title": "ROUTE PARAMS VS. QUERY PARAMS", "lines": ["Route parameter", "Route params usually identify one", "exact resource.", "/products/42", "Best for required identity.", "Query parameter", "Query params usually modify how a", "list is shown.", "/products?category=books", "Best for optional filters.", "```typescript", "// Query param navigation", "this.router.navigate(['/products'], {", "  queryParams: { category: 'books', sort: 'newest' }", "});", "// Reading query params", "this.route.queryParamMap.subscribe(params => {", "  this.category = params.get('category') ?? 'all';", "});", "```", "Do not pass secret data through the URL."]}]}, {"title": "Back navigation and the stack", "slides": [12], "points": ["`ion-back-button` follows Ionic's navigation history rather than the browser's. It goes into the toolbar's `start` slot.", "`defaultHref` is the fallback destination used when there is no previous page, which is exactly the case when a URL is opened directly or the page is reloaded.", "The deck pairs this with the instruction to use `navigateRoot` after logout or an app reset, and to avoid forcing browser history in tab navigation. In Ionic 9 that call only sets the direction, so it is paired with `{ replaceUrl: true }` to actually drop the entry being left."], "defs": [], "code": [{"slide": 12, "lang": "html", "code": "<ion-header>\n  <ion-toolbar>\n    <ion-buttons slot=\"start\">\n      <ion-back-button defaultHref=\"/home\"><\/ion-back-button>\n    <\/ion-buttons>\n    <ion-title>Details<\/ion-title>\n  <\/ion-toolbar>\n<\/ion-header>"}], "deck": [{"n": 12, "title": "BACK NAVIGATION", "lines": ["```html", "<ion-header>", "  <ion-toolbar>", "    <ion-buttons slot=\"start\">", "      <ion-back-button defaultHref=\"/home\"><\/ion-back-button>", "    <\/ion-buttons>", "    <ion-title>Details<\/ion-title>", "  <\/ion-toolbar>", "<\/ion-header>", "```", "- ion-back-button follows Ionic", "navigation history.", "- defaultHref is used when there is no", "previous page.", "- Use navigateRoot after logout or app", "reset.", "- Avoid forcing browser history in tab", "navigation.", "Home", "List", "Details"]}]}, {"title": "Tabs mean several stacks", "slides": [13, 14], "points": ["Linear navigation has one path forward and backward. Tab navigation is non-linear: each tab keeps its own history stack, so Back is not always the previously seen screen.", "The deck's important warning is examinable in both directions: with tabs, do not assume browser back equals app back.", "Tabs use child routes because every tab is part of the tabs layout. The route that carries `children` is mounted on the tab shell, and the empty-path child redirects to the first tab."], "defs": [], "code": [{"slide": 14, "lang": "html", "code": "export const routes: Routes = [\n  {\n    path: 'tabs',\n    loadComponent: () => import('./tabs/tabs.page').then(m => m.TabsPage),\n    children: [\n      { path: 'home', loadComponent: () => import('./home/home.page').then(m => m.HomePage) },\n      { path: 'search', loadComponent: () => import('./search/search.page').then(m => m.SearchPage) },\n      { path: 'profile', loadComponent: () => import('./profile/profile.page').then(m => m.ProfilePage) },\n      { path: '', redirectTo: '/tabs/home', pathMatch: 'full' }\n    ]\n  },\n  { path: '', redirectTo: '/tabs/home', pathMatch: 'full' }\n];\n<ion-tabs>\n  <ion-tab-bar slot=\"bottom\">\n    <ion-tab-button tab=\"home\" href=\"/tabs/home\">\n       <ion-label>Home<\/ion-label>\n    <\/ion-tab-button>\n    <ion-tab-button tab=\"search\" href=\"/tabs/search\">\n       <ion-label>Search<\/ion-label>\n    <\/ion-tab-button>\n  <\/ion-tab-bar>\n<\/ion-tabs>"}], "deck": [{"n": 13, "title": "LINEAR VS. NON-LINEAR", "lines": ["Linear navigation", "One path forward and backward.", "Home", "List", "Non-Linear navigation", "Each tab can keep its own history stack. Back is not always the", "previously seen screen.", "Detail", "LINEAR VS. NON-LINEAR", "NAVIGATION", "Linear: one stack", "Tab 1", "A → B", "Tab 2", "Tab 3", "D → E", "Tabs: multiple stacks", "IMPORTANT! With tabs, do not assume browser back always equals app back."]}, {"n": 14, "title": "EXAMPLE 3: TABS WITH NESTED ROUTES", "lines": ["```html", "export const routes: Routes = [", "  {", "    path: 'tabs',", "    loadComponent: () => import('./tabs/tabs.page').then(m => m.TabsPage),", "    children: [", "      { path: 'home', loadComponent: () => import('./home/home.page').then(m => m.HomePage) },", "      { path: 'search', loadComponent: () => import('./search/search.page').then(m => m.SearchPage) },", "      { path: 'profile', loadComponent: () => import('./profile/profile.page').then(m => m.ProfilePage) },", "      { path: '', redirectTo: '/tabs/home', pathMatch: 'full' }", "    ]", "  },", "  { path: '', redirectTo: '/tabs/home', pathMatch: 'full' }", "];", "<ion-tabs>", "  <ion-tab-bar slot=\"bottom\">", "    <ion-tab-button tab=\"home\" href=\"/tabs/home\">", "       <ion-label>Home<\/ion-label>", "    <\/ion-tab-button>", "    <ion-tab-button tab=\"search\" href=\"/tabs/search\">", "       <ion-label>Search<\/ion-label>", "    <\/ion-tab-button>", "  <\/ion-tab-bar>", "<\/ion-tabs>", "```", "Tabs use child routes because every tab is part of the tabs layout."]}]}, {"title": "Guards protect the route, not the button", "slides": [15], "points": ["A guard runs before the route opens. Returning `true` allows navigation; returning a `UrlTree` redirects safely.", "The deck's framing is the examinable point: never rely only on hiding buttons. Protect the route itself, or the page is still reachable by typing its URL.", "The deck shows the standalone functional form (`CanActivateFn` with `inject()`). In NgModule form this becomes a class implementing `CanActivate`, registered in the route's `canActivate` array."], "defs": [], "code": [{"slide": 15, "lang": "typescript", "code": "// auth.guard.ts\nexport const authGuard: CanActivateFn = () => {\n  const auth = inject(AuthService);\n  const router = inject(Router);\n  if (auth.isLoggedIn()) return true;\n  return router.createUrlTree(['/login']);\n};\n// app.routes.ts\n{\n  path: 'dashboard',\n  canActivate: [authGuard],\n  loadComponent: () => import('./dashboard/dashboard.page')\n    .then(m => m.DashboardPage)\n}"}], "deck": [{"n": 15, "title": "Never rely only on", "lines": ["ROUTE GUARDS", "```typescript", "// auth.guard.ts", "export const authGuard: CanActivateFn = () => {", "  const auth = inject(AuthService);", "  const router = inject(Router);", "  if (auth.isLoggedIn()) return true;", "  return router.createUrlTree(['/login']);", "};", "// app.routes.ts", "{", "  path: 'dashboard',", "  canActivate: [authGuard],", "  loadComponent: () => import('./dashboard/dashboard.page')", "    .then(m => m.DashboardPage)", "}", "```", "- Guard runs before opening the route.", "- Return true to allow navigation.", "- Return UrlTree to redirect safely.", "- Use guards for login-only pages.", "Never rely only on", "hiding buttons. Protect", "the route itself."]}]}, {"title": "Debugging routing problems", "slides": [16], "points": ["The checklist, in the deck's order: check the browser URL, check the route array for a misspelled path, check that the wildcard is last, check imports and page filenames, and check the console for 'Cannot match any routes'.", "The console-log pattern before `Router.navigate()` is worth keeping: it separates 'the function never ran' from 'the function ran and the route is wrong'.", "The deck's closing observation is the useful one: most beginner errors are not Ionic errors. They are wrong paths, missing routes, or wrong parameter names."], "defs": [], "code": [{"slide": 16, "lang": "typescript", "code": "openStudent(id: number) {\n  console.log('Navigating to student:', id);\n  this.router.navigate(['/students', id]);\n}"}], "deck": [{"n": 16, "title": "DEBUGGING ROUTING PROBLEMS", "lines": ["- Check the browser URL: is the path what you", "expected?", "- Check app.routes.ts: is the path spelled correctly?", "- Check route order: is wildcard ** placed last?", "- Check imports and page filenames.", "- Check the console for “Cannot match any routes”.", "- Use console.log() before Router.navigate() to", "confirm the function runs.", "```typescript", "openStudent(id: number) {", "  console.log('Navigating to student:', id);", "  this.router.navigate(['/students', id]);", "}", "```", "Most beginner errors are", "not “Ionic errors.”", "They are wrong paths,", "missing routes, or wrong", "parameter names."]}]}], "traps": ["Every listing in this deck is standalone. `app.routes.ts` must become `app-routing.module.ts`, `loadComponent` must become `loadChildren`, and the top-level `children: []` of the tabs route must move into `tabs-routing.module.ts`. Copying a deck listing verbatim will not work here.", "`pathMatch: 'full'` is required on every empty-path redirect, including the child redirect inside the tabs shell. Without it the redirect matches every URL under the parent.", "The wildcard `**` must be the last route. Place it before the others and every route below it becomes unreachable.", "Route parameters are strings. Convert before comparing.", "For a nested detail route, `:id` is declared once, in the catalogue's own routing module. Repeating it in the detail module produces an unreachable route."], "exam": "The most weighted lesson for both halves. Identification: route, path, outlet, routerLink, stack, routerDirection values, route versus query parameter, `defaultHref`, guard. Code: writing a routing module in NgModule form, and reading a route parameter in the right hook with the right conversion."}, {"id": "L03", "title": "Angular and Ionic lifecycle", "slides": 15, "purpose": "Why code that runs at the wrong moment behaves strangely. It separates Angular's component lifecycle from Ionic's page lifecycle, gives a decision guide for where each kind of code belongs, and explains why a page can leave the screen and still be alive. The examinable core is a short list of hooks and their correct uses.", "ngmodule": "Almost no translation needed. The hooks are identical in both APIs. The additions for this project are `standalone: false` on the decorator and `implements OnInit` kept as-is.", "topics": [{"title": "Two lifecycles, and the confusion they cause", "slides": [2, 3], "points": ["Angular's lifecycle is about components being created, checked, rendered and destroyed. Ionic's is about pages entering and leaving mobile navigation.", "The whole difficulty in one sentence: in Ionic, a page can leave the screen but still remain alive in memory.", "Three symptoms follow, and they are the ones that cost marks: going back to a page may not run `ngOnInit` again, leaving a page does not always run `ngOnDestroy`, and Ionic preserves pages precisely to keep navigation smooth.", "The six-stage mental model is created, initialized, enters, active, leaves, destroyed. Angular owns stages one, two and six; Ionic owns three to five."], "defs": [], "code": [], "deck": [{"n": 2, "title": "MENTAL MODEL: A PAGE HAS A “LIFE”", "lines": ["Think of each page like a screen that can be created, shown, hidden, and destroyed.", "1. Created", "object exists", "2. Initialized", "data prepared", "3. Enters", "screen opens", "4. Active", "user interacts", "5. Leaves", "screen hides", "6. Destroyed", "removed", "IMPORTANT IDEA", "- Angular lifecycle is about components being created, checked,", "rendered, and destroyed.", "- Ionic lifecycle is about pages entering and leaving mobile", "navigation.", "- In Ionic, a page can leave the screen but still remain alive in", "memory."]}, {"n": 3, "title": "MENTAL MODEL: A PAGE HAS A “LIFE”", "lines": ["WHY BEGINNERS GET CONFUSED?", "Going back to a page may not run ngOnInit again.", "Leaving a page does not always mean ngOnDestroy", "runs immediately.", "Ionic preserves pages to keep navigation smooth.", "Think of each page like a screen that can be created, shown, hidden, and destroyed.", "1. Created", "object exists", "2. Initialized", "data prepared", "3. Enters", "screen opens", "4. Active", "user interacts", "5. Leaves", "screen hides", "6. Destroyed", "removed"]}]}, {"title": "Angular lifecycle hooks", "slides": [4], "points": ["Five hooks. The first two carry almost all of the examinable weight.", "`constructor` runs first, when the class is created, and is for dependency injection. `ngOnInit()` runs once after Angular initialises inputs, and is for one-time setup.", "`ngOnChanges()` runs when `@Input` values change and belongs to reusable child components. `ngAfterViewInit()` runs after the component's view is ready. `ngOnDestroy()` runs before Angular destroys the component, and is for final cleanup.", "The deck's beginner rule is blunt and correct: do not put API calls inside the constructor, use `ngOnInit` for setup that runs once, and use `ngOnDestroy` for cleanup only when the component is truly destroyed."], "defs": [["constructor", "Runs first when the class is created. Use it mostly for dependency injection.", "Receive your tools. Nothing else."], ["ngOnInit()", "Runs once after Angular initializes inputs. Good for one-time setup.", "Prepare once."], ["ngOnChanges()", "Runs when @Input values change. Useful for reusable child components.", "React to a parent's new value."], ["ngAfterViewInit()", "Runs after the component view is ready. Useful for view/query-related code.", "The template now exists; touch it here."], ["ngOnDestroy()", "Runs before Angular destroys the component. Good for final cleanup.", "Last chance to release something."]], "code": [], "deck": [{"n": 4, "title": "“What is happening", "lines": ["ANGULAR LIFECYCLE HOOKS: COMPONENT-LEVEL EVENTS", "These hooks belong to Angular components, not only Ionic pages.", "USE THIS", "WHEN", "constructor", "Runs first when the class is created. Use it", "mostly for dependency injection.", "ngOnInit()", "Runs once after Angular initializes inputs.", "Good for one-time setup.", "ngOnChanges()", "Runs when @Input values change. Useful", "for reusable child components.", "ngAfterViewInit()", "Runs after the component view is ready.", "Useful for view/query-related code.", "ngOnDestroy()", "Runs before Angular destroys the", "component. Good for final cleanup.", "BEGINNER RULE!", "- Do not put API calls inside the constructor.", "- Use ngOnInit for setup that only needs to run", "once.", "- Use ngOnDestroy for cleanup only when the", "component is truly destroyed.", "“What is happening", "to this component", "right now?”"]}]}, {"title": "Ionic page lifecycle hooks", "slides": [5], "points": ["Four hooks bracket visibility: `ionViewWillEnter()` before the page enters, `ionViewDidEnter()` after it has finished entering, `ionViewWillLeave()` before it leaves, and `ionViewDidLeave()` after it has left.", "The correct uses are the examinable part. Will-enter is for refreshing data before the user sees it. Did-enter is for work that needs the page visible, such as focus, animation-sensitive work or plugin UI. Will-leave is for pausing timers, stopping the camera, and unsubscribing. Did-leave is for logic after the transition.", "The three warnings on this slide are the most commonly examined detail in the lesson: these hooks are called only on routed page components, they do not automatically run on small child components inside the page, and they exist because Ionic keeps pages in the DOM during navigation."], "defs": [["ionViewWillEnter()", "Page is about to enter. Good for refreshing data before the user sees the page.", "Refresh on every visit."], ["ionViewDidEnter()", "Page has finished entering. Good for work after animation or after page is visible.", "The page is on screen; now act."], ["ionViewWillLeave()", "Page is about to leave. Good for pausing timers, stopping camera, or unsubscribing.", "Stop the background work."], ["ionViewDidLeave()", "Page has finished leaving. Good for logic that should happen after transition.", "Anything left to do once hidden."]], "code": [], "deck": [{"n": 5, "title": "“Is this page entering,", "lines": ["IONIC PAGE LIFECYCLE HOOKS: NAVIGATION-LEVEL EVENTS", "These hooks run when an Ionic page enters or leaves the visible screen.", "USE THIS", "WHEN", "ionViewWillEnter()", "Page is about to enter. Good for refreshing", "data before the user sees the page.", "ionViewDidEnter()", "Page has finished entering. Good for work", "after animation or after page is visible.", "ionViewWillLeave()", "Page is about to leave. Good for pausing", "timers, stopping camera, or unsubscribing.", "ionViewDidLeave()", "Page has finished leaving. Good for logic that", "should happen after transition.", "VERY IMPORTANT!", "- Ionic lifecycle hooks are called only on", "routed page components.", "- They do not automatically run on small", "child components inside the page.", "- They are useful because Ionic keeps", "pages in the DOM during navigation.", "“Is this page entering,", "visible, leaving or", "already hidden?”"]}]}, {"title": "Entry and exit sequences", "slides": [6, 7], "points": ["First-time entry runs in a fixed order: `constructor` (class created), `ngOnInit` (init once), `ionViewWillEnter` (about to show), the transition animation, then `ionViewDidEnter` (now visible).", "Re-entry runs a shorter sequence. `ngOnInit` may not repeat, but the Ionic enter hooks do.", "That difference is the entire reason the refresh-on-return pattern exists: first visit is Angular's setup, every visit is Ionic's hooks.", "Leaving is not destroying. On leave, `ionViewWillLeave` runs, the transition happens, `ionViewDidLeave` runs, and the page is kept alive and often cached. `ngOnDestroy` runs only if the page is actually removed.", "Ionic may keep the old page in the DOM but hidden, which is what preserves scroll position and page state. Pages are usually removed only when popped from navigation history."], "defs": [], "code": [{"slide": 6, "lang": "typescript", "code": "constructor() {\n  console.log('1 constructor');\n}\nngOnInit() {\n  console.log('2 ngOnInit');\n}\nionViewWillEnter() {\n  console.log('3 ionViewWillEnter');\n}\nionViewDidEnter() {\n  console.log('4 ionViewDidEnter');\n}"}], "deck": [{"n": 6, "title": "WHAT HAPPENS WHEN A PAGE OPENS?"
