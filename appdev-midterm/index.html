lide": 7, "lang": "scss", "code": ":root {\n  --ion-color-primary: #2563eb;\n  --ion-color-primary-contrast: #ffffff;\n\n  --ion-background-color: #f8fafc;\n  --ion-text-color: #0f172a;\n}"}], "deck": [{"n": 4, "title": "What is an Ionic component?", "lines": ["An Ionic component is a ready-made mobile UI element that already has platform-friendly styling and behavior.", "Example tags", "`<ion-button>`", "`<ion-card>`", "`<ion-input>`", "`<ion-list>`", "Why use them?", "They save time and follow mobile UI", "patterns such as touch size, animations,", "spacing, and platform mode.", "How to style?", "Use attributes, CSS variables, Shadow", "Parts, classes, and theme variables.", "```html", "01  <ion-button color=\"primary\" expand=\"block\">Save<\/ion- button>", "02", "03  <ion-card>", "04    <ion-card-header>", "05      <ion-card-title>Profile<\/ion-card-title>", "06    <\/ion-card-header>", "07    <ion-card-content>Student information here.<\/ion-card- content>", "08  <\/ion-card>", "```", "UI preview idea", "Ionic renders the same code into mobile-", "friendly buttons, cards, lists, inputs, and", "navigation elements."]}, {"n": 5, "title": "Basic Ionic page anatomy", "lines": ["Most Ionic pages use a familiar structure: header, content, and UI components inside content.", "```html", "<ion-header>", "  <ion-toolbar color=\"primary\">", "    <ion-title>Dashboard<\/ion-title>", "  <\/ion-toolbar>", "<\/ion-header>", "<ion-content class=\"ion-padding\">", "  <ion-card>", "    <ion-card-header>", "      <ion-card-title>Welcome<\/ion-card-title>", "    <\/ion-card-header>", "    <ion-card-content>", "      Build screens using Ionic components.", "    <\/ion-card-content>", "  <\/ion-card>", "<\/ion-content>", "```", "ion-header / ion-toolbar", "ion-content", "ion-card"]}, {"n": 6, "title": "Where do Ionic styles live?", "lines": ["Use the right CSS location to avoid messy, hard-to-maintain styling.", "src/theme/variables.scss", "Use for global theme values:", "- primary/secondary colors", "- app background/text colors", "- light/dark palette values", "src/global.scss", "Use for global helpers:", "- app-wide CSS classes", "- utility classes", "- styles used across many screens", "page.component.scss", "Use for page-specific style:", "- dashboard page card spacing", "- only one page layout", "- component-specific visual design"]}, {"n": 7, "title": "Theme variables: the app design control panel", "lines": ["Ionic themes are mostly CSS custom properties, also called CSS variables.", "A CSS variable starts with -- and stores a reusable value.", "Ionic reads variables like --ion-color-primary to style many", "components.", "Changing a theme variable updates the app consistently.", "Theme variables are commonly edited in", "src/theme/variables.scss.", "```scss", ":root {", "  --ion-color-primary: #2563eb;", "  --ion-color-primary-contrast: #ffffff;", "  --ion-background-color: #f8fafc;", "  --ion-text-color: #0f172a;", "}", "```", "Simple explanation", "Theme variables are like one central settings panel for the", "visual identity of the app."]}]}, {"title": "Reaching inside a component: CSS variables and shadow parts", "slides": [8, 9, 10], "points": ["Ionic components use the Shadow DOM, so an ordinary CSS descendant selector cannot reach their inner elements. This is the single most common styling frustration in the lesson.", "Two supported doors exist. Component CSS variables are written in a rule that targets the Ionic component and can be read as 'change the button's public style settings'. Shadow parts use `::part(...)` to style an element the component deliberately exposes.", "The deck's warning is explicit: do not rely on random internal class names found in the browser's inspector. They are not public API and they change between versions.", "Use shadow parts when an exposed inner element needs styling; use component CSS variables when a documented setting will do."], "defs": [["Shadow DOM", "Encapsulation that hides a component's internal elements from ordinary selectors.", "Why your selector cannot reach the label inside."], ["::part()", "Selector for an element the component deliberately exposes to styling.", "The official door into a component's insides."]], "code": [{"slide": 9, "lang": "scss", "code": "/* src/theme/variables.scss */\n:root {\n  --ion-color-primary: #0f4c81;\n  --ion-color-primary-rgb: 15, 76, 129;\n  --ion-color-primary-contrast: #ffffff;\n  --ion-color-primary-contrast-rgb: 255, 255, 255;\n  --ion-color-primary-shade: #0d4372;\n  --ion-color-primary-tint: #275e8e;\n\n  --ion-color-secondary: #f59e0b;\n  --ion-color-secondary-contrast: #111827;\n}"}, {"slide": 10, "lang": "html", "code": "<ion-header>\n  <ion-toolbar color=\"primary\">\n    <ion-title>Enrollment<\/ion-title>\n  <\/ion-toolbar>\n<\/ion-header>\n\n<ion-content class=\"ion-padding\">\n  <ion-button expand=\"block\" color=\"primary\">\n    Submit Form\n  <\/ion-button>\n\n  <ion-button expand=\"block\" color=\"secondary\">\n    Save Draft\n  <\/ion-button>\n\n  <ion-badge color=\"secondary\">Pending<\/ion-badge>\n<\/ion-content>"}], "deck": [{"n": 8, "title": "Ionic color system", "lines": ["Ionic components can use named colors through the color attribute.", "primary", "Main brand actions", "secondary", "Supporting actions", "tertiary", "Extra emphasis", "success", "Positive status", "warning", "Caution", "danger", "Delete/error", "medium", "Neutral", "light", "Light UI", "```html", "<ion-button color=\"success\">Save<\/ion-button>", "<ion-button color=\"danger\">Delete<\/ion-button>", "<ion-badge color=\"warning\">Pending<\/ion-badge>", "```"]}, {"n": 9, "title": "Example 1A: Create a simple school theme", "lines": ["Goal: change app branding in variables.scss, not by styling every button manually.", "Example 1 of 3", "```scss", "/* src/theme/variables.scss */", ":root {", "  --ion-color-primary: #0f4c81;", "  --ion-color-primary-rgb: 15, 76, 129;", "  --ion-color-primary-contrast: #ffffff;", "  --ion-color-primary-contrast-rgb: 255, 255, 255;", "  --ion-color-primary-shade: #0d4372;", "  --ion-color-primary-tint: #275e8e;", "  --ion-color-secondary: #f59e0b;", "  --ion-color-secondary-contrast: #111827;", "}", "```", "What happens?", "Primary color becomes school blue.", "Secondary color becomes gold/accent.", "Buttons, badges, toolbars, and many components", "can reuse the same theme.", "The app becomes consistent without repeated CSS.", "primary", "secondary", "background"]}, {"n": 10, "title": "Example 1B: Use the theme in Ionic components", "lines": ["Once the theme is defined, use color names inside Ionic templates.", "Example 1 of 3", "```html", "<ion-header>", "  <ion-toolbar color=\"primary\">", "    <ion-title>Enrollment<\/ion-title>", "  <\/ion-toolbar>", "<\/ion-header>", "<ion-content class=\"ion-padding\">", "  <ion-button expand=\"block\" color=\"primary\">", "    Submit Form", "  <\/ion-button>", "  <ion-button expand=\"block\" color=\"secondary\">", "    Save Draft", "  <\/ion-button>", "  <ion-badge color=\"secondary\">Pending<\/ion-badge>", "<\/ion-content>", "```", "Key lesson", "The template asks for primary or secondary. The", "actual color comes from the theme.", "Why this is better", "If the school changes branding later, edit", "variables.scss once instead of editing every", "component.", "Beginner rule", "Use color=\"...\" first. Add custom CSS only if Ionic", "attributes are not enough."]}]}, {"title": "The component families and the layout grid", "slides": [11, 12, 13, 14, 15], "points": ["Seven families, and choosing correctly is most of the UI work: structure (`ion-header`, `ion-toolbar`, `ion-content`), layout (`ion-grid`, `ion-row`, `ion-col`), display (`ion-card`, `ion-list`, `ion-item`), form (`ion-input`, `ion-select`, `ion-checkbox`), action (`ion-button`, `ion-fab`, `ion-modal`), and status (`ion-chip`, `ion-badge`, `ion-toast`).", "The grid is responsive by attribute rather than by media query: `size-md=\"6\"` produces two cards per row on medium screens, while phones show one.", "The deck's key lesson is to use Ionic layout rules instead of fixed pixel widths. Fixed widths break on a phone; the grid adapts.", "The deck also frames the choice as questions: a clickable action (button), a scrollable page (content), a top bar (toolbar), a grouped set of records (list), a visual container (card), status or category labels (chip, badge), forms (input, select, checkbox)."], "defs": [], "code": [{"slide": 12, "lang": "html", "code": "<!-- dashboard.page.html -->\n<ion-card class=\"info-card\">\n  <ion-card-header>\n    <ion-card-subtitle>Today<\/ion-card-subtitle>\n    <ion-card-title>3 Pending Tasks<\/ion-card-title>\n  <\/ion-card-header>\n\n  <ion-card-content>\n    Finish the activity before 5:00 PM.\n  <\/ion-card-content>\n<\/ion-card>"}, {"slide": 12, "lang": "scss", "code": "/* dashboard.page.scss */\n.info-card {\n  --background: #eef2ff;\n  border-left: 6px solid #4f46e5;\n  border-radius: 18px;\n  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);\n}\n\n.info-card ion-card-title {\n  color: #312e81;\n  font-weight: 800;\n}"}, {"slide": 13, "lang": "html", "code": "<ion-item>"}, {"slide": 13, "lang": "text", "code": "::part(native)"}, {"slide": 14, "lang": "html", "code": "<!-- profile.page.html -->\n<ion-list>\n  <ion-item class=\"profile-item\">\n    <ion-label>\n      <h2>Mark Lester<\/h2>\n      <p>Offensive Security Engineer<\/p>\n    <\/ion-label>\n    <ion-badge color=\"success\">Active<\/ion-badge>\n  <\/ion-item>\n<\/ion-list>"}, {"slide": 14, "lang": "text", "code": "/* profile.page.scss */\n.profile-item::part(native) {\n  background: #f0fdf4;\n  border: 1px solid #bbf7d0;\n  border-radius: 16px;\n  margin-bottom: 10px;\n}\n\n.profile-item ion-badge {\n  font-weight: 700;\n}"}], "deck": [{"n": 11, "title": "Component CSS variables", "lines": ["Many Ionic components expose CSS variables so you can customize them safely.", "What they look like", "- -background", "- -color", "- -border-radius", "- -padding-start", "Where to write them", "In a CSS rule that targets the Ionic", "component or a class on the component.", "Why use them", "They are safer than guessing internal", "component HTML.", "```scss", "ion-button.save-button {", "  --background: #16a34a;", "  --background-hover: #15803d;", "  --color: #ffffff;", "  --border-radius: 12px;", "  font-weight: 700;", "}", "```", "```html", "<ion-button class=\"save-button\">", "  Save Changes", "<\/ion-button>", "```", "Translation: “Change the button’s public style", "settings.”"]}, {"n": 12, "title": "Example 2A: Style a custom information card", "lines": ["Goal: make a card look unique while still using ion-card.", "Example 2 of 3", "```html", "<!-- dashboard.page.html -->", "<ion-card class=\"info-card\">", "  <ion-card-header>", "    <ion-card-subtitle>Today<\/ion-card-subtitle>", "    <ion-card-title>3 Pending Tasks<\/ion-card-title>", "  <\/ion-card-header>", "  <ion-card-content>", "    Finish the activity before 5:00 PM.", "  <\/ion-card-content>", "<\/ion-card>", "```", "```scss", "/* dashboard.page.scss */", ".info-card {", "  --background: #eef2ff;", "  border-left: 6px solid #4f46e5;", "  border-radius: 18px;", "  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);", "}", ".info-card ion-card-title {", "  color: #312e81;", "  font-weight: 800;", "}", "```", "Result", "The UI still uses Ionic card structure, but the card now has a", "custom branded appearance.", "primary", "secondary", "background"]}, {"n": 13, "title": "CSS Shadow Parts", "lines": ["Some Ionic components use Shadow DOM. Shadow Parts let you style allowed inner parts.", "Shadow DOM hides a component’s internal HTML structure.", "Normal CSS cannot always reach inside the component.", "Ionic exposes selected internal elements through ::part(...).", "Use Shadow Parts only when CSS variables are not enough.", "```html", "<ion-item>", "```", "Shadow DOM", "internal structure", "```", "::part(native)", "```"]}, {"n": 14, "title": "Example 2B: Style an ion-item inner part", "lines": ["Goal: style the visible container of ion-item using ::part(native).", "Example 2 of 3", "```html", "<!-- profile.page.html -->", "<ion-list>", "  <ion-item class=\"profile-item\">", "    <ion-label>", "      <h2>Mark Lester<\/h2>", "      <p>Offensive Security Engineer<\/p>", "    <\/ion-label>", "    <ion-badge color=\"success\">Active<\/ion-badge>", "  <\/ion-item>", "<\/ion-list>", "```", "```", "/* profile.page.scss */", ".profile-item::part(native) {", "  background: #f0fdf4;", "  border: 1px solid #bbf7d0;", "  border-radius: 16px;", "  margin-bottom: 10px;", "}", ".profile-item ion-badge {", "  font-weight: 700;", "}", "```", "Use this when", "You need to style a component’s exposed inner element,", "and CSS variables are not enough.", "Avoid this mistake", "Do not rely on random internal class names from the browser", "inspector. They can change."]}, {"n": 15, "title": "Dark mode and theme switching", "lines": ["Ionic supports dark palettes by changing CSS variables for dark mode.", "```scss", "01  /* variables.scss */", "02  body.dark {", "03    --ion-background-color: #0f172a;", "04    --ion-text-color: #f8fafc;", "05", "06    --ion-color-primary: #60a5fa;", "07    --ion-color-primary-contrast: #0f172a;", "08  }", "01  // settings.page.ts", "02  isDark = false;", "03", "04  toggleDarkMode() {", "05    this.isDark = !this.isDark;", "06    document.body.classList.toggle('dark', this.isDark);", "07  }", "```", "Light", "Dark", "Same layout, different CSS variables."]}]}, {"title": "The lesson task and what it checks", "slides": [16, 17, 18, 19, 20], "points": ["The deck's own task is a useful rehearsal for the canonical project: build a page that uses `color=\"primary\"` on a toolbar and a button, customises an `ion-card` through CSS variables, and uses `ion-badge` for status.", "The task's check-your-output list is effectively the marking scheme for any styling question: theme colour applied by name, component styled through its public door, and status shown with the right component.", "The flat rule and avoid pairs from the rest of the deck are consistent: do this (use the component's documented settings), avoid that (guess at internal class names, or hard-code pixel widths)."], "defs": [], "code": [], "deck": [{"n": 16, "title": "Layout components: build screens faster", "lines": ["Ionic has components for layout, lists, forms, and actions.", "Structure", "ion-header", "ion-toolbar", "ion-content", "Layout", "ion-grid", "ion-row", "ion-col", "Display", "ion-card", "ion-list", "ion-item", "Form", "ion-input", "ion-select", "ion-checkbox", "Action", "ion-button", "ion-fab", "ion-modal", "Status", "ion-chip", "ion-badge", "ion-toast"]}, {"n": 17, "title": "Example 3A: Responsive card grid", "lines": ["Goal: use Ionic grid and card components for a mobile-friendly dashboard.", "Example 3 of 3", "```html", "<ion-content class=\"ion-padding\">", "  <ion-grid>", "    <ion-row>", "      <ion-col size=\"12\" size-md=\"6\" *ngFor=\"let subject of subjects\">", "        <ion-card class=\"subject-card\">", "          <ion-card-header>", "            <ion-card-title>{{ subject.name }}<\/ion-card-title>", "            <ion-card-subtitle>{{ subject.schedule }}<\/ion-card-subtitle>", "          <\/ion-card-header>", "          <ion-card-content>", "            {{ subject.description }}", "          <\/ion-card-content>", "        <\/ion-card>", "      <\/ion-col>", "    <\/ion-row>", "  <\/ion-grid>", "<\/ion-content>", "```", "How the grid behaves", "Phone", "size=\"12\" means each card uses the full row.", "Tablet / desktop", "size-md=\"6\" means two cards per row on medium", "screens.", "Key lesson", "Use Ionic layout rules instead of fixed pixel", "widths."]}, {"n": 18, "title": "Example 3B: Add component styles to the grid", "lines": ["Goal: improve the design without losing the Ionic structure.", "Example 3 of 3", "```", "/* dashboard.page.scss */", ".subject-card {", "  --background: #ffffff;", "  border-radius: 20px;", "  border: 1px solid #e2e8f0;", "}", ".subject-card ion-card-title {", "  font-size: 1.15rem;", "}", ".subject-card .meta {", "  display: flex;", "  gap: 8px;", "  margin-top: 12px;", "}", "```", "```html", "01  <ion-card-content>", "02    <p>{{ subject.description }}<\/p>", "03", "04    <div class=\"meta\">", "05      <ion-chip color=\"primary\">{{ subject.units }}", "units<\/ion-chip>", "06      <ion-badge color=\"success\">Open<\/ion-badge>", "07    <\/div>", "08  <\/ion-card-content>", "```", "Result", "The dashboard uses Ionic grid, card, chip, and badge. The", "custom CSS only improves spacing and shape."]}, {"n": 19, "title": "Choosing the right Ionic component", "lines": ["Before writing CSS, choose the UI element that matches the purpose.", "Need a clickable action?", "```", "ion-button, ion-fab", "```", "Need a scrollable page?", "```", "ion-content", "```", "Need a top bar?", "```", "ion-header + ion-toolbar", "```", "Need a grouped set of records?", "```", "ion-list + ion-item", "```", "Need a visual container?", "```", "ion-card", "```", "Need status or category labels?", "```", "ion-badge, ion-chip", "```", "Need forms?", "```", "ion-input, ion-select, ion-checkbox", "```", "Rule", "If Ionic already has a component for it, start there before creating custom HTML and CSS."]}, {"n": 20, "title": "Best practices and common mistakes", "lines": ["Good Ionic styling is simple, consistent, and easy to maintain.", "Do this", "- Use theme variables for app-wide colors", "- Use Ionic attributes first", "- Use component CSS variables when available", "- Use ::part only for exposed inner parts", "- Keep page CSS local when it is page-specific", "Avoid this", "- Hard-coding the same color everywhere", "- Styling internal random classes from DevTools", "- Using !important as the first solution", "- Creating div-based UI when Ionic has a component", "- Mixing theme logic with business logic"]}]}], "traps": ["Ordinary CSS selectors do not reach inside Ionic components. Use a component CSS variable or `::part()`.", "Do not copy internal class names out of the browser inspector. They are not public API.", "Importing the Ionic base stylesheets in `global.scss` is required before any page styling behaves as expected.", "Fixed pixel widths break the phone layout. Use the grid attributes.", "Set the colour once in `variables.scss` and refer to it by name in templates."], "exam": "Lighter than L02 to L06, and almost entirely identification and short answer: the three stylesheets and their jobs, `--ion-color-primary`, the colour names and their meanings, Shadow DOM, `::part()`, and the component families."}], "app": {"intro": ["This section is the assembly. The lessons teach the parts; the graded exercise is a working multi-page application in NgModule form, and this is its shape.", "The specification: a login page, then a tabs shell with four tabs. Two of those tabs are catalogues of a different genre, and each opens a nested detail route so the URL reads `tabs/movies/01` rather than opening a pushed top-level page. One tab is a deliberately non-functional search page, and the account tab carries an exit button that returns to login."], "route_map": ["app-routing.module.ts", "  ''      -> redirectTo 'login', pathMatch: 'full'", "  'login' -> loadChildren LoginPageModule", "  'tabs'  -> loadChildren TabsPageModule", "", "tabs-routing.module.ts", "  '' -> TabsPage, children:", "        'movies'  -> loadChildren MoviesPageModule", "        'menu'    -> loadChildren MenuPageModule", "        'search'  -> loadChildren SearchPageModule", "        'account' -> loadChildren AccountPageModule", "        ''        -> redirectTo '/tabs/movies', pathMatch: 'full'", "", "movies-routing.module.ts", "  ''    -> MoviesPage", "  ':id' -> loadChildren MovieDetailPageModule      gives /tabs/movies/01", "", "movie-detail-routing.module.ts", "  ''    -> MovieDetailPage                         note: empty, because the parent took ':id'", "", "menu-routing.module.ts", "  ''    -> MenuPage", "  ':id' -> loadChildren MenuDetailPageModule        gives /tabs/menu/01", "", "menu-detail-routing.module.ts", "  ''    -> MenuDetailPage"], "route_note": ["The `:id` segment hangs off its own catalogue feature, not off the tabs route. It is declared once. Copying `{ path: ':id' }` into the detail module as well produces a route that can never be reached, because the parent has already consumed the segment.", "Opening a detail from a list is `this.router.navigate(['/tabs/movies', id])`. The array form substitutes the id into `:id`.", "The exit button is `this.navCtrl.navigateRoot('/login', { replaceUrl: true })`: `navigateRoot` sets a root transition instead of a forward push, and `replaceUrl` replaces the entry being left, so Back cannot re-enter the tabs once the session is cleared."], "walkthrough": [["1. Bootstrap", "`src/main.ts` bootstraps `AppModule`, `AppModule` declares `AppComponent`, imports `AppRoutingModule` and `IonicModule.forRoot()`, and the app shell renders `<ion-app><ion-router-outlet><\/ion-router-outlet><\/ion-app>`."], ["2. Login", "Two `ion-input` fields and a button, bound with `[(ngModel)]`, checked against a hardcoded credential pair, then `router.navigate(['/tabs/movies'], { replaceUrl: true })` so the login form does not stay behind it. `FormsModule` must be imported by `LoginPageModule` or the template will not compile."], ["3. Tabs shell", "`TabsPage` renders `<ion-tabs>` with four `ion-tab-button` children, each carrying both `tab` and `href`. The empty-path child route redirects to `/tabs/movies`."], ["4. Movies catalogue", "`MoviesPage` injects the movie service and the router, loads the array in `ngOnInit`, renders `ion-card` or `ion-item` per record, and opens a detail with the array form of `navigate`."], ["5. Movie detail", "`MovieDetailPage` reads `:id` from `route.snapshot.paramMap.get('id')` in `ngOnInit`, converts it with `Number(...)`, and looks the record up. The template guards the content with `*ngIf` and uses `movie?.title` in the toolbar, because the record is not present on the first render pass."], ["6. Menu catalogue", "The same shape as movies, with a different genre and a stock count. This is what makes the design symmetric and covers the requirement for two catalogues."], ["7. Search", "An `ion-searchbar` that renders and binds with `[(ngModel)]` but filters nothing. Deliberately defunct."], ["8. Account and exit", "The account record plus the exit button, which clears the session and calls `navigateRoot('/login', { replaceUrl: true })`."]], "layers": ["**Models** (`src/app/models/`): one interface per record, `Movie` and `MenuItem`, plus an account shape. Interfaces, not classes, because the records carry no behaviour.", "**Services** (`src/app/services/`): one per catalogue, `@Injectable({ providedIn: 'root' })`, holding an in-memory array and exposing `getX()` and `getXById(id)` where the second returns `X | undefined` so the compiler forces the template to guard the miss.", "**Pages** (`src/app/`): each page is five files, `x.page.ts`, `x.page.html`, `x.page.scss` and `x-routing.module.ts`, plus `x.module.ts`. The routing module and the page module are what `loadChildren` resolves."]}, "defects": {"intro": ["`reference/CARTALLA_ACTIVITY3/` in this workspace is a submitted activity of the same broad shape. It is a useful architecture reference and it contains five defect patterns that are worth recognising, because they are exactly the kind of thing that costs a lab session. The reviewer tests two of them."], "table": [["Defect", "Where", "Correct form"], ["`import { Service } from '@angular/core'` and `@Service()`", "`services/movieinfoService/movieinfo-service.ts` and `services/meService/me-service.ts`", "Angular exports no `Service` decorator. Use `@Injectable({ providedIn: 'root' })`. The file will not compile as written."], ["`import { IonicModule } from '@ionic/angular'`", "a page module or `app.module.ts` written from a standalone tutorial", "`@ionic/angular` is the standalone entry point in Ionic 9 and exports no `IonicModule`, so the build fails with `NG8001` on every `ion-*` element. The class based API is `@ionic/angular/lazy`, which is where this reference imports it from correctly."], ["`'../../assets/movie-posters/iron-man.jpg'`", "the movie service's data", "Asset URLs are root relative: `'assets/movie-posters/iron-man.jpg'`."], ["Detail route is a sibling of `tabs`, so the URL is `/movie-detail/1`", "`app-routing.module.ts`", "Declare `:id` as a child of the catalogue feature so the URL nests as `/tabs/movies/01`."], ["Detail module declares `{ path: ':id' }`", "`movie-detail-routing.module.ts`", "The detail module's path is `''`, because its parent already consumed the segment."]], "note": ["What the reference gets right and this project reuses: data held in the service as an in-memory array, with `getMovies()` and `getMovieById(id)`; one service per concern; interfaces for the record shapes; and the Ionic back button on the detail toolbar."]}, "plan": [["Priority 1. Rebuild by memory", ["Create a blank NgModule Ionic project, then rebuild the 46-file canonical project without looking. Use the Drill mode's line checker as the judge; treat anything under 92 per cent as not yet known.", "The order matters and the drill enforces it: a page cannot be routed to before its module exists, so config, then models, then services, then login, then the tabs shell, then the catalogues, then the detail pages, then search and account.", "Do this daily until it is clean. It is the only part of the exam that cannot be improvised."]], ["Priority 2. Identification, and the small print first", ["Drill the identification bank to 100 per cent. It is the only written format with evidence behind it, and the previous quiz used it alone.", "Then run the small-print items as a timed recall pass, using the filter button in the HTML reviewer or section 6.9 here. These are the ones that will not come when you want them, so they need repetition and not reading. Do not skip them because the material looks trivial; trivial is what the previous paper asked."]], ["Priority 3. The written code exercises", ["Work Part VI with pen and paper. Writing the routing modules by hand is what exposes whether the `forRoot`/`forChild` and `loadChildren`/`loadComponent` distinctions are actually known or merely recognised."]], ["Priority 4. Traps as true-or-false", ["Run the modified true-or-false part once a week. Its statements are the NgModule-versus-standalone and lifecycle traps, which is where marks are genuinely at risk rather than merely missed."]], ["Standing risks", ["Ionic documentation and any search result will show the standalone API. Every routing answer must be translated back to NgModule before it is written down.", "`standalone: false` is required on Angular 19 and later because these pages are declared in modules. Omitting it is a compile error that is easy to think of as a version problem.", "Route parameters are strings. Convert before comparing.", "The wildcard `**` must be last, and every empty-path redirect needs `pathMatch: 'full'`."]]]}, "sideFor": {"drill": "<div class=\"side-h\">Build order<\/div><div class=\"tree\"><div class=\"dir\">1. Project scaffold and app shell<\/div><div class=\"dir\">2. Data shapes<\/div><div class=\"dir\">3. Services<\/div><div class=\"dir\">4. Login page<\/div><div class=\"dir\">5. Tabs shell<\/div><div class=\"dir\">6. Movies catalogue<\/div><div class=\"dir\">7. Movie detail sub-page<\/div><div class=\"dir\">8. Menu catalogue<\/div><div class=\"dir\">9. Menu detail sub-page<\/div><div class=\"dir\">10. Defunct search tab<\/div><div class=\"dir\">11. Account page and exit<\/div><\/div>", "written": "<div class=\"side-h\">Written midterm<\/div><div class=\"tree\"><div class=\"dir\">I. Identification &middot; 84 items<\/div><div class=\"dir\">II. Multiple choice &middot; 30 items<\/div><div class=\"dir\">III. Modified true or false &middot; 20 items<\/div><div class=\"dir\">IV. Enumeration &middot; 10 items<\/div><div class=\"dir\">V. Short answers &middot; 7 items<\/div><div class=\"dir\">VI. Handwritten code &middot; 12 items<\/div><div class=\"side-h\">Identification by lesson<\/div><div class=\"dir\">L01 &middot; 21 items<\/div><div class=\"dir\">L01.2 &middot; 9 items<\/div><div class=\"dir\">L02 &middot; 16 items<\/div><div class=\"dir\">L03 &middot; 10 items<\/div><div class=\"dir\">L04 &middot; 8 items<\/div><div class=\"dir\">L05 &middot; 7 items<\/div><div class=\"dir\">L06 &middot; 7 items<\/div><div class=\"dir\">L07 &middot; 6 items<\/div><\/div>", "blanks": "<div class=\"side-h\">Fill in the blanks<\/div><div class=\"tree\"><div class=\"dir\">B1 &middot; L02 slide 5 &middot; Root routing module<\/div><div class=\"dir\">B2 &middot; L02 slide 14 &middot; Tab children<\/div><div class=\"dir\">B3 &middot; L02 slides 10 and 14 &middot; Nested detail route<\/div><div class=\"dir\">B4 &middot; L02 slide 10 &middot; Reading the route parameter<\/div><div class=\"dir\">B5 &middot; L04 slide 6 &middot; Service registration<\/div><div class=\"dir\">B6 &middot; L04 slides 6 to 7 &middot; Constructor versus ngOnInit<\/div><div class=\"dir\">B7 &middot; L02 slide 14 &middot; Tab bar markup<\/div><div class=\"dir\">B8 &middot; L02 slide 12 &middot; Ionic back button<\/div><div class=\"dir\">B9 &middot; L02 slide 9 &middot; Exit to login<\/div><div class=\"dir\">B10 &middot; L05 slide 5 &middot; Declaring a data shape<\/div><div class=\"dir\">B11 &middot; L03 slide 6 &middot; Page module wiring<\/div><div class=\"dir\">B12 &middot; L03 slide 6 &middot; Ionic root configuration<\/div><div class=\"dir\">B13 &middot; L07 slide 9 &middot; Theme variable<\/div><div class=\"dir\">B14 &middot; L02 slide 5 &middot; Empty path redirect<\/div><\/div>", "notes": "<div class=\"side-h\">Contents<\/div><div class=\"tree\"><div class=\"dir\">Read this first<\/div><div class=\"dir\">Project-wide traps<\/div><div class=\"dir\">Where the sources stop<\/div><\/div>", "ref": "", "review": "<div class=\"side-h\">Review<\/div><div class=\"tree\"><div class=\"dir\">Exam intelligence<\/div><div class=\"dir\">Foundations<\/div><div class=\"dir\">L01 &middot; 16 slides<\/div><div class=\"dir\">L01.2 &middot; 29 slides<\/div><div class=\"dir\">L02 &middot; 16 slides<\/div><div class=\"dir\">L03 &middot; 15 slides<\/div><div class=\"dir\">L04 &middot; 15 slides<\/div><div class=\"dir\">L05 &middot; 17 slides<\/div><div class=\"dir\">L06 &middot; 23 slides<\/div><div class=\"dir\">L07 &middot; 22 slides<\/div><div class=\"dir\">The application<\/div><div class=\"dir\">Defects<\/div><div class=\"dir\">Revision plan<\/div><\/div>"}}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const OV = D.overview || [];  // lessons whose identification items are small-print recall items
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const TOK = new RegExp([
  "(&lt;!--[\\s\\S]*?--&gt;|\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)",
  "('[^'\\n]*'|\"[^\"\\n]*\"|`[^`]*`)",
  "(&lt;\\/?[A-Za-z][\\w-]*|&gt;|\\/&gt;)",
  "(--[A-Za-z0-9-]+)",
  "(@[A-Za-z_]\\w*)",
  "\\b(\\d+(?:\\.\\d+)?)\\b",
  "\\b(import|from|export|default|class|interface|extends|implements|constructor|return|if|else|true|false|null|undefined|void|private|public|async|await|new|this|const|let|var|number|string|boolean|any|of|in|module|declarations|imports|providers|bootstrap|standalone)\\b"
].join("|"), "g");
const CLS = ["c-c","c-s","c-t","c-v","c-d","c-n","c-k"];
function hl(code){
  return esc(code).replace(TOK, (m, ...g) => {
    const i = g.slice(0,7).findIndex(x => x !== undefined);
    return i < 0 ? m : '<span class="' + CLS[i] + '">' + m + '</span>';
  });
}
const LS = "appdev_ionic_v2";
let store = {};
try { store = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch (e) { store = {}; }
// the progress buckets have to exist before any handler writes into them
store.steps  = store.steps  || {};
store.blanks = store.blanks || {};
store.ident  = store.ident  || {};
store.mc     = store.mc     || {};
store.mcp    = store.mcp    || {};
store.mtf    = store.mtf    || {};
store.ens    = store.ens    || {};
store.ce     = store.ce     || {};
store.review = store.review || {};
function save(){ try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} }
function setProg(){
  const idc = Object.values(store.ident || {}).filter(v => v === 1).length;
  const mc  = Object.values(store.mc || {}).filter(v => v === 1).length;
  const mtf = Object.values(store.mtf || {}).filter(v => v === 1).length;
  const en  = Object.values(store.ens || {}).filter(v => v === 1).length;
  const bc  = Object.values(store.blanks || {}).filter(v => v === 1).length;
  const sc  = Object.values(store.steps || {}).filter(Boolean).length;
  const rv  = Object.keys(store.review || {}).length;
  document.getElementById('prog').textContent =
    'ID ' + idc + '/' + D.ident.length + '  |  MC ' + mc + '/' + D.mc.length +
    '  |  MTF ' + mtf + '/' + D.mtf.length + '  |  enum ' + en + '/' + D.enum.length +
    '  |  blanks ' + bc + '/' + D.blanks.length + '  |  files ' + sc + '/' + D.files_n +
    '  |  review ' + rv + '/' + D.review.lessons.length;
}
/* ------------------------------------------------------------- reference */
let refSel = null, refFilter = '';
const LANGNAME = { ts: 'TypeScript', html: 'HTML', scss: 'SCSS', json: 'JSON', md: 'Markdown' };
const langLabel = p => LANGNAME[D.langs[p]] || (D.langs[p] || 'text');
function fileNames(){ return Object.keys(D.files); }
function applyFilter(q){
  refFilter = (q || '').toLowerCase();
  const rows = document.querySelectorAll('#explorer button.fi');
  rows.forEach(b => {
    b.style.display = (!refFilter || b.dataset.p.toLowerCase().includes(refFilter)) ? '' : 'none';
  });
  document.querySelectorAll('#explorer .dir').forEach(d => {
    let n = d.nextElementSibling, any = false;
    while (n && n.classList.contains('fi')) {
      if (n.style.display !== 'none') any = true;
      n = n.nextElementSibling;
    }
    d.style.display = any ? '' : 'none';
  });
}
function explorerHtml(sel){
  const groups = {};
  fileNames().forEach(p => {
    const dir = p.split('/').slice(0, -1).join('/');
    (groups[dir] = groups[dir] || []).push(p);
  });
  let h = '<div class="exp-h"><span>Project explorer</span><span>' + D.files_n + ' files</span></div>' +
    '<div class="exp-search"><input id="qfiles" placeholder="Search ' + D.files_n + ' project files..." /></div>' +
    '<div class="tree">';
  Object.keys(groups).sort().forEach(dir => {
    const depth = dir ? dir.split('/').length - 1 : 0;
    h += '<div class="dir" style="padding-left:' + (6 + depth * 12) + 'px"><span class="chev">&#9662;</span>' +
         esc(dir || 'src') + '</div>';
    groups[dir].forEach(p => {
      h += '<button class="fi' + (p === sel ? ' on' : '') + '" data-p="' + esc(p) + '"' +
           ' style="padding-left:' + (10 + (depth + 1) * 12) + 'px"><span class="ico"></span>' +
           esc(p.split('/').pop()) + '</button>';
    });
  });
  return h + '</div>';
}
function codePane(p){
  const text = D.files[p] || '';
  const lines = text.split('\n');
  const notes = D.notes[p] || [];
  const body = lines.map((l, i) =>
    '<div class="cl"><span class="ln">' + (i + 1) + '</span><span class="lc">' +
    (hl(l) || '&nbsp;') + '</span></div>').join('');
  return '<div class="chiprow"><span class="chip">' + esc(langLabel(p)) + '</span>' +
    '<b class="fpath">' + esc(p) + '</b>' +
    '<span class="lcnt">' + lines.length + ' lines</span></div>' +
    (notes.length
      ? '<div class="curator"><div class="cur-h">&#9673; Curator notes for this file</div><ul>' +
        notes.map(n => '<li>' + n + '</li>').join('') + '</ul></div>'

// Two cosmetic variants are legitimate TypeScript and must not count as wrong:
// an optional return annotation (`foo() {` vs `foo(): void {`) and brace spacing
// (`{ }` vs `{}`). Both are normalised away before any line comparison.
const lineKey = s => s.trim().replace(/:\s*void(?=\s*\{)/, '').replace(/\{\s*\}/g, '{}').replace(/\s+/g, ' ');
function norm(s){ return s.replace(/\r/g,'').split('\n').map(l => l.replace(/\s+$/,'')).join('\n').trim(); }
function compare(user, ref){
  const u = norm(user).split('\n').filter(l => l.trim().length);
  const r = norm(ref).split('\n').filter(l => l.trim().length);
  const rs = new Set(r.map(l => lineKey(l)));
  const hit = u.filter(l => rs.has(lineKey(l))).length;
  const pct = r.length ? Math.round(hit / r.length * 100) : 0;
  let first = null;
  for (let i = 0; i < Math.max(u.length, r.length); i++){
    if (lineKey(u[i] || '') !== lineKey(r[i] || '')){ first = { i: i + 1, you: (u[i] || '').trim(), want: (r[i] || '').trim() }; break; }
  }
  return { pct: pct, first: first, wantLines: r.length, hit: hit };
}

function fold(s){
  return String(s).toLowerCase()
    .replace(/[`'"]/g, '')
    .replace(/[^a-z0-9*$]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
const STOP = {x:1, the:1, a:1, an:1, of:1};
function toks(s){ return fold(s).split(' ').filter(t => t && !STOP[t]); }
function accepts(given, key, alts){
  const raw = String(given).trim().toLowerCase();
  if (!raw) return false;
  const g = fold(given);
  const cands = [key].concat(alts || []);
  for (let n = 0; n < cands.length; n++){
    const c = String(cands[n]);
    const k = fold(c);
    // a key made only of punctuation (** , '' ) can only be matched literally
    if (!k){ if (raw === c.trim().toLowerCase()) return true; continue; }
    if (!g) continue;
    if (g === k) return true;
    const short = g.length <= k.length ? g : k;
    const long = g.length <= k.length ? k : g;
    if (short.length >= 4 && long.indexOf(short) >= 0) return true;
  }
  return false;
}
function tokensHit(given, answer){
  const g = new Set(toks(given)), a = toks(answer);
  if (!a.length) return false;
  return a.every(t => g.has(t));
}
function marked(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code class="term">$1</code>')
    .replace(/__([\s\S]+?)__/g, '<u class="uw">$1</u>');
}

  });

  /* Part IV */
  host.querySelectorAll('[data-enc]').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.enc), e = D.enum[i];
    const ins = Array.from(host.querySelectorAll('input[data-key^="en' + i + ':"]'));
    const pool = e.answers.slice();
    let hit = 0;
    ins.forEach(inp => {
      let found = -1;
      for (let n = 0; n < pool.length; n++){ if (tokensHit(inp.value, pool[n])){ found = n; break; } }
      if (found >= 0){ pool.splice(found, 1); hit++; inp.className = 'ans ok'; }
      else { inp.className = 'ans' + (inp.value.trim() ? ' bad' : ''); }
    });
    const v = document.getElementById('env' + i);
    v.className = 'verdict ' + (hit >= e.count ? 'ok' : (hit ? 'part' : 'bad'));
    v.textContent = hit + ' of ' + e.count + ' named' + (hit ? '' : ', use Show for the expected answer');
    store.ens[i] = hit >= e.count ? 1 : 0; save(); setProg();
  });
  host.querySelectorAll('[data-ens]').forEach(b => b.onclick = () =>
    document.getElementById('enk' + Number(b.dataset.ens)).classList.remove('hidden'));

  /* Parts V and VI */
  host.querySelectorAll('[data-sshow]').forEach(b => b.onclick = () =>
    document.getElementById('sw' + Number(b.dataset.sshow)).classList.toggle('hidden'));
  host.querySelectorAll('[data-ces]').forEach(b => b.onclick = () =>
    document.getElementById('cek' + Number(b.dataset.ces)).classList.toggle('hidden'));
  host.querySelectorAll('[data-cec]').forEach(b => b.onclick = () => {
    const i = Number(b.dataset.cec), x = D.code[i];
    const ta = host.querySelector('textarea[data-key="ce' + i + '"]');
    const v = document.getElementById('cev' + i);
    if (!ta.value.trim()){ v.className = 'verdict bad'; v.textContent = 'nothing typed yet'; return; }
    const r = compare(ta.value, x.model);
    v.className = 'verdict ' + (r.pct >= 92 ? 'ok' : (r.pct >= 60 ? 'part' : 'bad'));
    v.textContent = r.pct + '% of the model lines matched' +
      (r.first ? '  |  first mismatch line ' + r.first.i : '');
    store.ce[i] = r.pct >= 92 ? 1 : 0; save(); setProg();
  });
  host.querySelectorAll('[data-goto]').forEach(b => b.onclick = () =>
    document.getElementById(b.dataset.goto).scrollIntoView({ behavior: 'smooth', block: 'start' }));
}
/* ----------------------------------------------------------------- notes */
function renderNotes(){
  const host = document.getElementById('m-notes');
  let h = '<div class="card"><h2>Read this first</h2>' + D.intro.map(p => '<p>' + p + '</p>').join('') + '</div>' +
    '<div class="card"><h2>Project-wide traps</h2><ul class="notes">' +
    D.global.map(n => '<li>' + n + '</li>').join('') + '</ul></div>' +
    '<div class="card"><h2>Where the sources stop</h2><ul class="notes">' +
    D.gaps.map(n => '<li>' + n + '</li>').join('') + '</ul></div>';
  host.innerHTML = h;
}
/* ------------------------------------------------------------------ review */
function inline(s){
  return esc(String(s))
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code class="term">$1</code>');
}
function revUl(items){ return '<ul class="notes">' + items.map(x => '<li>' + inline(x) + '</li>').join('') + '</ul>'; }
function revTable(rows){
  if (!rows || !rows.length) return '';
  return '<table><thead><tr>' + rows[0].map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.slice(1).map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table>';
}
function revDefs(defs){
  if (!defs || !defs.length) return '';
  return '<table><thead><tr><th>Term</th><th>The deck\'s wording</th><th>In simple terms</th></tr></thead><tbody>' +
    defs.map(d => '<tr><td><code class="term">' + esc(d[0]) + '</code></td><td>' + inline(d[1]) +
      '</td><td>' + inline(d[2]) + '</td></tr>').join('') + '</tbody></table>';
}
function renderReview(){
  const R = D.review, host = document.getElementById('m-review');
  let h = '<div class="card"><h2>' + esc(R.meta.title) + '</h2>' +
    '<div class="meta">' + esc(R.meta.subtitle) + '</div>' +
    R.meta.how_to_use.map(p => '<p>' + inline(p) + '</p>').join('') + '</div>';
  h += '<div class="revbar">' +
    R.lessons.map(l => '<button class="act" data-rev="' + esc(l.id) + '">' + esc(l.id) + '</button>').join('') +
    '<button class="act" data-rev="exam">Exam intelligence</button>' +
    '<button class="act" data-rev="app">The application</button>' +
    '<button class="act" data-rev="defects">Defects</button>' +
    '<button class="act" data-rev="plan">Revision plan</button>' +
    '<button class="act" data-rev="gaps">Gaps</button></div>';
  h += '<div class="card" id="rev-exam"><h2>Exam intelligence</h2>';
  R.intel.forEach((x, i) => { h += '<h3>' + (i + 1) + '. ' + esc(x[0]) + '</h3>' + revUl(x[1]); });
  h += '</div>';
  h += '<div class="card" id="rev-found"><h2>Foundations: NgModule, Angular and Ionic</h2>' +
    R.foundations.intro.map(p => '<p>' + inline(p) + '</p>').join('') +
    revTable(R.foundations.table) + revUl(R.foundations.vocab_note) + '</div>';
  R.lessons.forEach(L => {
    const done = !!(store.review && store.review[L.id]);
    h += '<div class="card" id="rev-' + esc(L.id) + '"><h2>' + esc(L.id) + ': ' + esc(L.title) +
      '<span class="tag">' + L.slides + ' slides &middot; ' + L.topics.length + ' topics</span></h2>' +
      '<div class="meta">' + inline(L.purpose) + '</div>' +
      (L.ngmodule ? '<div class="warnbox"><b>NgModule note.</b> ' + inline(L.ngmodule) + '</div>' : '');
    L.topics.forEach((t, ti) => {
      h += '<h3>' + esc(L.id) + '.' + (ti + 1) + ' ' + esc(t.title) + '</h3>' +
        (t.slides && t.slides.length ? '<div class="meta">Deck slides ' + t.slides.join(', ') + '</div>' : '') +
        revUl(t.points) + revDefs(t.defs);
      (t.code || []).forEach(c => {
        h += '<div class="meta">Listing from slide ' + c.slide + ', as the deck prints it</div>' +
          '<pre class="revcode"><code>' + esc(c.code) + '</code></pre>';
      });
      if (t.deck && t.deck.length) {
        h += '<details><summary>Deck text: ' + t.deck.length + ' slide(s)</summary>' +
          t.deck.map(d => '<div class="deckblk"><b>Slide ' + d.n + ': ' + esc(d.title) + '</b>' +
            '<pre class="revdeck">' + esc(d.lines.join('\n')) + '</pre></div>').join('') + '</details>';
      }
    });
    h += '<h3>Traps</h3>' + revUl(L.traps) +
      '<p><b>Exam focus.</b> ' + inline(L.exam) + '</p>' +
      '<div class="row"><button class="act' + (done ? ' done' : '') + '" data-revdone="' + esc(L.id) + '">' +
      (done ? 'Revised: ' + esc(L.id) : 'Mark ' + esc(L.id) + ' revised') + '</button></div></div>';
  });
  h += '<div class="card" id="rev-app"><h2>The canonical application</h2>' +
    R.app.intro.map(p => '<p>' + inline(p) + '</p>').join('') +
    '<h3>Route map</h3><pre class="revcode">' + esc(R.app.route_map.join('\n')) + '</pre>' +
    revUl(R.app.route_note) +
    '<h3>Build walkthrough</h3>' +
    R.app.walkthrough.map(w => '<p><b>' + esc(w[0]) + '.</b> ' + inline(w[1]) + '</p>').join('') +
    '<h3>The three layers: models, services, pages</h3>' + revUl(R.app.layers) + '</div>';
  h += '<div class="card" id="rev-defects"><h2>Reference activity defects</h2>' +
    R.defects.intro.map(p => '<p>' + inline(p) + '</p>').join('') +
    revTable(R.defects.table) + revUl(R.defects.note) + '</div>';
  h += '<div class="card" id="rev-plan"><h2>Revision plan</h2>';
  R.plan.forEach(p => { h += '<h3>' + esc(p[0]) + '</h3>' + revUl(p[1]); });
  h += '</div>';
  h += '<div class="card" id="rev-gaps"><h2>Where the sources stop</h2>' + revUl(D.gaps) + '</div>';
  host.innerHTML = h;
  host.dataset.rendered = '1';
  host.querySelectorAll('[data-rev]').forEach(b => {
    if (store.review && store.review[b.dataset.rev]) b.classList.add('done');
    b.onclick = () => {
      const el = document.getElementById('rev-' + b.dataset.rev);
      if (el) el.scrollIntoView({ block: 'start' });
    };
  });
  host.querySelectorAll('[data-revdone]').forEach(b => b.onclick = () => {
    store.review = store.review || {};
    const id = b.dataset.revdone;
    if (store.review[id]) { delete store.review[id]; } else { store.review[id] = 1; }
    const on = !!store.review[id];
    b.classList.toggle('done', on);
    b.textContent = on ? 'Revised: ' + id : 'Mark ' + id + ' revised';
    save(); setProg();
  });
}
/* ------------------------------------------------------------------ boot */
function tipFor(m){
  const tips = D.tips || [];
  if (!tips.length) return '';
  const idx = { ref: 0, drill: 1, written: 2, blanks: 3, review: 4, notes: 5 }[m] || 0;
  return '<div class="tipbox"><div class="t">Exam success tip</div><p>' +
    tips[idx % tips.length] + '</p></div>';
}
function verInfo(){
  return '<div class="ver"><div>Ionic Framework: v9.0.6 (NgModule)</div>' +
    '<div>Angular v22, lazy loaded pages</div>' +
    '<div>Capacitor: configured for Android</div></div>';
}
function renderRail(m){
  const rail = document.getElementById('rail');
  let h = '';
  if (m === 'ref') {
    const p = refSel || fileNames()[0] || '';
    const dir = p.split('/').slice(0, -1).join('/') || 'src';
    h += '<div class="rail-h">On this page</div><div class="rail-list"><b>' + D.files_n +
         ' canonical files</b>Complete source with syntax highlighting and curator notes.' +
         '<div style="margin-top:8px">Current: <code>' + esc(p) + '</code></div></div>';
    h += tipFor(m);
    h += '<div class="rail-h">Folder</div><div class="rail-list"><code>' + esc(dir) + '</code></div>';
  } else {
    const titles = { drill: 'Build drill', review: 'Lesson review', written: 'Written exam',
                     blanks: 'Fill in the blanks', notes: 'Notes' };
    h += '<div class="rail-h">On this page</div><div class="rail-list"><b>' +
         (titles[m] || '') + '</b>Progress is saved in this browser as you work.</div>';
    h += tipFor(m);
  }
  h += verInfo();
  rail.innerHTML = h;
}
function buildSidebar(){
  const aside = document.getElementById('side');
  const steps = (D.steps || []).map((s, i) =>
    '<button class="ni" data-jump="drill" data-i="' + i + '"><span class="n">' + (i + 1) + '</span>' +
    esc(s.title) + '</button>').join('');
  const parts = (D.parts || []).map((p, i) =>
    '<button class="ni" data-jump="written" data-i="' + i + '"><span class="n">' + esc(p[0]) + '</span>' +
    esc(p[1]) + '<span class="c">' + p[2] + '</span></button>').join('');
  aside.innerHTML =
    '<div class="side-search"><input id="sq" placeholder="Search topics" /></div>' +
    '<div class="callout"><b>Ionic Rule #1</b>Always declare <code>standalone: false</code> on Angular 19 ' +
    'components when inside an NgModule.</div>' +
    '<div class="grp"><div class="grp-h">Getting started</div>' +
      '<button class="ni" data-jump="review"><span class="n">&#9636;</span>Lesson Review (L01-L07)' +
      '<span class="c">' + (D.review.lessons || []).length + ' decks</span></button>' +
      '<button class="ni" data-jump="notes"><span class="n">&#9636;</span>Architecture Guide</button>' +
      '<button class="ni" data-jump="drill"><span class="n">&#9636;</span>Build Drill' +
      '<span class="c">' + (D.steps || []).length + ' steps</span></button>' +
    '</div>' +
    '<div class="grp"><div class="grp-h">Build steps <span class="c">' + (D.steps || []).length +
      ' steps</span></div>' + steps + '</div>' +
    '<div class="grp"><div class="grp-h">Self-test &amp; reviewer</div>' + parts +
      '<button class="ni" data-jump="blanks"><span class="n">&#9636;</span>Fill in the Blanks' +
      '<span class="c">' + (D.blanks || []).length + '</span></button>' +
    '</div>' +
    '<div class="grp"><div class="grp-h">Code explorer</div>' +
      '<button class="ni" data-jump="ref"><span class="n">&#9636;</span>File Tree Reference' +
      '<span class="c">' + D.files_n + ' files</span></button>' +
    '</div>';
  aside.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
    const m = b.dataset.jump;
    mode(m);
    if (b.dataset.i !== undefined) {
      const host = document.getElementById('m-' + m);
      const cards = host.querySelectorAll('.card');
      const el = cards[+b.dataset.i];
      if (el) setTimeout(() => el.scrollIntoView({ block: 'start', behavior: 'smooth' }), 40);
    }
  });
}
function mode(m){
  document.querySelectorAll('nav.modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  document.querySelectorAll('section.mode').forEach(s => s.classList.toggle('on', s.id === 'm-' + m));
  document.querySelectorAll('#side .ni').forEach(b =>
    b.classList.toggle('on', b.dataset.jump === m && b.dataset.i === undefined));
  if (m === 'ref') renderRef();
  if (m === 'review' && !document.getElementById('m-review').dataset.rendered) renderReview();
  renderRail(m);
  store.lastMode = m; save();
}
document.querySelectorAll('nav.modes button').forEach(b => b.onclick = () => mode(b.dataset.mode));
const gs = document.getElementById('gsearch');
if (gs) {
  gs.addEventListener('input', () => {
    if (!gs.value) return;
    if (!document.getElementById('m-ref').classList.contains('on')) mode('ref');
    applyFilter(gs.value);
  });
  gs.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); mode('ref'); applyFilter(gs.value); }
  });
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (gs) gs.focus();
  }
});
buildSidebar();
renderDrill(); renderWritten(); renderBlanks(); renderNotes(); renderRef();
// the written exam is the landing view: the graded midterm is written, and
// identification alone was the format of the previous written quiz
mode(store.lastMode || 'written');
setProg();
</script>
</body>
</html>
